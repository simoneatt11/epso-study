, "generated_at": "2026-10-14 03:30:00+00:00"}, "html": "<p>Everything so far was the <strong>slow, safe<\/strong> method — and it always works. This level adds shortcuts\nthat save time <strong>once the slow method feels comfortable<\/strong>. Use them when they make things easier;\nignore them when they don't. A correct slow answer is worth exactly the same as a fast one.<\/p>\n<h2 id=\"estimation\">Estimation<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Before calculating, look at the answer options. If they are <strong>far apart<\/strong>, an <button type=\"button\" class=\"gl\" data-term=\"estimate\">estimate<\/button> with\nrounded numbers is enough to pick the right one — no exact calculation needed.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>In a supermarket you round €2.95 + €4.10 + €1.99 to 3 + 4 + 2 = about €9. You don't need the exact\ncents to know whether €10 is enough.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Share of a total<\/p>\n<p>\"Region A has 760, B 1,190, C 420 and D 1,630 farms. What share of all farms is in A? Options: 8%, 13%, 19%, 27%, 33%.\"<\/p>\n<ol>\n<li>The options are at least 5 points apart → estimate.<\/li>\n<li>Round: 800, 1,200, 400, 1,600. Drop the zeros: 8, 12, 4, 16. Total ≈ 40.<\/li>\n<li>A's share ≈ 8 ÷ 40 = 0.20 → closest option <strong>19%<\/strong>.<\/li>\n<li>(Exact: 760 ÷ 4,000 = 19%.) Same answer, a fraction of the effort.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-fast\">\n<p class=\"box-h\">Fast method<\/p>\n<p>If you round one number <strong>up<\/strong>, try to round another <strong>down<\/strong> — the errors partly cancel.<\/p>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L4-001,num-L4-002,num-L4-003\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Estimating when the options are close.<\/strong> If the options are 21.5%, 22.0% and 22.5%, an estimate\ncannot separate them. Look at the spacing of the options first — that decides your method.<\/p>\n<\/div>\n<h2 id=\"magnitude-elimination\">Eliminating by order of magnitude<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The <button type=\"button\" class=\"gl\" data-term=\"order-of-magnitude\">order of magnitude<\/button> of a number is its size in powers of ten: tens,\nhundreds, thousands, millions. Wrong options are often the right digits with <strong>the wrong number of\nzeros<\/strong>. Decide the order of magnitude first and you can cross out several options immediately.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A coffee costs about €3, not €30 or €0.30. You know the size before you know the exact price.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: \"€46.2 billion shared among 10.5 million people\" — options €44, €440, €4,400, €44,000<\/p>\n<ol>\n<li>Billions ÷ millions = thousands. So the answer is in the <strong>thousands<\/strong> of euros.<\/li>\n<li>Only €4,400 is in the thousands. Done — no division needed.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L4-004,num-L4-005,num-L4-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Losing track of units halfway.<\/strong> Write the unit next to each number as you go (€ bn, million\npeople). The order of magnitude follows from the units.<\/p>\n<\/div>\n<h2 id=\"quick-variation\">Quick variations<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>To find a percentage change quickly, divide <strong>new ÷ old<\/strong> and read the answer: 1.08 means +8%,\n0.93 means −7%. One division instead of a subtraction plus a division.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Your electricity bill went from €80 to €92. 92 ÷ 80 = 1.15 → the bill is up <strong>15%<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Which country grew most?<\/p>\n<p>Exports went from 240 to 276 (A) and from 410 to 451 (B).<\/p>\n<ol>\n<li>A: 276 ÷ 240 = 1.15 → +15%.<\/li>\n<li>B: 451 ÷ 410 = 1.10 → +10%.<\/li>\n<li><strong>A<\/strong> grew more in percentage terms — even though B gained more in absolute terms (41 vs 36).<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-fast\">\n<p class=\"box-h\">Fast method<\/p>\n<p>Reading the multiplier: 1.0x → +x%; 0.9x → a fall of (100 − 9x)%. For example 0.96 → −4%, 0.85 → −15%.<\/p>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L4-007,num-L4-008,num-L4-009\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>\"Grew most\" is ambiguous until you check the question.<\/strong> Largest increase in units (subtract)\nor in percent (divide)? They can give different answers.<\/p>\n<\/div>\n<h2 id=\"fraction-shortcuts\">Fraction shortcuts<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Some percentages are friendly fractions. Using the fraction is often faster than the decimal:\n<strong>50% = ½, 25% = ¼, 20% = ⅕, 12.5% = ⅛, 10% = 1/10, 33.3% ≈ ⅓, 66.7% ≈ ⅔, 75% = ¾.<\/strong><\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"25% off €64\" → a quarter of 64 = €16 off. Faster than 64 × 0.25.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Three quick ones<\/p>\n<ol>\n<li>12.5% of 480 → ⅛ of 480 = 480 ÷ 8 = <strong>60<\/strong>.<\/li>\n<li>45 is 20% of what? 20% = ⅕, so the whole is 5 × 45 = <strong>225<\/strong> (dividing by 0.2 is multiplying by 5).<\/li>\n<li>Dividing by 0.25 is multiplying by 4: 37 ÷ 0.25 = <strong>148<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L4-010,num-L4-011,num-L4-012\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>33% is not exactly ⅓.<\/strong> ⅓ = 33.33…%. For exam options that are close together, use the exact\ndecimal on the calculator.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Your choice of method, in one line: <strong>options far apart → estimate; options close → calculate exactly;\noptions differ only in zeros → order of magnitude.<\/strong> Decide this in the first 15 seconds.<\/p>\n<\/div>", "sections": [{"id": "estimation", "title": "Estimation"}, {"id": "magnitude-elimination", "title": "Eliminating by order of magnitude"}, {"id": "quick-variation", "title": "Quick variations"}, {"id": "fraction-shortcuts", "title": "Fraction shortcuts"}], "override": false}, "numerical/L5": {"meta": {"module": "numerical", "level": "L5", "title": "Exam simulation", "status": "draft", "introduces": ["num-exam-strategy"], "uses": ["estimation", "magnitude-elimination", "quick-variation", "fraction-shortcuts", "multi-step", "select-data", "calculator"], "source_refs": [{"short": "franco2", "loc": "s45", "note": "strategy to deal with this type of test"}, {"short": "franco1", "loc": "p9", "note": "answer every question; no penalty for wrong answers (older competitions)"}, {"short": "baneth2023", "loc": "p150", "note": "how to approach the test and practise"}], "minutes": 60, "generated_at": "2026-10-14 04:00:00+00:00"}, "html": "<p>You now have every tool the numerical test needs. This last level is about <strong>using them under time\npressure<\/strong> — calmly. Read the strategy once, then use the timed tests.<\/p>\n<h2 id=\"num-exam-strategy\">Numerical exam strategy<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The real test: <strong>10 questions in 20 minutes<\/strong> (TO VERIFY). That is 2 minutes per question on\naverage. Your goal is not 10 out of 10: with the combined pass mark, a steady <strong>5 or 6<\/strong> plus a good\nabstract score is a pass (TO VERIFY).<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Think of a supermarket trip with a fixed budget of time: you pick up what's quick to find first and\ndon't spend ten minutes searching for one item while the shop closes.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Your routine for every question<\/p>\n<ol>\n<li><strong>Read the question to the end.<\/strong> Underline what is asked and in which unit.<\/li>\n<li><strong>Find only the data you need<\/strong> in the table or chart.<\/li>\n<li><strong>Look at the options<\/strong>: far apart → estimate; close → calculate exactly; only the zeros differ → order of magnitude.<\/li>\n<li><strong>Calculate<\/strong>, writing each step on your notepad (TO VERIFY what you may use at home).<\/li>\n<li><strong>Sanity-check<\/strong> against a quick estimate, click, and move on.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Managing the 20 minutes<\/p>\n<ol>\n<li><strong>First pass (about 14 minutes):<\/strong> answer every question you can do in up to 2 minutes. If one is taking longer, pick your best guess, <strong>flag it<\/strong>, and move on.<\/li>\n<li><strong>Second pass (about 5 minutes):<\/strong> go back to flagged questions with the time left.<\/li>\n<li><strong>Last minute:<\/strong> make sure <strong>no question is blank<\/strong>. A guess between 5 options still has a 1-in-5 chance.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L5-001,num-L5-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Fighting one question for five minutes.<\/strong> Every question is worth the same. A hard one solved\nlate costs you two simpler ones you never reached.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>How to use the timed tests in the plan:<\/p>\n<ul>\n<li>Do a timed test (Dashboard → \"Timed numerical\"), then <strong>review every answer<\/strong>, including the right ones — was your method the fastest?<\/li>\n<li>Your missed questions go to the mistakes bank automatically.<\/li>\n<li>Track your scores on the Dashboard. Improvement of one point per week is excellent progress.<\/li>\n<li>The day before the exam: no timed tests. Light review only.<\/li>\n<\/ul>\n<\/div>\n<h2>Ready?<\/h2>\n<p>There are 20 exam-level questions in the timed mode (two different tests of 10). Start one from the\nDashboard or here: <a href=\"#/timed/numerical\">start a timed numerical test<\/a>.<\/p>", "sections": [{"id": "num-exam-strategy", "title": "Numerical exam strategy"}], "override": false}, "verbal/L0": {"meta": {"module": "verbal", "level": "L0", "title": "How the test works", "status": "draft", "introduces": ["verbal-format", "supported-by-text"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p47", "note": "EPSO uses the comprehension type of verbal test"}, {"short": "baneth2023", "loc": "p48", "note": "passage of 100–200 words, four statements, one correct"}, {"short": "baneth2023", "loc": "p49", "note": "correct, incorrect and 'insufficient information' statements"}, {"short": "baneth2023", "loc": "p50", "note": "outside knowledge never proves a statement"}], "minutes": 40, "generated_at": "2026-10-14 05:00:00+00:00"}, "html": "<p>Good news first: the verbal test does not check grammar, vocabulary lists or literature. It checks\none thing — <strong>can you tell exactly what a short text says, and what it doesn't say?<\/strong> That is a\nskill you can sharpen quickly with the right method.<\/p>\n<h2 id=\"verbal-format\">The question format<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Each question shows a <button type=\"button\" class=\"gl\" data-term=\"passage\">passage<\/button> of about 100–200 words and four <button type=\"button\" class=\"gl\" data-term=\"statement\">statements<\/button>. You\nchoose the <strong>one statement that is correct according to the passage<\/strong>. The other three are wrong\nfor a reason you can point to.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A friend tells you about a news article: \"It said the new tram line opens next year and will be\nfree for students.\" If the article only said \"opens next year\", your friend added something. You\nwould notice — that is exactly the skill tested here.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: What a question looks like<\/p>\n<blockquote>\n<p><em>The town library extended its opening hours in March. It now opens at 8:00 on weekdays instead\nof 9:00. Visitor numbers in the first month rose by about a tenth compared with the previous March.<\/em><\/p>\n<\/blockquote>\n<p>Which of the following statements is correct?<\/p>\n<ol>\n<li><strong>A.<\/strong> The library now opens one hour earlier on weekdays. → <strong>Correct<\/strong>: 8:00 instead of 9:00.<\/li>\n<li><strong>B.<\/strong> The library now also opens on Sundays. → Not in the text.<\/li>\n<li><strong>C.<\/strong> Visitor numbers doubled after the change. → The text says \"about a tenth\", not doubled.<\/li>\n<li><strong>D.<\/strong> The longer hours caused the rise in visitors. → The text says both happened, not that one caused the other.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L0-001\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Choosing what sounds sensible.<\/strong> Statement D above sounds very reasonable — longer hours, more\nvisitors. But the passage never says one caused the other. \"Sounds likely\" is not the same as\n\"the text says so\".<\/p>\n<\/div>\n<h2 id=\"supported-by-text\">What 'supported by the text' means<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Every statement belongs to one of three types:<\/p>\n<ul>\n<li><strong>True<\/strong> — the passage says it, or it follows necessarily from what the passage says.<\/li>\n<li><strong>False<\/strong> — the passage says the opposite.<\/li>\n<li><strong><button type=\"button\" class=\"gl\" data-term=\"cannot-say\">Cannot say<\/button><\/strong> — the passage doesn't give enough information either way.<\/li>\n<\/ul>\n<p>Only a <strong>True<\/strong> statement can be the answer. False and Cannot-say statements are both wrong answers.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A bus timetable says \"Line 12 runs every 15 minutes until 20:00.\" Is it true that line 12 runs at\n21:00? The timetable doesn't say — it might stop, or switch to a night service. <strong>Cannot say.<\/strong><\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Sorting statements into three types<\/p>\n<blockquote>\n<p><em>Wind farms produced 18% of the country's electricity last year, up from 14% the year before.\nMost of the new capacity was built at sea.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"Wind's share of electricity grew last year.\" → <strong>True<\/strong> (14% → 18%).<\/li>\n<li>\"Wind farms produced less electricity than the year before.\" → <strong>False<\/strong> (the share went up).<\/li>\n<li>\"Offshore wind farms are cheaper to build than onshore ones.\" → <strong>Cannot say<\/strong> (costs are not mentioned).<\/li>\n<li>\"All new wind capacity was built at sea.\" → <strong>Cannot say<\/strong> — the text says <em>most<\/em>, so some may have been on land. Careful: it is not proven false either!<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L0-002,ver-L0-003\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>\"Cannot say\" statements that you know are true in real life.<\/strong> If a statement is true in the world\nbut the passage doesn't say it, it is still a wrong answer. In this test, the passage is your only\nsource of truth.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>For every statement, ask one question: <strong>\"Where in the text is this?\"<\/strong> If you can point to the\nsentence, it's a candidate. If you can't, it's wrong — however true it sounds.<\/p>\n<\/div>", "sections": [{"id": "verbal-format", "title": "The question format"}, {"id": "supported-by-text", "title": "What 'supported by the text' means"}], "override": false}, "verbal/L1": {"meta": {"module": "verbal", "level": "L1", "title": "Reading precisely", "status": "draft", "introduces": ["key-words", "qualifiers", "negations"], "uses": ["verbal-format", "supported-by-text"], "source_refs": [{"short": "baneth2023", "loc": "p47", "note": "determiners and quantities; general versus particular"}, {"short": "baneth2023", "loc": "p55", "note": "frequency words"}, {"short": "baneth2023", "loc": "p58", "note": "practice methods"}], "minutes": 50, "generated_at": "2026-10-14 05:20:00+00:00"}, "html": "<p>Most wrong options in the verbal test differ from the passage by <strong>one or two small words<\/strong>.\nThis level trains your eye to catch them.<\/p>\n<h2 id=\"key-words\">Key words<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Every statement has a few <button type=\"button\" class=\"gl\" data-term=\"key-word\">key words<\/button> that carry its meaning: <strong>who<\/strong>, <strong>what<\/strong>, <strong>when<\/strong>,\n<strong>how much<\/strong>. Find those words in the passage and compare them one by one. If even one doesn't\nmatch, the statement is wrong.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Checking a train ticket: name, date, from, to. If the date is wrong, it doesn't matter that the\nother three are right — the ticket is wrong.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Matching key words<\/p>\n<blockquote>\n<p><em>In 2021 the city council approved a plan to plant 5,000 trees along its main roads by 2030.<\/em><\/p>\n<\/blockquote>\n<p>Statement: \"In 2021 the council planted 5,000 trees along the main roads.\"<\/p>\n<ol>\n<li>Key words in the statement: <strong>2021<\/strong>, <strong>council<\/strong>, <strong>planted<\/strong>, <strong>5,000 trees<\/strong>, <strong>main roads<\/strong>.<\/li>\n<li>Passage: 2021 ✓, council ✓, 5,000 trees ✓, main roads ✓ — but <strong>approved a plan<\/strong> to plant, not <strong>planted<\/strong>.<\/li>\n<li>Planting is planned <strong>by 2030<\/strong>. One key word doesn't match → the statement is <strong>False<\/strong> as written.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L1-001,ver-L1-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Being convinced by the words that match.<\/strong> Four out of five key words matching feels like \"almost\nright\". In this test \"almost right\" is wrong.<\/p>\n<\/div>\n<h2 id=\"qualifiers\">Qualifiers: all, some, may, only<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p><button type=\"button\" class=\"gl\" data-term=\"qualifier\">Qualifiers<\/button> are small words that set <strong>how much<\/strong> or <strong>how sure<\/strong>: all, most, many,\nsome, few, only, always, usually, sometimes, never, may, might, could, will. A statement that changes\nthe qualifier changes the meaning.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"Some shops are open on Sunday\" and \"All shops are open on Sunday\" are very different promises when\nyou need to buy milk.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Strong and weak words<\/p>\n<blockquote>\n<p><em>Researchers believe the new vaccine <strong>may<\/strong> reduce hospital admissions in <strong>most<\/strong> age groups.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"The vaccine <strong>will<\/strong> reduce admissions.\" → stronger than <em>may<\/em> → <strong>Cannot say<\/strong> (not proven).<\/li>\n<li>\"The vaccine reduces admissions in <strong>all<\/strong> age groups.\" → stronger than <em>most<\/em> → <strong>Cannot say<\/strong>.<\/li>\n<li>\"Researchers think the vaccine could lower admissions for many people.\" → <em>could<\/em> ≈ <em>may<\/em>, <em>many<\/em> fits <em>most<\/em> → <strong>True<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Weaker ←<\/th>\n<th><\/th>\n<th>→ Stronger<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>may, might, could<\/td>\n<td>likely, usually<\/td>\n<td>will, always, certainly<\/td>\n<\/tr>\n<tr>\n<td>some, a few<\/td>\n<td>many, most<\/td>\n<td>all, every, none<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"quiz-embed\" data-ids=\"ver-L1-003,ver-L1-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>A statement may be weaker than the text and still be true.<\/strong> If the passage says \"all members\nagreed\", then \"some members agreed\" is true. The danger is only when the statement is <strong>stronger<\/strong>\nthan the passage.<\/p>\n<\/div>\n<h2 id=\"negations\">Negations<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p><button type=\"button\" class=\"gl\" data-term=\"negation\">Negations<\/button> reverse meaning: not, no, never, none, neither, without, fail to, un-, in-,\nhardly. Two negatives can cancel out (\"not uncommon\" = fairly common). Read them slowly.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"Don't forget not to lock the door\" — you have to stop and think. Test writers use this effect.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Untangling a double negative<\/p>\n<blockquote>\n<p><em>It is not unusual for the committee to postpone its decisions.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"unusual\" = rare. \"not unusual\" = <strong>not rare<\/strong> → it happens fairly often.<\/li>\n<li>Statement: \"The committee often postpones its decisions.\" → <strong>True<\/strong> (often ≈ not unusual).<\/li>\n<li>Statement: \"The committee rarely postpones its decisions.\" → <strong>False<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L1-005,ver-L1-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Reading too fast over \"not\".<\/strong> When a sentence feels confusing, rewrite it in your head without\nthe negatives: \"not unusual\" → \"common\". Then compare.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>In each statement, circle (mentally) the key words <strong>and<\/strong> any qualifier or negation. Those few words\ndecide whether the statement is true.<\/p>\n<\/div>", "sections": [{"id": "key-words", "title": "Key words"}, {"id": "qualifiers", "title": "Qualifiers: all, some, may, only"}, {"id": "negations", "title": "Negations"}], "override": false}, "verbal/L2": {"meta": {"module": "verbal", "level": "L2", "title": "Inference vs assumption", "status": "draft", "introduces": ["inference", "outside-knowledge"], "uses": ["verbal-format", "supported-by-text", "key-words", "qualifiers", "negations"], "source_refs": [{"short": "baneth2023", "loc": "p49", "note": "a correct statement can be a conclusion drawn from several parts of the text"}, {"short": "baneth2023", "loc": "p50", "note": "insufficient-information statements that feel correct"}, {"short": "baneth2023", "loc": "p52", "note": "assumptions"}], "minutes": 45, "generated_at": "2026-10-14 05:40:00+00:00"}, "html": "<p>The hardest verbal questions use statements that the passage doesn't say <strong>word for word<\/strong>. Some of\nthem still follow from the text (correct). Others only <em>seem<\/em> to follow (wrong). This level teaches\nyou to tell them apart.<\/p>\n<h2 id=\"inference\">Inference<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>An <button type=\"button\" class=\"gl\" data-term=\"inference\">inference<\/button> is a conclusion that <strong>must<\/strong> be true if the passage is true — often by combining\ntwo sentences. An <button type=\"button\" class=\"gl\" data-term=\"assumption\">assumption<\/button> is something that <em>might<\/em> be true but needs extra information.\nInferences can be correct answers; assumptions cannot.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"All trains to Lyon leave from platform 4. My train goes to Lyon.\" Inference: my train leaves from\nplatform 4. That has to be true. Assumption: my train is on time. Nothing tells you that.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Combining two sentences<\/p>\n<blockquote>\n<p><em>All projects funded by the programme must publish their results openly. The Danube Water Project\nreceived funding from the programme in 2023.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>Sentence 1: every funded project must publish openly.<\/li>\n<li>Sentence 2: the Danube Water Project is a funded project.<\/li>\n<li>Inference: <strong>the Danube Water Project must publish its results openly.<\/strong> → True, even though no\n   single sentence says it.<\/li>\n<li>\"The Danube Water Project has already published its results.\" → <strong>Cannot say<\/strong>: it <em>must<\/em>\n   publish, but we don't know whether it has yet. That is an assumption.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L2-001,ver-L2-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Taking one step too far.<\/strong> An inference must be <strong>forced<\/strong> by the text. If you need the words\n\"probably\" or \"it's likely that\" to get there, it is an assumption.<\/p>\n<\/div>\n<h2 id=\"outside-knowledge\">The outside-knowledge trap<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Some wrong statements are <strong>true in the real world<\/strong> but not in the passage. Because you know them,\nthey feel right. In this test, what you know from outside the passage counts for nothing.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A quiz question asks what a recipe card says about baking time. You know cakes usually bake at\n180°C, but if the card doesn't mention the temperature, you cannot answer \"180°C\" from the card.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A statement that is true — but not here<\/p>\n<blockquote>\n<p><em>Founded in 1987, the Erasmus programme lets university students spend part of their studies in\nanother participating country. Since then, millions of students have taken part.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"Erasmus is named after the Dutch scholar Erasmus of Rotterdam.\" → True in real life, but the passage\n   doesn't mention the name's origin → <strong>Cannot say<\/strong> → wrong answer.<\/li>\n<li>\"The programme has existed for more than three decades.\" → From 1987 to today is over 30 years — an\n   inference from the date given → <strong>True<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L2-003,ver-L2-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Topics you know well are more dangerous, not less.<\/strong> When the passage is about something familiar,\nslow down and check every statement against the text, not against your memory.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>For every statement that \"feels right\", ask: <strong>\"Could someone who knows nothing about this topic\nprove it from the passage alone?\"<\/strong> If not, it's out.<\/p>\n<\/div>", "sections": [{"id": "inference", "title": "Inference"}, {"id": "outside-knowledge", "title": "The outside-knowledge trap"}], "override": false}, "verbal/L3": {"meta": {"module": "verbal", "level": "L3", "title": "Common traps", "status": "draft", "introduces": ["scope-shift", "extreme-wording", "near-synonyms", "partial-truth"], "uses": ["verbal-format", "supported-by-text", "key-words", "qualifiers", "negations", "inference", "outside-knowledge"], "source_refs": [{"short": "baneth2023", "loc": "p47", "note": "near-equivalent versus identical statements; general versus particular; omission"}, {"short": "baneth2023", "loc": "p48", "note": "verbs: time and mode; causality versus chronology"}, {"short": "baneth2023", "loc": "p56", "note": "a series of events is not a chain of causes"}], "minutes": 60, "generated_at": "2026-10-14 06:00:00+00:00"}, "html": "<p>Test writers build wrong options with a small set of tricks. Once you know the four most common\nones, you will start to recognise them on sight.<\/p>\n<h2 id=\"scope-shift\">Scope shift<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"scope\">scope shift<\/button> changes <strong>who or what<\/strong> the statement is about: from one country to all of\nEurope, from some members to the whole group, from one year to \"always\", from a city to its region.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"My neighbour's cat hates water\" does not tell you that cats hate water.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: From Portugal to Europe<\/p>\n<blockquote>\n<p><em>In Portugal, the number of electric car registrations tripled between 2020 and 2023.<\/em><\/p>\n<\/blockquote>\n<p>Statement: \"Electric car registrations tripled in Europe between 2020 and 2023.\"<\/p>\n<ol>\n<li>The passage is about <strong>Portugal<\/strong>. The statement is about <strong>Europe<\/strong>.<\/li>\n<li>Portugal's numbers say nothing about the rest of Europe → <strong>Cannot say<\/strong> → wrong.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L3-001,ver-L3-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Watch for words that widen the scope: <em>all, every, in general, in the EU, worldwide, always<\/em>.<\/p>\n<\/div>\n<h2 id=\"extreme-wording\">Extreme wording<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Passages usually <strong>hedge<\/strong> (\"may\", \"some experts\", \"in many cases\"). Wrong statements often remove\nthe hedge and make it absolute: <em>always, never, only, the first, the biggest, completely, proves<\/em>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A friend says \"This restaurant is often busy on Fridays.\" If you repeat it as \"It's impossible to get\na table on Fridays\", you have exaggerated.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: From \"suggests\" to \"proves\"<\/p>\n<blockquote>\n<p><em>A small study suggests that short walks after meals may help regulate blood sugar.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"Research has proved that walking after meals regulates blood sugar.\" → <em>proved<\/em> is much stronger\n   than <em>suggests<\/em>; <em>regulates<\/em> is stronger than <em>may help<\/em> → <strong>Cannot say<\/strong> → wrong.<\/li>\n<li>\"There is some evidence that walking after meals could be beneficial.\" → hedged like the passage → <strong>True<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L3-003\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Superlatives<\/strong> — \"the first\", \"the largest\", \"the only\" — need explicit support in the passage. If the\ntext says \"one of the first\", then \"the first\" is wrong.<\/p>\n<\/div>\n<h2 id=\"near-synonyms\">Near-synonyms<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Some words look like <button type=\"button\" class=\"gl\" data-term=\"synonym\">synonyms<\/button> but are not equal: <em>reduced<\/em> ≠ <em>stopped<\/em>; <em>increased<\/em> ≠\n<em>doubled<\/em>; <em>planned<\/em> ≠ <em>introduced<\/em>; <em>proposed<\/em> ≠ <em>adopted<\/em>; <em>many<\/em> ≠ <em>most<\/em>; <em>since<\/em> ≠ <em>because<\/em>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"The shop reduced its prices\" is not the same as \"the shop gave things away for free\".<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Proposed vs adopted<\/p>\n<blockquote>\n<p><em>In June the Commission proposed new rules on packaging waste. The proposal will now be discussed by\nthe Parliament and the Council.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"New packaging rules were adopted in June.\" → <em>proposed<\/em> ≠ <em>adopted<\/em> — a proposal still has to be\n   discussed and approved → <strong>False/Cannot say<\/strong> → wrong.<\/li>\n<li>\"The Parliament and the Council still have to discuss the packaging proposal.\" → <strong>True<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L3-004,ver-L3-005\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Pay special attention to <strong>verbs and their tense<\/strong>: <em>is being built<\/em> ≠ <em>has been built<\/em>;\n<em>will start<\/em> ≠ <em>started<\/em>; <em>aims to<\/em> ≠ <em>achieved<\/em>.<\/p>\n<\/div>\n<h2 id=\"partial-truth\">Partly true statements<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A statement can be <strong>half right<\/strong>: the first part matches the passage, the second part doesn't — or\nit links two true facts with a <strong>cause<\/strong> (\"because\", \"led to\", \"as a result\") that the passage never\nstates. One false or unsupported part makes the whole statement wrong.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"I missed the bus and it rained\" — two facts. \"I missed the bus because it rained\" — a new claim.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: After ≠ because<\/p>\n<blockquote>\n<p><em>The city introduced a congestion charge in 2019. In the following two years, air pollution in the\ncentre fell by 15%.<\/em><\/p>\n<\/blockquote>\n<ol>\n<li>\"Air pollution fell after the congestion charge was introduced.\" → order of events is in the text → <strong>True<\/strong>.<\/li>\n<li>\"The congestion charge reduced air pollution by 15%.\" → the passage gives the order, not the cause\n   (the fall could have other reasons) → <strong>Cannot say<\/strong> → wrong.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L3-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Chronology is not causality.<\/strong> \"A happened, then B happened\" never proves \"A caused B\" unless the\npassage says so.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>When two options both look right, compare them word by word. The wrong one usually contains one of\nthese four tricks — find it and the decision is made.<\/p>\n<\/div>", "sections": [{"id": "scope-shift", "title": "Scope shift"}, {"id": "extreme-wording", "title": "Extreme wording"}, {"id": "near-synonyms", "title": "Near-synonyms"}, {"id": "partial-truth", "title": "Partly true statements"}], "override": false}, "verbal/L4": {"meta": {"module": "verbal", "level": "L4", "title": "Fast methods", "status": "draft", "introduces": ["options-first", "verbal-elimination"], "uses": ["verbal-format", "supported-by-text", "key-words", "qualifiers", "negations", "inference", "outside-knowledge", "scope-shift", "extreme-wording", "near-synonyms", "partial-truth"], "source_refs": [{"short": "baneth2023", "loc": "p48", "note": "recommended order of reading text, question and options"}, {"short": "baneth2023", "loc": "p58", "note": "summary of the method and practice methods"}], "minutes": 40, "generated_at": "2026-10-14 06:20:00+00:00"}, "html": "<p>In the real test you have about <strong>1 minute 45 seconds per question<\/strong> (TO VERIFY). That is enough\ntime — if you read with a purpose. These two methods give you that purpose.<\/p>\n<h2 id=\"options-first\">Read the options first<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Before reading the passage, <strong>skim the four statements<\/strong> (10–15 seconds). Then read the passage once,\ncarefully, knowing what you are looking for. You will notice the important sentences as you meet them.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Before reading a long email from your landlord, you check what you need to know: when the plumber\ncomes and whether you need to be home. Then you read — and those two facts jump out.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A 90-second routine<\/p>\n<ol>\n<li><strong>Skim the statements<\/strong> (15 s): note their key words — e.g. \"budget\", \"2025\", \"all regions\".<\/li>\n<li><strong>Read the passage once<\/strong> (40–50 s), carefully, noticing where those key words appear.<\/li>\n<li><strong>Check each statement<\/strong> against its sentence (30–40 s): true, false or cannot say.<\/li>\n<li><strong>Click<\/strong> the one true statement and move on.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L4-001,ver-L4-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Skimming the passage instead of the statements.<\/strong> The passage must be read properly — the details\ndecide the answer. Only the statements are skimmed.<\/p>\n<\/div>\n<h2 id=\"verbal-elimination\">Elimination<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>You don't need to prove the right answer directly. Mark each statement <strong>✓ (true), ✗ (false) or ?\n(cannot say)<\/strong>. Every ✗ and ? is out. Usually the last one standing is the answer — and if two\nremain, compare them word by word.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Finding your suitcase on the luggage belt: you rule out everything that is the wrong colour, then\nthe wrong size, and the one left is yours.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Eliminating with reasons<\/p>\n<p>For each statement, give yourself a <strong>one-word reason<\/strong>:<\/p>\n<ol>\n<li>A — \"<em>some<\/em>, not <em>all<\/em>\" → ✗/?<\/li>\n<li>B — \"<em>proposed<\/em>, not <em>adopted<\/em>\" → ✗<\/li>\n<li>C — \"not mentioned\" → ?<\/li>\n<li>D — \"line 3\" → ✓<\/li>\n<\/ol>\n<p>A one-word reason keeps you honest: if you can't name it, look again.<\/p>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L4-003,ver-L4-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Keeping two options because you can't decide.<\/strong> If two are left, one of them has a scope shift,\nan extreme word, a near-synonym or a half-truth. Look for it specifically.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>If after two minutes you still can't decide between two options, pick one, flag the question and\nmove on. A 50/50 guess is a good bet.<\/p>\n<\/div>", "sections": [{"id": "options-first", "title": "Read the options first"}, {"id": "verbal-elimination", "title": "Elimination"}], "override": false}, "verbal/L5": {"meta": {"module": "verbal", "level": "L5", "title": "Exam simulation", "status": "draft", "introduces": ["verbal-exam-strategy"], "uses": ["options-first", "verbal-elimination", "scope-shift", "extreme-wording", "near-synonyms", "partial-truth", "inference", "outside-knowledge"], "source_refs": [{"short": "baneth2023", "loc": "p33", "note": "verbal counts towards the ranking in the new system"}, {"short": "baneth2023", "loc": "p58", "note": "practice methods"}], "minutes": 60, "generated_at": "2026-10-14 06:40:00+00:00"}, "html": "<p>This is where everything comes together, under exam conditions.<\/p>\n<h2 id=\"verbal-exam-strategy\">Verbal exam strategy<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The real test: <strong>20 questions in 35 minutes<\/strong> (TO VERIFY) — about <strong>1 minute 45 seconds<\/strong> each. It\nhas its own pass mark (10/20) and its score is expected to <strong>count for the ranking<\/strong> (TO VERIFY), so\nevery extra point matters here.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Like a long walk at a steady pace: you don't sprint the first kilometre and then stop. You keep a\nrhythm and check the time every so often.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Pacing the 35 minutes<\/p>\n<ol>\n<li><strong>Checkpoint 1:<\/strong> after about <strong>9 minutes<\/strong> you should be around question 5.<\/li>\n<li><strong>Checkpoint 2:<\/strong> after about <strong>18 minutes<\/strong>, around question 10.<\/li>\n<li><strong>Checkpoint 3:<\/strong> after about <strong>27 minutes<\/strong>, around question 15.<\/li>\n<li><strong>Last 3–4 minutes:<\/strong> return to flagged questions; make sure <strong>nothing is blank<\/strong>.\nIf you are behind at a checkpoint, don't panic — use the 2-minute rule more strictly on the next questions.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ver-L5-001\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Re-reading the passage again and again.<\/strong> Read it once, carefully, with the statements in mind.\nThen go back only to the specific sentence you need.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Before the test, run through the four traps in your head: <strong>scope, extreme words, near-synonyms,\nhalf-truths<\/strong> — and the golden rule: <strong>only the passage counts<\/strong>.<\/p>\n<\/div>\n<h2>Ready?<\/h2>\n<p>There are 20 exam-style questions in the timed mode — a full simulation of the real test.\n<a href=\"#/timed/verbal\">Start a timed verbal test<\/a>. After it, review <strong>every<\/strong> answer, including the right\nones: did you get them for the right reason?<\/p>", "sections": [{"id": "verbal-exam-strategy", "title": "Verbal exam strategy"}], "override": false}, "abstract/L0": {"meta": {"module": "abstract", "level": "L0", "title": "What a pattern is", "status": "draft", "introduces": ["features"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p277", "note": "EPSO format: black and white figures, series of five, choose the sixth"}, {"short": "baneth2023", "loc": "p278", "note": "building blocks: shapes, operations, rules"}], "minutes": 30, "generated_at": "2026-10-14 07:00:00+00:00"}, "html": "<p>Abstract reasoning is the test that people with maths anxiety often end up <strong>liking most<\/strong>: there are no\nnumbers and no words — only shapes. And it is very trainable, because test writers use a small set of\nbuilding blocks again and again.<\/p>\n<h2 id=\"features\">Features: shape, colour, count, size, position, rotation<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Each question shows a <button type=\"button\" class=\"gl\" data-term=\"series\">series<\/button> of five figures. Something changes from one figure to the next\naccording to a <button type=\"button\" class=\"gl\" data-term=\"rule\">rule<\/button>. Your job is to find the rule and pick the <strong>sixth<\/strong> figure from five options.\nEvery rule changes one <button type=\"button\" class=\"gl\" data-term=\"feature\">feature<\/button> of the figure: <strong>position, direction (rotation), number, colour,\nshape or size<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A traffic light follows a rule: green → amber → red → green… Once you know the rule, you know what\ncomes next without waiting.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: The six features you will meet<\/p>\n<p><strong>Number<\/strong> — one more dot each time:<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60.0\" cy=\"60.0\" r=\"7\" class=\"ab-b\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"46.7\" cy=\"60.0\" r=\"7\" class=\"ab-b\"/><circle cx=\"73.3\" cy=\"60.0\" r=\"7\" class=\"ab-b\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"33.3\" cy=\"60.0\" r=\"7\" class=\"ab-b\"/><circle cx=\"60.0\" cy=\"60.0\" r=\"7\" class=\"ab-b\"/><circle cx=\"86.7\" cy=\"60.0\" r=\"7\" class=\"ab-b\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"33.3\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"60.0\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"86.7\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"60.0\" cy=\"73.3\" r=\"7\" class=\"ab-b\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"33.3\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"60.0\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"86.7\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"46.7\" cy=\"73.3\" r=\"7\" class=\"ab-b\"/><circle cx=\"73.3\" cy=\"73.3\" r=\"7\" class=\"ab-b\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"33.3\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"60.0\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"86.7\" cy=\"46.7\" r=\"7\" class=\"ab-b\"/><circle cx=\"33.3\" cy=\"73.3\" r=\"7\" class=\"ab-b\"/><circle cx=\"60.0\" cy=\"73.3\" r=\"7\" class=\"ab-b\"/><circle cx=\"86.7\" cy=\"73.3\" r=\"7\" class=\"ab-b\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<p><strong>Position<\/strong> — the dot moves one cell clockwise around the edge:<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-b\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line
