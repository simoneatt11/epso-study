<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-2: #f3eee6;
  --ink: #23201c;
  --ink-2: #57524b;
  --ink-3: #7a746b;
  --line: #e4ddd2;
  --accent: #2f6f62;        /* calm teal-green */
  --accent-ink: #ffffff;
  --accent-soft: #e2efe9;
  --good: #2e7d4f;  --good-soft: #e3f3e8;
  --warn: #9a6200;  --warn-soft: #fbf0d9;
  --bad: #a8463a;   --bad-soft: #f8e6e2;
  --idea: #e8f0fb;  --everyday: #f4ecfa; --worked: #eef6ee; --trap: #fdf0e1; --fast: #e6f4f6; --strategy: #f1efe9;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a;
  --pie-0: #2a78d6; --pie-1: #eb6834; --pie-2: #1baf7a; --pie-3: #eda100; --pie-4: #e87ba4; --pie-5: #6250d6;
  --ab-grey: #a8a39a;
  --radius: 14px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #171614; --surface: #201f1c; --surface-2: #2a2825;
    --ink: #f0ede7; --ink-2: #c9c4bb; --ink-3: #a29c92; --line: #3a3732;
    --accent: #6cc0ab; --accent-ink: #10201c; --accent-soft: #1f3631;
    --good: #7cd19c; --good-soft: #1d3326; --warn: #e5b45c; --warn-soft: #3a2f1a; --bad: #ee9a8e; --bad-soft: #3b231f;
    --idea: #1e2a3a; --everyday: #2c2236; --worked: #1f2e21; --trap: #3a2c1b; --fast: #1b3236; --strategy: #2b2925;
    --ab-grey: #7d786f;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
    --pie-0: #3987e5; --pie-1: #d95926; --pie-2: #199e70; --pie-3: #c98500; --pie-4: #d55181; --pie-5: #9085e9;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #171614; --surface: #201f1c; --surface-2: #2a2825;
  --ink: #f0ede7; --ink-2: #c9c4bb; --ink-3: #a29c92; --line: #3a3732;
  --accent: #6cc0ab; --accent-ink: #10201c; --accent-soft: #1f3631;
  --good: #7cd19c; --good-soft: #1d3326; --warn: #e5b45c; --warn-soft: #3a2f1a; --bad: #ee9a8e; --bad-soft: #3b231f;
  --idea: #1e2a3a; --everyday: #2c2236; --worked: #1f2e21; --trap: #3a2c1b; --fast: #1b3236; --strategy: #2b2925;
  --ab-grey: #7d786f;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70;
  --pie-0: #3987e5; --pie-1: #d95926; --pie-2: #199e70; --pie-3: #c98500; --pie-4: #d55181; --pie-5: #9085e9;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html { font-size: 18px; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); line-height: 1.6; }
a { color: var(--accent); }
h1, h2, h3 { line-height: 1.25; }
h1 { font-size: 1.7rem; margin: .2em 0 .5em; }
h2 { font-size: 1.3rem; margin: 1.8em 0 .6em; padding-top: .4em; border-top: 1px solid var(--line); }
h3 { font-size: 1.08rem; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 8px; top: 8px; z-index: 50; background: var(--surface); padding: 6px 10px; }

/* ---------- layout ---------- */
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { font-weight: 700; text-decoration: none; color: var(--ink); }
.countdown { margin-left: auto; font-size: .85rem; color: var(--ink-2); }
.menu-btn { display: none; background: none; border: 1px solid var(--line); border-radius: 10px; padding: 4px 10px; cursor: pointer; }
.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 110px); }
.side { border-right: 1px solid var(--line); background: var(--surface); padding: 14px 10px 40px; overflow-y: auto;
  position: sticky; top: 52px; height: calc(100vh - 52px); font-size: .92rem; }
main { padding: 24px clamp(16px, 4vw, 48px) 80px; max-width: 860px; width: 100%; }
.foot { padding: 14px 16px; font-size: .78rem; color: var(--ink-3); border-top: 1px solid var(--line); text-align: center; }
@media (max-width: 860px) {
  .menu-btn { display: inline-block; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 52px; width: min(320px, 88vw); z-index: 30; transform: translateX(-105%);
    transition: transform .2s; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
  .side.open { transform: none; }
}

/* ---------- nav ---------- */
.nav-sec { margin: 4px 0 2px; }
.nav-sec > .nav-h { font-weight: 700; padding: 8px 10px 4px; display: block; text-decoration: none; color: var(--ink); }
.nav-sec .later { color: var(--ink-3); font-weight: 600; }
.nav-l { display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 18px; border-radius: 10px;
  text-decoration: none; color: var(--ink-2); }
.nav-l:hover { background: var(--surface-2); }
.nav-l.cur { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.nav-l.na { opacity: .55; }
.mark { width: 1.2em; text-align: center; flex: none; }
.next-tag { margin-left: auto; font-size: .7rem; background: var(--accent); color: var(--accent-ink); padding: 1px 7px; border-radius: 99px; }
.nav-tools { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }

/* ---------- cards & common ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; margin: 14px 0; }
.lead { font-size: 1.1rem; color: var(--ink-2); }
.muted { color: var(--ink-3); font-size: .9rem; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 10px 18px; border-radius: 12px; border: 1px solid var(--accent);
  background: var(--accent); color: var(--accent-ink); font-weight: 600; cursor: pointer; text-decoration: none; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.small { padding: 6px 12px; min-height: 36px; font-size: .9rem; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pill { display: inline-block; font-size: .78rem; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.stat { font-size: 1.8rem; font-weight: 700; }

/* ---------- lesson boxes ---------- */
.box { border-radius: var(--radius); padding: 12px 18px; margin: 14px 0; border: 1px solid var(--line); }
.box > :last-child { margin-bottom: 0; }
.box-h { font-weight: 700; font-size: .82rem; text-transform: uppercase; letter-spacing: .05em; margin: 0 0 6px; color: var(--ink-2); }
.box-idea { background: var(--idea); } .box-everyday { background: var(--everyday); } .box-worked { background: var(--worked); }
.box-trap { background: var(--trap); } .box-fast { background: var(--fast); } .box-strategy, .box-note { background: var(--strategy); }
.box-verify { background: var(--warn-soft); border-color: var(--warn); }
.box-trap .box-h::before { content: "⚠ "; } .box-idea .box-h::before { content: "💡 "; } .box-worked .box-h::before { content: "✎ "; }
.box-fast .box-h::before { content: "⚡ "; } .box-everyday .box-h::before { content: "🛒 "; } .box-strategy .box-h::before { content: "🧭 "; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .9em; line-height: 1.1; margin: 0 2px; }
.frac > span:first-child { border-bottom: 1.5px solid currentColor; padding: 0 3px; }
.gl { background: none; border: none; padding: 0; border-bottom: 2px dotted var(--accent); cursor: help; color: inherit; }
.pop { position: absolute; z-index: 40; max-width: 340px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.18); font-size: .92rem; }
.pop .t { font-weight: 700; display: block; margin-bottom: 4px; }

/* ---------- tables & charts ---------- */
.dtable { overflow-x: auto; margin: 10px 0; }
.dtable table { border-collapse: collapse; min-width: 60%; font-variant-numeric: tabular-nums; background: var(--surface); }
.dtable caption { text-align: left; font-weight: 600; padding: 4px 0 8px; }
.dtable th, .dtable td { border: 1px solid var(--line); padding: 6px 12px; text-align: right; }
.dtable th[scope=row], .dtable thead th:first-child { text-align: left; }
.dtable thead th { background: var(--surface-2); }
.unit, .tnote { color: var(--ink-3); font-size: .85rem; font-weight: 400; }
main table:not(.dtable table) { border-collapse: collapse; }
main > table th, main > table td, .lesson table th, .lesson table td { border: 1px solid var(--line); padding: 5px 10px; }
.chartfig { margin: 12px 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.chartfig figcaption { font-weight: 600; }
.chart { width: 100%; height: auto; max-width: 560px; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--ink-3); stroke-width: 1; }
.chart .tick { fill: var(--ink-2); font-size: 14px; }
.chart .val, .chart .lab { fill: var(--ink); font-size: 15px; }
.chart .s1 { fill: var(--series-1); } .chart .s2 { fill: var(--series-2); } .chart .s3 { fill: var(--series-3); }
.chart .ln { fill: none; stroke-width: 2; } .chart .ln.s1 { stroke: var(--series-1); } .chart .ln.s2 { stroke: var(--series-2); } .chart .ln.s3 { stroke: var(--series-3); }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart path.s1, .chart path.s2, .chart path.s3 { stroke: var(--surface); stroke-width: 1; }
.chart .pie-s { stroke: var(--surface); stroke-width: 2; }
.pie-0 { fill: var(--pie-0); } .pie-1 { fill: var(--pie-1); } .pie-2 { fill: var(--pie-2); }
.pie-3 { fill: var(--pie-3); } .pie-4 { fill: var(--pie-4); } .pie-5 { fill: var(--pie-5); }
.legend { display: flex; gap: 14px; font-size: .85rem; color: var(--ink-2); margin: 4px 0; }
.sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.sw.s1 { background: var(--series-1); } .sw.s2 { background: var(--series-2); } .sw.s3 { background: var(--series-3); }
.astable summary { cursor: pointer; font-size: .85rem; color: var(--ink-3); }

/* ---------- questions ---------- */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; margin: 16px 0; }
.q-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
.q-stem { font-size: 1.02rem; }
.opts { list-style: none; padding: 0; margin: 12px 0 6px; display: grid; gap: 8px; }
.opt { width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px;
  border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; cursor: pointer; min-height: 48px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .letter { font-weight: 700; color: var(--ink-3); min-width: 1.4em; }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.fb { border-radius: 12px; padding: 12px 16px; margin-top: 10px; }
.fb.good { background: var(--good-soft); } .fb.bad { background: var(--bad-soft); }
.fb-title { font-weight: 700; }
.expl-all details { border-top: 1px solid var(--line); padding: 6px 0; }
.expl-all summary { cursor: pointer; }
.hints { margin-top: 10px; }
.hint { background: var(--warn-soft); border-radius: 10px; padding: 8px 14px; margin: 6px 0; }
.sol ol { padding-left: 1.3em; }
.q-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- timed ---------- */
.timer { position: sticky; top: 60px; z-index: 5; display: flex; justify-content: space-between; align-items: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px; margin-bottom: 12px; }
.timer .t { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.2rem; }
.timer.low .t { color: var(--warn); }
.qnav { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.qnav button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; }
.qnav button.ans { background: var(--accent-soft); border-color: var(--accent); }
.qnav button.cur { outline: 2px solid var(--accent); }
.qnav button.flag { border-style: dashed; border-color: var(--warn); }

/* ---------- dashboard bars ---------- */
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.drow { display: grid; grid-template-columns: minmax(0, 1fr) 120px 60px; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.today li { margin: 4px 0; }
.plan-table { width: 100%; border-collapse: collapse; font-size: .9rem; }
.plan-table td, .plan-table th { border-bottom: 1px solid var(--line); padding: 6px 8px; vertical-align: top; text-align: left; }
.plan-table tr.is-today { background: var(--accent-soft); }

/* ---------- print ---------- */
@media print {
  html { font-size: 12pt; }
  .top, .side, .foot .no-print, .q-actions, .menu-btn, .btn, .timer, .qnav { display: none !important; }
  .layout { display: block; }
  main { max-width: none; padding: 0; }
  .box, .q, .card, .chartfig { break-inside: avoid; border-color: #999; }
  body { background: #fff; color: #000; }
  details { display: block; } details > * { display: block; }
}

/* main receives programmatic focus on navigation; no visible ring needed there */
main:focus, main:focus-visible { outline: none; }

/* ---------- abstract reasoning figures ---------- */
.ab-series { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.ab-cell { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .8rem; color: var(--ink-3); }
.ab-fig { display: block; }
.ab-frame { fill: #ffffff; stroke: #57524b; stroke-width: 1.5; }
.ab-dash { stroke-dasharray: 6 4; fill: transparent; stroke: var(--ink-3); }
.ab-grid { stroke: #d9d3c8; stroke-width: 1; }
/* figures keep literal black / white / grey in both themes, so explanations ("black") stay true */
.ab-w { fill: #ffffff; stroke: #1f1d1a; stroke-width: 2.2; }
.ab-g { fill: #a8a39a; stroke: #1f1d1a; stroke-width: 2.2; }
.ab-b { fill: #1f1d1a; stroke: #1f1d1a; stroke-width: 2.2; }
.ab-noline { stroke: none; }
.ab-arrow line { stroke: #1f1d1a; stroke-width: 3; stroke-linecap: round; }
.ab-qm { font-size: 54px; fill: var(--ink-3); font-weight: 700; }
.ab-ans .ab-frame { stroke: var(--good); stroke-width: 3; }
.q.abs .opts { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }
.q.abs .opt { flex-direction: column; align-items: center; gap: 4px; padding: 8px; }
.q.abs .opt .letter { min-width: 0; }
@media (max-width: 480px) { .ab-fig { width: 64px; height: 64px; } .q.abs .opts { grid-template-columns: repeat(3, 1fr); } .q.abs .ab-opt { width: 76px; height: 76px; } }

</style>

owledge trap"}], "available": true}, {"id": "L3", "title": "Common traps", "concepts": [{"id": "scope-shift", "title": "Scope shift"}, {"id": "extreme-wording", "title": "Extreme wording"}, {"id": "near-synonyms", "title": "Near-synonyms"}, {"id": "partial-truth", "title": "Partly true statements"}], "available": true}, {"id": "L4", "title": "Fast methods", "concepts": [{"id": "options-first", "title": "Read the options first"}, {"id": "verbal-elimination", "title": "Elimination"}], "available": true}, {"id": "L5", "title": "Exam simulation", "concepts": [{"id": "verbal-exam-strategy", "title": "Verbal exam strategy"}], "available": true}]}, {"id": "abstract", "title": "Abstract reasoning", "stage": "nov2026", "levels": [{"id": "L0", "title": "What a pattern is", "concepts": [{"id": "features", "title": "Features: shape, colour, count, size, position, rotation"}], "available": true}, {"id": "L1", "title": "One rule", "concepts": [{"id": "single-rule", "title": "Series with one rule"}], "available": true}, {"id": "L2", "title": "Two rules at once", "concepts": [{"id": "two-rules", "title": "Two independent rules"}], "available": true}, {"id": "L3", "title": "Tricky rules", "concepts": [{"id": "alternation", "title": "Alternation"}, {"id": "movement", "title": "Movement around a grid"}, {"id": "counting", "title": "Counting sides, angles, intersections"}], "available": true}, {"id": "L4", "title": "Fast methods", "concepts": [{"id": "checklist", "title": "The feature checklist"}, {"id": "abstract-elimination", "title": "Eliminating feature by feature"}], "available": true}, {"id": "L5", "title": "Exam simulation", "concepts": [{"id": "abstract-exam-strategy", "title": "Abstract exam strategy"}], "available": true}]}, {"id": "exam", "title": "Exam week", "stage": "nov2026", "levels": [{"id": "L0", "title": "The last days and the test itself", "concepts": [{"id": "tech-check", "title": "Remote test tech check"}, {"id": "panic-plan", "title": "If you panic mid-test"}], "available": true}]}, {"id": "eu-knowledge", "title": "EU knowledge (2027 stage)", "stage": "later", "levels": [{"id": "L0", "title": "Overview", "concepts": [{"id": "eu-institutions", "title": "The EU institutions"}], "available": true}]}, {"id": "digital", "title": "Digital skills (2027 stage)", "stage": "later", "levels": [{"id": "L0", "title": "Overview", "concepts": [{"id": "digital-basics", "title": "Digital skills basics"}], "available": true}]}, {"id": "essay", "title": "EU free-text essay (2027 stage)", "stage": "later", "levels": [{"id": "L0", "title": "Overview", "concepts": [{"id": "essay-basics", "title": "Essay basics"}], "available": true}]}], "lessons": {"start/L0": {"meta": {"module": "start", "level": "L0", "title": "How the tests work", "status": "draft", "introduces": ["test-format", "combined-pass-mark", "calm-toolkit"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p18", "note": "reasoning tests are pass/fail"}, {"short": "baneth2023", "loc": "p33", "note": "scores of the reasoning tests may be added together; you are not ranked on them"}, {"short": "baneth2023", "loc": "p36", "note": "EU knowledge and digital tests in the new system"}, {"short": "franco1", "loc": "p6", "note": "10 questions in 20 minutes; combined numerical + abstract pass mark in CAST"}, {"short": "franco1", "loc": "p9", "note": "no penalty for wrong answers in older competitions"}], "minutes": 20, "generated_at": "2026-10-14 01:10:00+00:00"}, "html": "<p>Welcome. Before any maths or reading practice, let's look at what is actually waiting for you\nin November. Knowing the rules of the game takes away a lot of the fear.<\/p>\n<div class=\"box box-verify\">\n<p class=\"box-h\">TO VERIFY on the EPSO website<\/p>\n<p>The numbers on this page (questions, minutes, pass marks) come from preparation websites and\nolder books, <strong>not yet from the official notice of competition<\/strong> EPSO/AD/427/26. They are very\nlikely right, but check them on the EPSO website (your EPSO account and the notice) before the test.<\/p>\n<\/div>\n<h2 id=\"test-format\">The three reasoning tests<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>In November you take three short <button type=\"button\" class=\"gl\" data-term=\"mcq\">multiple-choice<\/button> tests on a computer: <strong>verbal<\/strong>,\n<strong>numerical<\/strong> and <strong>abstract<\/strong> reasoning. Each question has a few answer options and exactly one is right.<\/p>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Test<\/th>\n<th>Questions<\/th>\n<th>Time<\/th>\n<th>What it checks<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Verbal reasoning<\/td>\n<td>20<\/td>\n<td>35 min<\/td>\n<td>reading a short text carefully and judging which statement it supports<\/td>\n<\/tr>\n<tr>\n<td>Numerical reasoning<\/td>\n<td>10<\/td>\n<td>20 min<\/td>\n<td>working with percentages, tables and charts<\/td>\n<\/tr>\n<tr>\n<td>Abstract reasoning<\/td>\n<td>10<\/td>\n<td>10 min<\/td>\n<td>spotting the rule in a series of shapes<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p class=\"muted\">All figures: TO VERIFY on the EPSO website. Later stages (EU knowledge, digital skills, a short essay)\ncome in 2027, only for people who pass these tests.<\/p>\n\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Think of a driving test that has a theory part. Nobody needs to be a mechanic to pass it — you need\nto know the type of questions, practise them, and arrive rested. These tests are the same:\nthey check a few skills you can train, not talent you are born with.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: How a numerical question looks<\/p>\n<ol>\n<li>You see a small table or chart, for example the number of visitors to three museums.<\/li>\n<li>Below it there is one question, for example: \"By how many visitors did the smallest museum grow?\"<\/li>\n<li>Then four or five answers, A to E.<\/li>\n<li>You work it out (an on-screen calculator is provided — TO VERIFY), click one answer, and move on.<\/li>\n<li>There is no writing, no proof, no long algebra. Only reading, choosing the right numbers, and a few calculations.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"start-L0-001,start-L0-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Thinking \"verbal is the one I can skip practising — I read every day\". Verbal is the test that also decides your\n<strong>ranking<\/strong> (TO VERIFY), so it deserves at least as much practice as numerical.<\/p>\n<\/div>\n<h2 id=\"combined-pass-mark\">The combined pass mark<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>This is the most reassuring fact in this guide: numerical and abstract reasoning are expected to share\n<strong>one <button type=\"button\" class=\"gl\" data-term=\"pass-mark\">pass mark<\/button> of 10 out of 20<\/strong> (TO VERIFY). Points from one test can make up for the other.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Imagine a school rule: \"your maths mark plus your art mark must be at least 10 out of 20\".\nA 4 in maths is fine if you get a 6 in art. Nobody needs to be top of the class in both.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example<\/p>\n<ol>\n<li>Numerical has 10 questions, abstract has 10 questions: 20 in total.<\/li>\n<li>You need 10 of those 20 right (TO VERIFY).<\/li>\n<li>Suppose you get <strong>4 of 10<\/strong> in numerical.<\/li>\n<li>Then you need <strong>6 of 10<\/strong> in abstract: 4 + 6 = 10. Pass.<\/li>\n<li>Abstract questions are pictures, not maths — and they are very trainable. So a calm, solid numerical\n   score plus a good abstract score is a perfectly safe strategy.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"start-L0-003\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Two opposite mistakes: (1) giving up on numerical because \"I'm bad at maths\" — every numerical point\nmakes abstract easier; (2) spending all your time on numerical and none on abstract. The plan in this\nguide balances both.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Verbal: aim as high as you can (it is ranked). Numerical + abstract: aim for a comfortable margin above\n10/20 together — about 6 + 6 is a good target.<\/p>\n<\/div>\n<h2 id=\"calm-toolkit\">Staying calm<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Nerves are normal and they are not a sign that you are unprepared. A few simple habits stop nerves\nfrom taking your points.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>When you lose your keys in a hurry, you search badly. When you stop, breathe and think \"where was I\nlast?\", you find them. A test works the same way: a calm minute gives you better answers than a panicked one.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Your calm toolkit<\/p>\n<ol>\n<li><strong>Breathe in a box.<\/strong> In for 4 seconds, hold 4, out for 4, hold 4. Twice. It takes 16 seconds and really works.<\/li>\n<li><strong>One question at a time.<\/strong> The question in front of you is the only one that exists.<\/li>\n<li><strong>The 2-minute rule<\/strong> (numerical). If a question has taken 2 minutes and you still don't see the way, pick the most likely answer, flag it, and move on.<\/li>\n<li><strong>Never leave a blank.<\/strong> In earlier competitions a wrong answer cost nothing more than an empty one (TO VERIFY for yours). A guess has a chance; a blank has none.<\/li>\n<li><strong>Expect a few hard ones.<\/strong> Everyone meets questions they can't do. Skipping them is a strategy, not a failure.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"start-L0-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Trying to be perfect. You do not need 20 out of 20. Getting stuck on one hard question for five minutes\ncan cost you three simpler ones later.<\/p>\n<\/div>\n<h2>How to use this guide<\/h2>\n<ul>\n<li>Each test has <strong>levels<\/strong> from 0 (foundations) to 5 (exam simulation). Go in order if you can; jump around if you like.<\/li>\n<li>Every lesson follows the same pattern: the idea → an everyday example → a worked example → your turn → a common trap.<\/li>\n<li>Press <strong>\"I'm stuck\"<\/strong> on any exercise as often as you want. Hints come one at a time, then the full solution.<\/li>\n<li>Wrong answers go to the <strong>mistakes bank<\/strong> and come back after 1, 3 and 7 days. That is how they stick.<\/li>\n<li>Your progress is saved in this browser. Once a week, use <strong>Save / load progress<\/strong> to download a copy.<\/li>\n<\/ul>", "sections": [{"id": "test-format", "title": "The three reasoning tests"}, {"id": "combined-pass-mark", "title": "The combined pass mark"}, {"id": "calm-toolkit", "title": "Staying calm"}], "override": false}, "numerical/L0": {"meta": {"module": "numerical", "level": "L0", "title": "Foundations", "status": "draft", "introduces": ["place-value", "decimals", "rounding", "operations", "fractions", "fraction-decimal", "calculator"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p133", "note": "the maths needed is basic: the four operations, ratios, percentages"}, {"short": "baneth2023", "loc": "p136", "note": "on-screen calculator; why mental arithmetic still matters"}, {"short": "franco1", "loc": "p8", "note": "don't over-use the calculator; watch units and scales"}, {"short": "franco2", "loc": "s6", "note": "properties of the four operations"}, {"short": "franco2", "loc": "s9", "note": "table of common fractions as decimals"}], "minutes": 75, "generated_at": "2026-10-14 01:20:00+00:00"}, "html": "<p>This level is about the building blocks. If some of it feels familiar, wonderful — go quickly.\nIf some of it feels rusty, that is completely normal: most adults have not done this since school.\nEverything in the EPSO numerical test is built from the seven small ideas on this page.<\/p>\n<h2 id=\"place-value\">Place value and big numbers<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"digit\">digit<\/button> is worth more or less depending on <strong>where it sits<\/strong> in the number. This is called\n<button type=\"button\" class=\"gl\" data-term=\"place-value\">place value<\/button>. In 3,482 the 3 is worth three thousand, the 4 four hundred, the 8 eighty, the 2 two.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A salary of €2,450 and a salary of €24,500 use almost the same digits — but moving the 2 one place\nto the left makes it ten times bigger. That is place value in real life.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Reading 4,072,500<\/p>\n<ol>\n<li>Start from the right and make groups of three digits: 4 | 072 | 500.<\/li>\n<li>Name the groups from right to left: <em>units<\/em>, <em>thousands<\/em>, <em>millions<\/em>.<\/li>\n<li>Read each group with its name: <strong>4 million<\/strong>, <strong>72 thousand<\/strong>, <strong>500<\/strong>.<\/li>\n<li>So 4,072,500 is \"four million, seventy-two thousand, five hundred\".<\/li>\n<li>A zero means \"nothing in this place\", but it still holds the place: 072 is not the same as 72 in the middle of a number.<\/li>\n<\/ol>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Name<\/th>\n<th>Written<\/th>\n<th>Zeros<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>one thousand<\/td>\n<td>1,000<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>one million<\/td>\n<td>1,000,000<\/td>\n<td>6<\/td>\n<\/tr>\n<tr>\n<td>one billion<\/td>\n<td>1,000,000,000<\/td>\n<td>9<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"quiz-embed\" data-ids=\"num-L0-001,num-L0-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Commas and points change meaning between countries.<\/strong> In English, 1,250 means one thousand two\nhundred and fifty and 1.25 means one and a quarter. In Italian or French texts it is the other way\nround (1.250 and 1,25). Some practice books even mix both. In every table, check which sign is used\nfor thousands before you calculate.<\/p>\n<\/div>\n<h2 id=\"decimals\">Decimals<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"decimal\">decimal<\/button> number has a <button type=\"button\" class=\"gl\" data-term=\"decimal-point\">decimal point<\/button> that separates the whole part (left) from\nthe part smaller than one (right). The first place after the point is <strong>tenths<\/strong>, the second <strong>hundredths<\/strong>,\nthe third <strong>thousandths<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>€3.75 is 3 whole euros and 75 cents — 75 hundredths of a euro. 0.5 kg of flour is half a kilo.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Which is bigger: 0.6 or 0.45?<\/p>\n<ol>\n<li>Give both numbers the same number of decimal places by adding zeros at the end: 0.6 becomes <strong>0.60<\/strong>.\n   (Adding a zero at the end of a decimal does not change its value.)<\/li>\n<li>Now compare 0.60 and 0.45 as if they were 60 and 45.<\/li>\n<li>60 is bigger than 45, so <strong>0.6 is bigger than 0.45<\/strong> — even though 0.45 has more digits.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Multiplying and dividing by 10, 100, 1,000<\/p>\n<ol>\n<li>Multiplying by 10 moves the decimal point <strong>one place to the right<\/strong>: 3.75 × 10 = 37.5.<\/li>\n<li>Multiplying by 100 moves it <strong>two places<\/strong>: 3.75 × 100 = 375.<\/li>\n<li>Dividing by 100 moves it two places <strong>to the left<\/strong>: 375 ÷ 100 = 3.75.<\/li>\n<li>If you run out of digits, add zeros: 0.07 × 100 = 7 (the point jumps over the 0 and the 7).\nYou will use this constantly with percentages in the next level.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L0-003,num-L0-004,num-L0-005\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>\"More digits means bigger\" is true for whole numbers, <strong>not for decimals<\/strong>. 0.405 is smaller than 0.5.\nAlways line the numbers up with the same number of decimal places before comparing.<\/p>\n<\/div>\n<h2 id=\"rounding\">Rounding<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p><button type=\"button\" class=\"gl\" data-term=\"rounding\">Rounding<\/button> means replacing a number with a simpler one that is close to it. Look at the\ndigit right after the place you are rounding to: <strong>5 or more → round up; 4 or less → round down.<\/strong><\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A price of €19.99 is \"about €20\". A 47-minute trip is \"about three quarters of an hour\".<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Round 46,782 to the nearest thousand<\/p>\n<ol>\n<li>The thousands digit is the <strong>6<\/strong> (46,782).<\/li>\n<li>Look at the next digit to the right: the hundreds digit is <strong>7<\/strong>.<\/li>\n<li>7 is 5 or more, so round up: the 6 becomes a 7.<\/li>\n<li>Everything after it becomes zero: <strong>47,000<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Round 3.1462 to two decimal places<\/p>\n<ol>\n<li>Two decimal places means keep the digits up to the hundredths: 3.14|62.<\/li>\n<li>The next digit is <strong>6<\/strong> — 5 or more, so round up: 3.14 becomes <strong>3.15<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L0-006,num-L0-007\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Rounding too early.<\/strong> In a calculation with several steps, keep the full numbers until the end and\nround only the final answer. Rounding at every step adds small errors that can push you onto the\nwrong answer option.<\/p>\n<\/div>\n<h2 id=\"operations\">The four operations and their order<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The four <button type=\"button\" class=\"gl\" data-term=\"operation\">operations<\/button> are addition (+), subtraction (−), multiplication (×) and division (÷).\nWhen a calculation mixes them, there is a fixed <button type=\"button\" class=\"gl\" data-term=\"order-of-operations\">order of operations<\/button>:\n<strong>brackets first, then × and ÷, then + and −.<\/strong><\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Three coffees at €2 each plus one cake at €4: 3 × 2 + 4 = 6 + 4 = <strong>€10<\/strong>. You multiply first\n(the coffees), then add the cake. If you added first you would get 3 × 6 = 18 — the price of\nthree coffee-and-cake sets, which is not what you bought.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: 20 − 4 × 3<\/p>\n<ol>\n<li>There are no brackets.<\/li>\n<li>Do the multiplication first: 4 × 3 = 12.<\/li>\n<li>Then the subtraction: 20 − 12 = <strong>8<\/strong>.<\/li>\n<li>(Going left to right without the rule would give (20 − 4) × 3 = 48 — wrong.)<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Useful properties<\/p>\n<ol>\n<li>For + and × the order does not matter: 7 + 5 = 5 + 7 and 4 × 25 = 25 × 4.<\/li>\n<li>You can regroup to make it easier: 4 × 17 × 25 = (4 × 25) × 17 = 100 × 17 = 1,700.<\/li>\n<li>For − and ÷ the order <strong>does<\/strong> matter: 10 − 4 is not 4 − 10, and 12 ÷ 3 is not 3 ÷ 12.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L0-008,num-L0-009\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Some calculators do the operations in the order you type them.<\/strong> Typing 5 + 3 × 4 on a basic\ncalculator may give 32 instead of 17. Do the multiplication as a separate step, or use the bracket keys.\nCheck how the EPSO on-screen calculator behaves in its practice test (TO VERIFY).<\/p>\n<\/div>\n<h2 id=\"fractions\">Fractions as parts of a whole<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"fraction\">fraction<\/button> such as <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> describes parts of a whole. The bottom number, the\n<button type=\"button\" class=\"gl\" data-term=\"denominator\">denominator<\/button>, says into how many <strong>equal<\/strong> parts the whole is cut. The top number, the\n<button type=\"button\" class=\"gl\" data-term=\"numerator\">numerator<\/button>, says how many of those parts you take.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A pizza cut into 8 equal slices: if you eat 3 slices, you ate <span class=\"frac\"><span>3<\/span><span>8<\/span><\/span> of the pizza.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> of 200<\/p>\n<ol>\n<li>The denominator is 4: cut 200 into 4 equal parts. 200 ÷ 4 = <strong>50<\/strong> (one quarter).<\/li>\n<li>The numerator is 3: take 3 of those parts. 50 × 3 = <strong>150<\/strong>.<\/li>\n<li>So <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span> of 200 = <strong>150<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Simplifying a fraction<\/p>\n<ol>\n<li><span class=\"frac\"><span>6<\/span><span>8<\/span><\/span>: find a number that divides both top and bottom. Both are even, so divide by 2.<\/li>\n<li>6 ÷ 2 = 3 and 8 ÷ 2 = 4, so <span class=\"frac\"><span>6<\/span><span>8<\/span><\/span> = <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span>.<\/li>\n<li>These are <button type=\"button\" class=\"gl\" data-term=\"equivalent-fraction\">equivalent fractions<\/button>: they look different but are the same amount.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L0-010,num-L0-011,num-L0-012\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>A bigger denominator means smaller pieces.<\/strong> <span class=\"frac\"><span>1<\/span><span>8<\/span><\/span> is <em>smaller<\/em> than <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span>: a pizza\nshared by 8 people gives each a smaller slice than a pizza shared by 4.<\/p>\n<\/div>\n<h2 id=\"fraction-decimal\">Fractions ↔ decimals<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A fraction is a division in disguise: <span class=\"frac\"><span>3<\/span><span>8<\/span><\/span> means 3 ÷ 8. Doing the division turns any\nfraction into a decimal.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A quarter of an hour is <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> hour = 0.25 hours = 15 minutes. Half a litre is 0.5 litres.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: <span class=\"frac\"><span>3<\/span><span>8<\/span><\/span> as a decimal, and 0.6 as a fraction<\/p>\n<ol>\n<li><span class=\"frac\"><span>3<\/span><span>8<\/span><\/span> = 3 ÷ 8 = <strong>0.375<\/strong>.<\/li>\n<li>The other way: 0.6 means \"6 tenths\", so 0.6 = <span class=\"frac\"><span>6<\/span><span>10<\/span><\/span>.<\/li>\n<li>Simplify by dividing top and bottom by 2: <span class=\"frac\"><span>6<\/span><span>10<\/span><\/span> = <strong><span class=\"frac\"><span>3<\/span><span>5<\/span><\/span><\/strong>.<\/li>\n<\/ol>\n<\/div>\n<p>These are worth knowing by heart — they appear again and again:<\/p>\n<table>\n<thead>\n<tr>\n<th>Fraction<\/th>\n<th>Decimal<\/th>\n<th><\/th>\n<th>Fraction<\/th>\n<th>Decimal<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1/2<\/td>\n<td>0.5<\/td>\n<td><\/td>\n<td>1/8<\/td>\n<td>0.125<\/td>\n<\/tr>\n<tr>\n<td>1/3<\/td>\n<td>0.333…<\/td>\n<td><\/td>\n<td>1/10<\/td>\n<td>0.1<\/td>\n<\/tr>\n<tr>\n<td>1/4<\/td>\n<td>0.25<\/td>\n<td><\/td>\n<td>2/3<\/td>\n<td>0.667…<\/td>\n<\/tr>\n<tr>\n<td>1/5<\/td>\n<td>0.2<\/td>\n<td><\/td>\n<td>3/4<\/td>\n<td>0.75<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"quiz-embed\" data-ids=\"num-L0-013,num-L0-014\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Time is not decimal.<\/strong> 1.5 hours is 1 hour and <strong>30<\/strong> minutes (half of 60), not 1 hour 50.\nLikewise <span class=\"frac\"><span>1<\/span><span>3<\/span><\/span> is 0.333…, not 0.3.<\/p>\n<\/div>\n<h2 id=\"calculator\">Using the on-screen calculator<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>An on-screen calculator is provided in the test (TO VERIFY on the EPSO website). Use it for\nawkward multiplications and divisions — but <strong>decide what to calculate before you touch it<\/strong>, and\nalways compare the result with a quick <button type=\"button\" class=\"gl\" data-term=\"estimate\">estimate<\/button>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Splitting a restaurant bill of €187 among 4 friends: you know before calculating that it is a bit\nless than €50 each (4 × 50 = 200). The phone says €46.75 — that fits, so you trust it.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A safe calculator routine: 1,248 × 0.15<\/p>\n<ol>\n<li><strong>Plan:<\/strong> write down what you are going to compute (here: 1,248 × 0.15).<\/li>\n<li><strong>Estimate:<\/strong> 1,248 is about 1,200; 1,200 × 0.15 = 180. So the answer should be a bit more than 180.<\/li>\n<li><strong>Calculate:<\/strong> type it in carefully → 187.2.<\/li>\n<li><strong>Check:<\/strong> 187.2 is a bit more than 180. ✓ It makes sense.\nIf the screen had said 1,872 or 18.72, the estimate would tell you instantly that a key was wrong.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L0-015,num-L0-016\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Trusting the screen blindly.<\/strong> A misplaced decimal point or a missed zero gives an answer ten\ntimes too big or too small — and the wrong options are often built exactly from those mistakes.\nThe 5-second estimate protects you.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>In the real test you do not need speed yet at this level. What matters now: understand each idea,\nthen come back to the mistakes bank tomorrow. Speed comes in Level 4.<\/p>\n<\/div>", "sections": [{"id": "place-value", "title": "Place value and big numbers"}, {"id": "decimals", "title": "Decimals"}, {"id": "rounding", "title": "Rounding"}, {"id": "operations", "title": "The four operations and their order"}, {"id": "fractions", "title": "Fractions as parts of a whole"}, {"id": "fraction-decimal", "title": "Fractions ↔ decimals"}, {"id": "calculator", "title": "Using the on-screen calculator"}], "override": false}, "numerical/L1": {"meta": {"module": "numerical", "level": "L1", "title": "Percentages and ratios", "status": "draft", "introduces": ["percent-of", "whole-from-part", "percent-change", "percentage-points", "ratios"], "uses": ["decimals", "fractions", "fraction-decimal", "operations", "rounding", "calculator"], "source_refs": [{"short": "franco1", "loc": "p9", "note": "review of percentage calculations"}, {"short": "franco1", "loc": "p10", "note": "the 'conversion to the unit' shortcut (× 1.25, × 0.75)"}, {"short": "franco1", "loc": "p23", "note": "percentages vs percentage points"}, {"short": "franco1", "loc": "p53", "note": "rule of three to find a total"}, {"short": "baneth2023", "loc": "p180", "note": "ratio warm-up exercises"}], "minutes": 90, "generated_at": "2026-10-14 01:40:00+00:00"}, "html": "<p>Percentages are the heart of the EPSO numerical test: most questions use them somewhere.\nThe good news is that there are only a handful of patterns, and you will meet all of them here.\nEverything builds on Level 0 — especially multiplying by decimals and fractions.<\/p>\n<h2 id=\"percent-of\">Percent of a number<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"percentage\">percentage<\/button> is a fraction out of 100: \"25 per cent\" means 25 out of every 100, so\n25% = <span class=\"frac\"><span>25<\/span><span>100<\/span><\/span> = <strong>0.25<\/strong>. To find a percentage <strong>of<\/strong> a number, turn the percentage into a decimal\nand multiply.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A jacket costs €45 and is 20% off. 20% = 0.20, and 45 × 0.20 = 9. You save <strong>€9<\/strong>, so you pay €36.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: 15% of 240 — two ways<\/p>\n<p><strong>Way 1: decimals<\/strong><\/p>\n<ol>\n<li>15% = 15 ÷ 100 = 0.15.<\/li>\n<li>240 × 0.15 = <strong>36<\/strong>.<\/li>\n<\/ol>\n<p><strong>Way 2: build it from 10%<\/strong> (handy without a calculator)<\/p>\n<ol>\n<li>10% of anything: divide by 10 → 10% of 240 = 24.<\/li>\n<li>5% is half of 10% → 12.<\/li>\n<li>15% = 10% + 5% = 24 + 12 = <strong>36<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: \"What percentage is 18 of 72?\"<\/p>\n<ol>\n<li>Make a fraction: part over whole = <span class=\"frac\"><span>18<\/span><span>72<\/span><\/span>.<\/li>\n<li>Divide: 18 ÷ 72 = 0.25.<\/li>\n<li>Turn into a percentage by multiplying by 100: 0.25 × 100 = <strong>25%<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L1-001,num-L1-002,num-L1-003\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>\"Percent of what?\"<\/strong> Every percentage has a <button type=\"button\" class=\"gl\" data-term=\"base\">base<\/button> — the number it is a percentage <em>of<\/em>.\n\"12% of the population\" and \"12% of the adults\" are different amounts. Before calculating, underline\nwhat the percentage refers to.<\/p>\n<\/div>\n<h2 id=\"whole-from-part\">Finding the whole from a part<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Sometimes you know a <strong>part<\/strong> and what percentage it is, and you need the <strong>whole<\/strong>. Divide the part by\nthe percentage (as a decimal): <strong>whole = part ÷ percentage<\/strong>. This is often called the\n<button type=\"button\" class=\"gl\" data-term=\"rule-of-three\">rule of three<\/button>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>You have saved €300, and that is 40% of the price of a bike. The bike costs 300 ÷ 0.40 = <strong>€750<\/strong>.\nCheck: 40% of 750 = 300 ✓.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: 2,340 students are 3.6% of all students. How many students are there in total?<\/p>\n<ol>\n<li>Write what you know as a little table:<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Percentage<\/th>\n<th>Number of students<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>3.6%<\/td>\n<td>2,340<\/td>\n<\/tr>\n<tr>\n<td>100%<\/td>\n<td>?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ol start=\"2\">\n<li>Rule of three: ? = 2,340 × 100 ÷ 3.6.<\/li>\n<li>2,340 × 100 = 234,000; 234,000 ÷ 3.6 = <strong>65,000<\/strong>.<\/li>\n<li>Same thing in one step: 2,340 ÷ 0.036 = 65,000.<\/li>\n<li>Sanity check: the whole must be much bigger than the part, because 3.6% is a small share. ✓<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L1-004,num-L1-005\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Multiplying instead of dividing.<\/strong> 45 × 0.15 = 6.75 answers \"what is 15% of 45?\", not \"45 is 15% of\nwhat?\". Quick test: when you are looking for the whole, the answer must be <strong>bigger<\/strong> than the part.<\/p>\n<\/div>\n<h2 id=\"percent-change\">Percentage change<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p><button type=\"button\" class=\"gl\" data-term=\"percentage-change\">Percentage change<\/button> tells you how much something grew or shrank compared with where\nit <strong>started<\/strong>: <strong>change ÷ old value × 100<\/strong>. To apply a change quickly, use a\n<button type=\"button\" class=\"gl\" data-term=\"multiplier\">multiplier<\/button>: +25% means × 1.25, −25% means × 0.75.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Your rent goes from €800 to €840. The change is €40; 40 ÷ 800 = 0.05 → a <strong>5% increase<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: From 250 to 290: what is the percentage change?<\/p>\n<ol>\n<li>Change = new − old = 290 − 250 = 40.<\/li>\n<li>Divide by the <strong>old<\/strong> value: 40 ÷ 250 = 0.16.<\/li>\n<li>× 100 → <strong>16% increase<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Applying a change with a multiplier<\/p>\n<ol>\n<li>Increase 400 by 15%: the multiplier is 1 + 0.15 = 1.15. 400 × 1.15 = <strong>460<\/strong>.<\/li>\n<li>Decrease 1,200 by 35%: the multiplier is 1 − 0.35 = 0.65. 1,200 × 0.65 = <strong>780<\/strong>.<\/li>\n<li>One multiplication instead of two steps — this saves real time in the test.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Going backwards: after a 20% rise the price is 360. What was it before?<\/p>\n<ol>\n<li>After the rise, price = old × 1.20.<\/li>\n<li>So old = 360 ÷ 1.20 = <strong>300<\/strong>.<\/li>\n<li>Check: 300 × 1.20 = 360 ✓.<\/li>\n<li>Do <strong>not<\/strong> take 20% off 360 (360 × 0.80 = 288) — the 20% was calculated on the old price, not on 360.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L1-006,num-L1-007,num-L1-008,num-L1-009\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Up and down by the same percent does not bring you back.<\/strong> 100 + 10% = 110; 110 − 10% = 99, not 100,\nbecause the second 10% is taken from a bigger base. And always divide the change by the <strong>old<\/strong> value\n(where you started), never by the new one.<\/p>\n<\/div>\n<h2 id=\"percentage-points\">Percent vs percentage points<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>When a <strong>percentage<\/strong> changes, there are two ways to describe it. The plain difference is measured in\n<button type=\"button\" class=\"gl\" data-term=\"percentage-point\">percentage points<\/button>. The relative change is a percentage change. They are different numbers.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A bank raises its interest rate from 2% to 3%. That is <strong>1 percentage point<\/strong> higher (3 − 2) — but the\ninterest you pay is <strong>50% higher<\/strong> (1 ÷ 2 = 0.5).<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Unemployment falls from 8% to 6%<\/p>\n<ol>\n<li>In percentage points: 8 − 6 = <strong>2 percentage points<\/strong> lower.<\/li>\n<li>As a percentage change: change ÷ old = 2 ÷ 8 = 0.25 → <strong>25% lower<\/strong>.<\/li>\n<li>Both sentences are true. The question tells you which one it wants — read it carefully.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L1-010,num-L1-011,num-L1-012\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Answer options often contain <strong>both<\/strong> numbers (2 and 25 in the example above). If the question says\n\"percentage points\", subtract. If it says \"by what percentage\", divide by the old value.<\/p>\n<\/div>\n<h2 id=\"ratios\">Ratios and proportions<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"ratio\">ratio<\/button> compares amounts. \"Red to blue is 2 : 3\" means: for every 2 red there are 3 blue. Together\nthat is 2 + 3 = <strong>5 parts<\/strong>. A <button type=\"button\" class=\"gl\" data-term=\"proportion\">proportion<\/button> is a fraction of the total: red is <span class=\"frac\"><span>2<\/span><span>5<\/span><\/span> of all.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A recipe uses rice and water in the ratio 1 : 2. For 3 cups of rice you need 6 cups of water.\nAltogether that is 9 cups in 3 parts.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Share €600 in the ratio 1 : 2<\/p>\n<ol>\n<li>Count the parts: 1 + 2 = 3 parts.<\/li>\n<li>One part: 600 ÷ 3 = €200.<\/li>\n<li>The shares: 1 part = <strong>€200<\/strong>, 2 parts = <strong>€400<\/strong>. Check: 200 + 400 = 600 ✓.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Turning numbers into a ratio: 15 women and 25 men<\/p>\n<ol>\n<li>Ratio women : men = 15 : 25.<\/li>\n<li>Simplify like a fraction — divide both by 5: <strong>3 : 5<\/strong>.<\/li>\n<li>So women are 3 of every 8 people: <span class=\"frac\"><span>3<\/span><span>8<\/span><\/span> = 37.5% of the group.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L1-013,num-L1-014,num-L1-015\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>A ratio of 2 : 3 does not mean <span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> of the total.<\/strong> The total has 2 + 3 = 5 parts, so the\nfirst group is <span class=\"frac\"><span>2<\/span><span>5<\/span><\/span>. Always add the parts first.<\/p>\n<\/div>\n<h2>Check yourself<\/h2>\n<p>Two mixed questions using everything from this level. Take your time.<\/p>\n<div class=\"quiz-embed\" data-ids=\"num-L1-016,num-L1-017\"><\/div>\n\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>In the test, percentages hide inside tables and charts (that's Level 2). For now, aim for accuracy:\nwrite each step, and do the 5-second sanity check (\"should the answer be bigger or smaller?\").<\/p>\n<\/div>", "sections": [{"id": "percent-of", "title": "Percent of a number"}, {"id": "whole-from-part", "title": "Finding the whole from a part"}, {"id": "percent-change", "title": "Percentage change"}, {"id": "percentage-points", "title": "Percent vs percentage points"}, {"id": "ratios", "title": "Ratios and proportions"}], "override": false}, "numerical/L2": {"meta": {"module": "numerical", "level": "L2", "title": "Reading tables and charts", "status": "draft", "introduces": ["table-reading", "units", "select-data", "average", "conversion", "charts"], "uses": ["place-value", "decimals", "operations", "fractions", "percent-of", "whole-from-part", "percent-change", "calculator"], "source_refs": [{"short": "franco1", "loc": "p7", "note": "read the question first, then find the relevant data, then look at the options"}, {"short": "franco1", "loc": "p8", "note": "units and scales mixed between question, table and options"}, {"short": "franco1", "loc": "p51", "note": "ignore the data you don't need"}, {"short": "baneth2023", "loc": "p133", "note": "relevant data is hidden among 'noise'"}, {"short": "baneth2023", "loc": "p185", "note": "conversion exercises"}], "minutes": 90, "generated_at": "2026-10-14 02:00:00+00:00"}, "html": "<p>Almost every EPSO numerical question starts with a table or a chart. In this level you learn to\nread them calmly and pick out exactly the numbers you need. The calculations are the ones you already\nknow from Levels 0 and 1 — the new skill is <strong>finding<\/strong> the right numbers.<\/p>\n<p>All the data in this guide's tables and charts is <strong>invented for practice<\/strong>.<\/p>\n<h2 id=\"table-reading\">Reading a table<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"table\">table<\/button> is a grid. Each <button type=\"button\" class=\"gl\" data-term=\"row\">row<\/button> is one thing (a country, a museum), each <button type=\"button\" class=\"gl\" data-term=\"column\">column<\/button> is one\nmeasure (a year, a price). The number you need sits where the right row meets the right column.\nRead the <strong>title<\/strong>, the <strong>headings<\/strong> and the <strong>unit<\/strong> before anything else.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A train timetable: find your station in the rows and your train in the columns. Where they meet is your\ndeparture time. Nobody reads a whole timetable — you go straight to one cell.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Museum visitors<\/p>\n<div class=\"dtable\">\n<table><caption>Visitors to three museums <span class=\"unit\">(in thousands)<\/span><\/caption>\n<thead>\n<tr>\n<th>Museum<\/th>\n<th>2021<\/th>\n<th>2022<\/th>\n<th>2023<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<th scope=\"row\">City Art Museum<\/th>\n<td>520<\/td>\n<td>610<\/td>\n<td>655<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Riverside Museum<\/th>\n<td>300<\/td>\n<td>386<\/td>\n<td>412<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Hill Gallery<\/th>\n<td>145<\/td>\n<td>172<\/td>\n<td>230<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p>Question: \"How many people visited the Riverside Museum in 2022?\"<\/p>\n<ol>\n<li>Title and unit first: visitors, <strong>in thousands<\/strong>.<\/li>\n<li>Row: Riverside Museum. Column: 2022. The cell says <strong>386<\/strong>.<\/li>\n<li>Apply the unit: 386 thousand = 386 × 1,000 = <strong>386,000 visitors<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L2-001,num-L2-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Forgetting the unit line.<\/strong> The cell says 386, but the answer is 386,000. Answer options are often\nbuilt from exactly this mistake (386 and 386,000 both appear). Read the title and the unit every time.<\/p>\n<\/div>\n<h2 id=\"units\">Units: thousands, millions, per cent<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Tables save space by writing large numbers in a bigger <button type=\"button\" class=\"gl\" data-term=\"unit\">unit<\/button>: \"in thousands\", \"€ million\",\n\"thousand tonnes\". To get the real number, multiply back. Remember: <strong>1 million = 1,000 thousand<\/strong>\nand <strong>1 billion = 1,000 million<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A car weighing 2,000 kg is 2 tonnes. A flat costing €250 thousand costs €250,000. Same amount, different unit.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Exports of €3.6 billion — how many € million?<\/p>\n<ol>\n<li>1 billion = 1,000 million.<\/li>\n<li>3.6 × 1,000 = <strong>3,600<\/strong> → €3,600 million.<\/li>\n<li>Going the other way (million → billion), divide by 1,000: 3,600 ÷ 1,000 = 3.6.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L2-003,num-L2-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>The question and the table can use different units.<\/strong> The table is in thousand tonnes, the answers\nin million tonnes; the text says kilograms, the chart says tonnes. Convert everything to the unit of\nthe <strong>answer options<\/strong> before you choose.<\/p>\n<\/div>\n<h2 id=\"select-data\">Choosing only the data you need<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>EPSO tables contain more information than the question needs — on purpose. Your first job is to\nfind the two or three numbers that matter and <strong>ignore everything else<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>On a long supermarket receipt, if you want to know what you spent on fruit, you only look at the fruit\nlines. The total, the date and the bread don't matter for that question.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A busy table, a simple question<\/p>\n<div class=\"dtable\">\n<table><caption>Public libraries, 2023 <span class=\"unit\">(invented data)<\/span><\/caption>\n<thead>\n<tr>\n<th>Country<\/th>\n<th>Libraries<\/th>\n<th>Books lent (million)<\/th>\n<th>Registered users (thousand)<\/th>\n<th>Users as % of population<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<th scope=\"row\">Belgium<\/th>\n<td>1,140<\/td>\n<td>31.2<\/td>\n<td>2,280<\/td>\n<td>19.6<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Denmark<\/th>\n<td>520<\/td>\n<td>28.4<\/td>\n<td>2,950<\/td>\n<td>49.8<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Portugal<\/th>\n<td>310<\/td>\n<td>6.1<\/td>\n<td>830<\/td>\n<td>8.0<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">Ireland<\/th>\n<td>330<\/td>\n<td>15.0<\/td>\n<td>1,060<\/td>\n<td>20.4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p>Question: \"How many more books were lent in Belgium than in Ireland?\"<\/p>\n<ol>\n<li><strong>Read the question first.<\/strong> Key words: <em>books lent<\/em>, <em>Belgium<\/em>, <em>Ireland<\/em>, <em>how many more<\/em> (a subtraction).<\/li>\n<li><strong>Find the data.<\/strong> One column (Books lent, million), two rows (Belgium, Ireland): 31.2 and 15.0.\n   Everything else — libraries, users, percentages, Denmark, Portugal — is noise.<\/li>\n<li><strong>Look at the options<\/strong> to see the unit they use.<\/li>\n<li><strong>Calculate:<\/strong> 31.2 − 15.0 = 16.2 → <strong>16.2 million<\/strong> books.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L2-005,num-L2-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Using a number because it is there.<\/strong> If a column doesn't appear in your question, it is almost\ncertainly a distraction. Don't try to work out why it is in the table.<\/p>\n<\/div>\n<h2 id=\"average\">Simple averages<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The <button type=\"button\" class=\"gl\" data-term=\"average\">average<\/button> (also called the mean) is the total shared out equally: <strong>add all the values, then\ndivide by how many values there are.<\/strong><\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>You spent €60, €45, €75 and €40 on groceries in four weeks. Total €220; 220 ÷ 4 = <strong>€55 a week<\/strong> on average.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Average temperature of 12°, 15°, 9° and 14°<\/p>\n<ol>\n<li>Add: 12 + 15 + 9 + 14 = 50.<\/li>\n<li>Count the values: 4.<\/li>\n<li>Divide: 50 ÷ 4 = <strong>12.5°<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Finding a missing value<\/p>\n<p>\"The average of four numbers is 20. Three of them are 18, 25 and 15. What is the fourth?\"<\/p>\n<ol>\n<li>If the average of 4 numbers is 20, their total is 4 × 20 = 80.<\/li>\n<li>The three known numbers add up to 18 + 25 + 15 = 58.<\/li>\n<li>The fourth is 80 − 58 = <strong>22<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L2-007,num-L2-008\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Dividing by the wrong count.<\/strong> If one of the values is 0, it still counts. And the average of\npercentages from groups of different sizes is not the overall percentage — be careful when a\nquestion mixes them.<\/p>\n<\/div>\n<h2 id=\"conversion\">Unit and currency conversion<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Converting means multiplying or dividing by a rate, such as an <button type=\"button\" class=\"gl\" data-term=\"exchange-rate\">exchange rate<\/button>. The\nrate tells you how many of one unit equal <strong>one<\/strong> of the other. Decide the direction with common\nsense: converting into a \"smaller\" unit gives a bigger number.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>On holiday, €1 = 1.08 US dollars. A $54 dinner costs 54 ÷ 1.08 = <strong>€50<\/strong>. Euros are \"bigger\" than\ndollars here, so you need fewer of them.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: €1 = 7.45 Danish kroner (DKK). Convert both ways.<\/p>\n<ol>\n<li><strong>Euros → kroner:<\/strong> each euro is 7.45 kroner, so multiply. €200 × 7.45 = <strong>1,490 DKK<\/strong>.<\/li>\n<li><strong>Kroner → euros:<\/strong> divide by the rate. 1,490 ÷ 7.45 = <strong>€200<\/strong>.<\/li>\n<li>Sanity check: there should be <em>more<\/em> kroner than euros (each euro is worth several kroner) ✓.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L2-009,num-L2-010,num-L2-011\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Multiplying when you should divide.<\/strong> Before calculating, ask: \"should the number in the new unit be\nbigger or smaller?\" The wrong-direction answer is almost always among the options.<\/p>\n<\/div>\n<h2 id=\"charts\">Bar, line and pie charts<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A <button type=\"button\" class=\"gl\" data-term=\"bar-chart\">bar chart<\/button> compares amounts (taller bar = more). A <button type=\"button\" class=\"gl\" data-term=\"line-chart\">line chart<\/button> shows how\nsomething changes over time. A <button type=\"button\" class=\"gl\" data-term=\"pie-chart\">pie chart<\/button> shows how a whole is split into shares that add\nup to 100%. In every chart, read the <strong>title<\/strong>, the <button type=\"button\" class=\"gl\" data-term=\"axis\">axis<\/button> labels with their <strong>unit<\/strong>, and the\n<button type=\"button\" class=\"gl\" data-term=\"legend\">legend<\/button> first.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Your phone's battery screen shows a line falling during the day (a line chart). Your bank app shows\nspending by category as a ring (a pie chart). You already read these every day.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Reading a bar chart<\/p>\n<p>Suppose a bar chart shows <em>new bikes sold (thousands)<\/em>: 2022 = 40, 2023 = 55, 2024 = 70.\n\"By how much did sales grow from 2022 to 2024?\"<\/p>\n<ol>\n<li>Title and unit: bikes sold, <strong>in thousands<\/strong>.<\/li>\n<li>Read the two bars you need: 2022 = 40, 2024 = 70. (2023 is not needed.)<\/li>\n<li>Difference: 70 − 40 = 30 → 30 thousand = <strong>30,000 bikes<\/strong>.<\/li>\n<li>In the test, each chart has a \"show as table\" view of the exact values — but in the real exam,\n   you read values from the chart itself, so practise reading the bars too.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L2-012,num-L2-013,num-L2-014\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Axes that don't start at zero<\/strong> make small differences look huge. A bar twice as tall does not\nalways mean twice as much — read the numbers, not the picture. And in a pie chart, the shares are\npercentages of a total that is usually given somewhere else (title or note).<\/p>\n<\/div>\n<h2>Check yourself<\/h2>\n<p>Two exam-style questions that combine this level with percentages. Use the full method:\nquestion → data → options → calculate.<\/p>\n<div class=\"quiz-embed\" data-ids=\"num-L2-015,num-L2-016\"><\/div>\n\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>The 4-step routine for every table or chart question:<\/p>\n<ol>\n<li><strong>Read the question<\/strong> and underline what is asked (and in which unit).<\/li>\n<li><strong>Find only the data you need<\/strong> — one or two columns, a few rows.<\/li>\n<li><strong>Look at the options<\/strong>: far apart → estimate; close together → calculate exactly.<\/li>\n<li><strong>Calculate, then sanity-check<\/strong> against your estimate.\nIn the real test you have about 2 minutes per question (TO VERIFY). Right now, accuracy matters more than speed.<\/li>\n<\/ol>\n<\/div>", "sections": [{"id": "table-reading", "title": "Reading a table"}, {"id": "units", "title": "Units: thousands, millions, per cent"}, {"id": "select-data", "title": "Choosing only the data you need"}, {"id": "average", "title": "Simple averages"}, {"id": "conversion", "title": "Unit and currency conversion"}, {"id": "charts", "title": "Bar, line and pie charts"}], "override": false}, "numerical/L3": {"meta": {"module": "numerical", "level": "L3", "title": "Multi-step problems", "status": "draft", "introduces": ["chained-percent", "growth-years", "per-capita", "speed-time-distance", "multi-step"], "uses": ["percent-of", "whole-from-part", "percent-change", "percentage-points", "ratios", "table-reading", "units", "select-data", "average", "conversion", "charts"], "source_refs": [{"short": "franco1", "loc": "p10", "note": "multipliers make chained changes one multiplication"}, {"short": "baneth2023", "loc": "p160", "note": "per capita / percentage warm-up"}, {"short": "baneth2023", "loc": "p167", "note": "speed, time and distance warm-up"}, {"short": "franco2", "loc": "s15", "note": "summary of the method: main steps"}, {"short": "franco1", "loc": "p49", "note": "five steps to solve the exercises"}], "minutes": 90, "generated_at": "2026-10-14 03:00:00+00:00"}, "html": "<p>Real EPSO questions usually need <strong>two or three small steps<\/strong> in a row — for example, read two\nvalues from a table, turn them into a percentage, then compare. Nothing here is new mathematics:\nit is the Level 1 and Level 2 tools, used one after the other. The skill is to <strong>plan the steps\nbefore calculating<\/strong>.<\/p>\n<h2 id=\"chained-percent\">Chained percentages<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>When a value changes by one percentage and <strong>then<\/strong> by another, the changes multiply — they do not\nadd. Turn each change into a <button type=\"button\" class=\"gl\" data-term=\"multiplier\">multiplier<\/button> and multiply the multipliers together.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A shop raises a €100 price by 10%, and later by another 20%. After the first rise: €110. The second\n20% is taken from €110, not from €100: 110 × 1.20 = <strong>€132<\/strong>. The total rise is 32%, not 30%.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: +10% then +20%<\/p>\n<ol>\n<li>Multipliers: +10% → × 1.10; +20% → × 1.20.<\/li>\n<li>Multiply them: 1.10 × 1.20 = 1.32.<\/li>\n<li>1.32 means \"× 1.32\", which is a <strong>32% increase<\/strong> overall.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: −20% then +25%<\/p>\n<ol>\n<li>Multipliers: −20% → × 0.80; +25% → × 1.25.<\/li>\n<li>0.80 × 1.25 = 1.00.<\/li>\n<li>× 1.00 means <strong>no change<\/strong>: the value is back where it started. (Check: 100 → 80 → 100.)<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L3-001,num-L3-002,num-L3-003\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Adding the percentages.<\/strong> +10% and +20% is not +30%; −20% and +25% is not +5%. Whenever the\nsecond change is \"of the new value\", multiply the multipliers.<\/p>\n<\/div>\n<h2 id=\"growth-years\">Growth over several years<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>If something grows by the <strong>same percentage every year<\/strong>, multiply by the same multiplier once\nper year. Two years of 5% growth: × 1.05 × 1.05.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>€1,000 in a savings account at 2% a year: after one year €1,020; after two years 1,020 × 1.02 =\n€1,040.40 — slightly more than €1,040, because the second year's interest is also earned on the\nfirst year's interest.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A town of 20,000 people grows 5% a year. Population after 2 years?<\/p>\n<ol>\n<li>Multiplier for one year: 1.05.<\/li>\n<li>Two years: 20,000 × 1.05 × 1.05.<\/li>\n<li>20,000 × 1.05 = 21,000; 21,000 × 1.05 = <strong>22,050<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Going back in time: 2 years of 10% growth gave 12,100. What was the start?<\/p>\n<ol>\n<li>Start × 1.10 × 1.10 = 12,100, so start × 1.21 = 12,100.<\/li>\n<li>Start = 12,100 ÷ 1.21 = <strong>10,000<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L3-004,num-L3-005,num-L3-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Multiplying the yearly rate by the number of years.<\/strong> 5% for 2 years is ×1.1025 (10.25%), not\n10%. Over 2 years the gap is small, so read the options: if 10% and 10.25% are both there, the\nquestion wants the exact one.<\/p>\n<\/div>\n<h2 id=\"per-capita\">Per capita and per unit<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p><button type=\"button\" class=\"gl\" data-term=\"per-capita\">Per capita<\/button> means \"per person\": divide a total by the number of people. The same idea works\n\"per unit\" for anything — per hectare, per employee, per car. <strong>Keep the units in view:<\/strong> € million\ndivided by million people gives € per person.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A €360 dinner for 8 people costs 360 ÷ 8 = <strong>€45 per person<\/strong>.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Health spending per person<\/p>\n<p>A country spends <strong>€46.2 billion<\/strong> on health and has <strong>10.5 million<\/strong> inhabitants.<\/p>\n<ol>\n<li>Make the units match: €46.2 billion = €46,200 million.<\/li>\n<li>€ million ÷ million people = € per person: 46,200 ÷ 10.5 = <strong>€4,400 per person<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L3-007,num-L3-008,num-L3-009\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Mismatched units.<\/strong> Billions divided by millions gives thousands. Before dividing, write both\nnumbers in the same unit (both in millions is usually easiest).<\/p>\n<\/div>\n<h2 id=\"speed-time-distance\">Speed, time and distance<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Three quantities, one relationship: <strong>distance = speed × time<\/strong>. From it:\nspeed = distance ÷ time, and time = distance ÷ speed. Time must be in the same unit as the speed\n(km/h needs hours).<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A train at 120 km/h for 2 hours travels 240 km. A 90 km trip at 60 km/h takes 1.5 hours = 1 hour 30 minutes.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A cyclist covers 36 km in 1 hour 30 minutes. Average speed?<\/p>\n<ol>\n<li>Turn the time into hours: 30 minutes = 0.5 hours → 1.5 hours.<\/li>\n<li>Speed = distance ÷ time = 36 ÷ 1.5 = <strong>24 km/h<\/strong>.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Minutes to hours and back<\/p>\n<ol>\n<li>Minutes → hours: divide by 60. 45 min = 45 ÷ 60 = 0.75 h.<\/li>\n<li>Hours → minutes: multiply by 60. 0.4 h = 0.4 × 60 = 24 min.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L3-010,num-L3-011,num-L3-012\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Using minutes as if they were decimals.<\/strong> 1 hour 30 minutes is 1.5 hours, not 1.3 hours.\nAnd 2.25 hours is 2 hours 15 minutes, not 2 hours 25.<\/p>\n<\/div>\n<h2 id=\"multi-step\">Multi-step table problems<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>For a question that needs several steps, <strong>write the plan in words before you calculate<\/strong>:\n\"first X, then Y, then compare\". Each step is something you already know.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>\"Is it cheaper to buy 6 bottles at €1.20 each or a pack of 6 for €6.50?\" Plan: (1) cost of 6 single\nbottles; (2) compare with the pack. 6 × 1.20 = 7.20 &gt; 6.50 → the pack.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Unemployment rate from two columns<\/p>\n<div class=\"dtable\">\n<table><caption>Labour market, 2024 <span class=\"unit\">(thousands; invented data)<\/span><\/caption>\n<thead>\n<tr>\n<th>Region<\/th>\n<th>Labour force<\/th>\n<th>Unemployed<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<th scope=\"row\">North<\/th>\n<td>1,250<\/td>\n<td>75<\/td>\n<\/tr>\n<tr>\n<th scope=\"row\">South<\/th>\n<td>980<\/td>\n<td>98<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p>Question: \"How many percentage points higher was the unemployment rate in the South than in the North?\"<\/p>\n<ol>\n<li><strong>Plan:<\/strong> rate North; rate South; subtract (percentage points!).<\/li>\n<li>North: 75 ÷ 1,250 = 0.06 → 6%.<\/li>\n<li>South: 98 ÷ 980 = 0.10 → 10%.<\/li>\n<li>Difference: 10 − 6 = <strong>4 percentage points<\/strong>.\nThe unit \"thousands\" cancels out inside each rate, so you never need to multiply by 1,000.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"num-L3-013,num-L3-014,num-L3-015\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Starting to calculate before reading to the end of the question.<\/strong> The last words often decide the\nstep you need (\"…in percentage points\", \"…per inhabitant\", \"…in 2022 prices\"). Read the full question,\nwrite the plan, then calculate.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Exam-style questions at this level take 2–3 minutes. If a plan has more than three steps, check\nwhether you misread the question — EPSO questions are rarely longer than that.<\/p>\n<\/div>", "sections": [{"id": "chained-percent", "title": "Chained percentages"}, {"id": "growth-years", "title": "Growth over several years"}, {"id": "per-capita", "title": "Per capita and per unit"}, {"id": "speed-time-distance", "title": "Speed, time and distance"}, {"id": "multi-step", "title": "Multi-step table problems"}], "override": false}, "numerical/L4": {"meta": {"module": "numerical", "level": "L4", "title": "Fast methods", "status": "draft", "introduces": ["estimation", "magnitude-elimination", "quick-variation", "fraction-shortcuts"], "uses": ["rounding", "calculator", "fraction-decimal", "percent-of", "whole-from-part", "percent-change", "chained-percent", "per-capita", "table-reading", "select-data"], "source_refs": [{"short": "baneth2023", "loc": "p135", "note": "round, drop the zeros, compare — when the options are far apart"}, {"short": "baneth2023", "loc": "p146", "note": "order of magnitude"}, {"short": "franco2", "loc": "s7", "note": "how to quickly obtain a variation between values"}, {"short": "franco2", "loc": "s9", "note": "converting fractions to decimals faster"}, {"short": "franco1", "loc": "p7", "note": "look at the options before choosing a method"}], "minutes": 75
