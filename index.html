m>did not rule out<\/em> a second vote.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L2-001", "module": "verbal", "level": "L2", "concept": "inference", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Every member of the jury must attend all three days of the competition. Ana Kovač has been appointed to the jury this year. The competition takes place from 4 to 6 June.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Ana Kovač has served on the jury before.", "explanation": "<p><strong>Cannot say.<\/strong> We only know she was appointed <em>this year<\/em>.<\/p>"}, {"text": "The jury has three members.", "explanation": "<p><strong>Cannot say.<\/strong> Three is the number of <em>days<\/em>, not members.<\/p>"}, {"text": "Ana Kovač must be present on 5 June.", "explanation": "<p><strong>True.<\/strong> Every jury member must attend all three days (4–6 June), and she is a member — so she must be there on the 5th.<\/p>"}, {"text": "Ana Kovač will chair the jury.", "explanation": "<p><strong>Cannot say.<\/strong> Nothing is said about who chairs the jury.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Combine sentences 1 and 2, then check the dates in sentence 3."], "solution": ["A — Cannot say: We only know she was appointed <em>this year<\/em>.", "B — Cannot say: Three is the number of <em>days<\/em>, not members.", "C — True: Every jury member must attend all three days (4–6 June), and she is a member — so she must be there on the 5th.", "D — Cannot say: Nothing is said about who chairs the jury.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L2-002", "module": "verbal", "level": "L2", "concept": "inference", "difficulty": 3, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Applications from students who have not passed the language test are rejected automatically. Marco's application was accepted for review last week. Only 40 exchange places are available.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Marco will get an exchange place.", "explanation": "<p><strong>Cannot say.<\/strong> His application is under review; places are limited — we don't know the outcome.<\/p>"}, {"text": "Marco has passed the language test.", "explanation": "<p><strong>True.<\/strong> If he had not passed, his application would have been rejected automatically. It was accepted for review, so he must have passed.<\/p>"}, {"text": "More than 40 students applied.", "explanation": "<p><strong>Cannot say.<\/strong> The number of applicants is not given.<\/p>"}, {"text": "Marco's language skills are excellent.", "explanation": "<p><strong>Cannot say.<\/strong> Passing a test doesn't tell us his skills are <em>excellent<\/em>.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "What would have happened to Marco's application if he had NOT passed the test?"], "solution": ["A — Cannot say: His application is under review; places are limited — we don't know the outcome.", "B — True: If he had not passed, his application would have been rejected automatically. It was accepted for review, so he must have passed.", "C — Cannot say: The number of applicants is not given.", "D — Cannot say: Passing a test doesn't tell us his skills are <em>excellent<\/em>.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L2-003", "module": "verbal", "level": "L2", "concept": "outside-knowledge", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The Danube flows through several capital cities on its way to the Black Sea. Along its course, the river is used for transport, energy production and tourism.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The Danube flows through Vienna and Budapest.", "explanation": "<p><strong>Cannot say.<\/strong> True in real life — but the passage doesn't name any city. Outside knowledge doesn't count.<\/p>"}, {"text": "The Danube is Europe's longest river.", "explanation": "<p><strong>Cannot say.<\/strong> Not in the passage (and in fact the Volga is longer). Either way, the passage can't confirm it.<\/p>"}, {"text": "The Danube ends in the Black Sea.", "explanation": "<p><strong>True.<\/strong> It flows 'on its way to the Black Sea'.<\/p>"}, {"text": "The Danube is used mainly for tourism.", "explanation": "<p><strong>Cannot say.<\/strong> Tourism is one of three uses; <em>mainly<\/em> is not supported.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement could someone who has never heard of the Danube prove from these two sentences?"], "solution": ["A — Cannot say: True in real life — but the passage doesn't name any city. Outside knowledge doesn't count.", "B — Cannot say: Not in the passage (and in fact the Volga is longer). Either way, the passage can't confirm it.", "C — True: It flows 'on its way to the Black Sea'.", "D — Cannot say: Tourism is one of three uses; <em>mainly<\/em> is not supported.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L2-004", "module": "verbal", "level": "L2", "concept": "outside-knowledge", "difficulty": 3, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The euro banknotes show windows, doorways and bridges in different architectural styles. The designs were chosen to avoid showing any real, existing monument, so that no single country would be favoured.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Each euro banknote shows a famous monument from a different country.", "explanation": "<p><strong>False.<\/strong> The designs deliberately avoid real, existing monuments.<\/p>"}, {"text": "The designers wanted to avoid favouring any one country.", "explanation": "<p><strong>True.<\/strong> 'So that no single country would be favoured' states this aim.<\/p>"}, {"text": "Euro banknotes and coins were introduced in 2002.", "explanation": "<p><strong>Cannot say.<\/strong> True in real life, but the passage gives no date.<\/p>"}, {"text": "The bridges shown on the notes were later built as real bridges in a Dutch town.", "explanation": "<p><strong>Cannot say.<\/strong> This is a real fact, but nothing in the passage mentions it — a classic outside-knowledge trap.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Ignore everything you know about the euro. What does the passage itself say about the designers' aim?"], "solution": ["A — False: The designs deliberately avoid real, existing monuments.", "B — True: 'So that no single country would be favoured' states this aim.", "C — Cannot say: True in real life, but the passage gives no date.", "D — Cannot say: This is a real fact, but nothing in the passage mentions it — a classic outside-knowledge trap.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L3-001", "module": "verbal", "level": "L3", "concept": "scope-shift", "difficulty": 3, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>In a survey of 1,200 nurses in Ireland, 62% said they had worked unpaid overtime in the past month. The survey was carried out by the national nursing union.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Most health workers in Europe work unpaid overtime.", "explanation": "<p><strong>Cannot say.<\/strong> Scope shift: from Irish nurses surveyed to all European health workers.<\/p>"}, {"text": "Nearly two thirds of the Irish nurses surveyed had worked unpaid overtime in the previous month.", "explanation": "<p><strong>True.<\/strong> 62% is nearly two thirds, and the scope (nurses surveyed, past month) matches.<\/p>"}, {"text": "62% of all Irish nurses work unpaid overtime every month.", "explanation": "<p><strong>Cannot say.<\/strong> Scope shift twice: <em>surveyed<\/em> → <em>all<\/em> nurses, <em>past month<\/em> → <em>every month<\/em>.<\/p>"}, {"text": "The survey was commissioned by the Irish government.", "explanation": "<p><strong>False.<\/strong> It was carried out by the nursing union.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Check who exactly is being described, and over what period."], "solution": ["A — Cannot say: Scope shift: from Irish nurses surveyed to all European health workers.", "B — True: 62% is nearly two thirds, and the scope (nurses surveyed, past month) matches.", "C — Cannot say: Scope shift twice: <em>surveyed<\/em> → <em>all<\/em> nurses, <em>past month<\/em> → <em>every month<\/em>.", "D — False: It was carried out by the nursing union.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L3-002", "module": "verbal", "level": "L3", "concept": "scope-shift", "difficulty": 3, "kind": "practice", "answer": 2, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Three of the five member libraries in the network now lend tools and kitchen equipment as well as books. The idea began in the largest library, where tool loans have grown every year since 2020.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "All libraries in the network lend tools.", "explanation": "<p><strong>False.<\/strong> Only three of the five do.<\/p>"}, {"text": "Tool loans have grown every year in all member libraries.", "explanation": "<p><strong>Cannot say.<\/strong> Scope shift: growth is reported only for the <em>largest<\/em> library.<\/p>"}, {"text": "Tool lending started in the network's largest library.", "explanation": "<p><strong>True.<\/strong> 'The idea began in the largest library.'<\/p>"}, {"text": "Libraries across the country now lend tools.", "explanation": "<p><strong>Cannot say.<\/strong> Scope shift from one network to the whole country.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement keeps exactly the same scope as the passage?"], "solution": ["A — False: Only three of the five do.", "B — Cannot say: Scope shift: growth is reported only for the <em>largest<\/em> library.", "C — True: 'The idea began in the largest library.'", "D — Cannot say: Scope shift from one network to the whole country.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L3-003", "module": "verbal", "level": "L3", "concept": "extreme-wording", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Some studies suggest that people who read regularly may sleep better, although researchers say more evidence is needed. Reading on paper rather than on screens might also make a difference.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "There is some evidence of a link between regular reading and better sleep.", "explanation": "<p><strong>True.<\/strong> 'Some studies suggest' = some evidence; the wording is as cautious as the passage.<\/p>"}, {"text": "Reading before bed guarantees a good night's sleep.", "explanation": "<p><strong>Cannot say.<\/strong> <em>Guarantees<\/em> is far stronger than <em>may<\/em>.<\/p>"}, {"text": "Researchers agree that reading improves sleep.", "explanation": "<p><strong>False.<\/strong> Researchers say <em>more evidence is needed<\/em> — they have not reached agreement.<\/p>"}, {"text": "Reading on screens always disturbs sleep.", "explanation": "<p><strong>Cannot say.<\/strong> The passage says paper vs screen <em>might<\/em> make a difference; <em>always disturbs<\/em> is extreme.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Look for the statement that keeps the passage's careful words (<em>some<\/em>, <em>may<\/em>)."], "solution": ["A — True: 'Some studies suggest' = some evidence; the wording is as cautious as the passage.", "B — Cannot say: <em>Guarantees<\/em> is far stronger than <em>may<\/em>.", "C — False: Researchers say <em>more evidence is needed<\/em> — they have not reached agreement.", "D — Cannot say: The passage says paper vs screen <em>might<\/em> make a difference; <em>always disturbs<\/em> is extreme.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L3-004", "module": "verbal", "level": "L3", "concept": "near-synonyms", "difficulty": 3, "kind": "practice", "answer": 3, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The government has proposed lowering the speed limit on motorways from 130 to 120 km/h. The measure will be debated in parliament next month.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The speed limit on motorways has been lowered to 120 km/h.", "explanation": "<p><strong>False.<\/strong> It has been <em>proposed<\/em>, not done.<\/p>"}, {"text": "Parliament has rejected the lower speed limit.", "explanation": "<p><strong>False.<\/strong> The debate is <em>next month<\/em>; no decision has been taken.<\/p>"}, {"text": "The speed limit will be reduced by 10%.", "explanation": "<p><strong>False.<\/strong> From 130 to 120 is about 7.7%, not 10% — and the reduction isn't certain.<\/p>"}, {"text": "A lower motorway speed limit is under consideration.", "explanation": "<p><strong>True.<\/strong> Proposed and due for debate = under consideration.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "<em>Proposed<\/em> is not the same as <em>lowered<\/em>."], "solution": ["A — False: It has been <em>proposed<\/em>, not done.", "B — False: The debate is <em>next month<\/em>; no decision has been taken.", "C — False: From 130 to 120 is about 7.7%, not 10% — and the reduction isn't certain.", "D — True: Proposed and due for debate = under consideration.", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L3-005", "module": "verbal", "level": "L3", "concept": "near-synonyms", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Visitor numbers at the national park increased from 400,000 in 2019 to 520,000 in 2023. The park authority has started building a new visitor centre, which is due to open in 2026.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The new visitor centre is under construction.", "explanation": "<p><strong>True.<\/strong> 'Has started building' = under construction.<\/p>"}, {"text": "Visitor numbers doubled between 2019 and 2023.", "explanation": "<p><strong>False.<\/strong> 400,000 → 520,000 is a 30% increase, not doubling.<\/p>"}, {"text": "The new visitor centre opened in 2023.", "explanation": "<p><strong>False.<\/strong> It is due to open in 2026.<\/p>"}, {"text": "Visitor numbers have increased every year since 2019.", "explanation": "<p><strong>Cannot say.<\/strong> We only know the numbers for 2019 and 2023, not the years in between.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Compare <em>increased<\/em> with <em>doubled<\/em>, and <em>has started building<\/em> with <em>opened<\/em>."], "solution": ["A — True: 'Has started building' = under construction.", "B — False: 400,000 → 520,000 is a 30% increase, not doubling.", "C — False: It is due to open in 2026.", "D — Cannot say: We only know the numbers for 2019 and 2023, not the years in between.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L3-006", "module": "verbal", "level": "L3", "concept": "partial-truth", "difficulty": 3, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>In 2021 the company switched all its delivery vans to electric models. Its fuel costs fell sharply in the following year, while maintenance costs stayed roughly the same.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The company switched to electric vans in 2021, which caused its maintenance costs to fall.", "explanation": "<p><strong>False.<\/strong> First half right, second half wrong: maintenance costs <em>stayed roughly the same<\/em>.<\/p>"}, {"text": "After the company switched to electric vans, its fuel costs fell sharply.", "explanation": "<p><strong>True.<\/strong> The passage gives this order of events: switch in 2021, fuel costs fell the following year.<\/p>"}, {"text": "The switch to electric vans was made to cut fuel costs.", "explanation": "<p><strong>Cannot say.<\/strong> The passage doesn't give the company's reason.<\/p>"}, {"text": "The company's fuel costs fell because electricity prices dropped.", "explanation": "<p><strong>Cannot say.<\/strong> Electricity prices are not mentioned.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Check each half of each statement separately."], "solution": ["A — False: First half right, second half wrong: maintenance costs <em>stayed roughly the same<\/em>.", "B — True: The passage gives this order of events: switch in 2021, fuel costs fell the following year.", "C — Cannot say: The passage doesn't give the company's reason.", "D — Cannot say: Electricity prices are not mentioned.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L4-001", "module": "verbal", "level": "L4", "concept": "options-first", "difficulty": 3, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The city's new night bus network started in September. Six routes now run between midnight and 5:00 on Fridays and Saturdays, linking the centre with the main residential districts. Tickets cost the same as during the day, and monthly passes are valid. In the first two months, the night buses carried an average of 3,000 passengers per night. The transport authority will decide in the spring whether to extend the service to weekdays.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Night buses run every night of the week.", "explanation": "<p><strong>False.<\/strong> Only on Fridays and Saturdays.<\/p>"}, {"text": "Monthly pass holders do not need a separate ticket for night buses.", "explanation": "<p><strong>True.<\/strong> 'Monthly passes are valid.'<\/p>"}, {"text": "Night bus tickets are more expensive than daytime tickets.", "explanation": "<p><strong>False.<\/strong> They cost the same.<\/p>"}, {"text": "The night buses will run on weekdays from spring.", "explanation": "<p><strong>Cannot say.<\/strong> Only a <em>decision<\/em> is expected in spring.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Skim the four statements first: their key words are <em>every night<\/em>, <em>monthly pass<\/em>, <em>price<\/em>, <em>weekdays<\/em>."], "solution": ["A — False: Only on Fridays and Saturdays.", "B — True: 'Monthly passes are valid.'", "C — False: They cost the same.", "D — Cannot say: Only a <em>decision<\/em> is expected in spring.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L4-002", "module": "verbal", "level": "L4", "concept": "options-first", "difficulty": 3, "kind": "practice", "answer": 3, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>A pilot programme offered 200 unemployed young people six months of paid training in digital skills. Of those who completed the programme, 70% found a job within a year. However, 40 participants dropped out before the end, mostly for personal reasons. The organisers plan to repeat the programme with more places next year.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "70% of the 200 participants found a job within a year.", "explanation": "<p><strong>False.<\/strong> 70% of those who <em>completed<\/em> — not of all 200.<\/p>"}, {"text": "Most participants who left early found the training too difficult.", "explanation": "<p><strong>False.<\/strong> They left <em>mostly for personal reasons<\/em>.<\/p>"}, {"text": "The programme will be repeated with the same number of places.", "explanation": "<p><strong>False.<\/strong> With <em>more<\/em> places.<\/p>"}, {"text": "160 participants completed the programme.", "explanation": "<p><strong>True.<\/strong> 200 started and 40 dropped out: 200 − 40 = 160.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Check the base of the 70%: all participants, or only those who completed?"], "solution": ["A — False: 70% of those who <em>completed<\/em> — not of all 200.", "B — False: They left <em>mostly for personal reasons<\/em>.", "C — False: With <em>more<\/em> places.", "D — True: 200 started and 40 dropped out: 200 − 40 = 160.", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L4-003", "module": "verbal", "level": "L4", "concept": "verbal-elimination", "difficulty": 3, "kind": "practice", "answer": 2, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The European Year of Skills ran from May 2023 to May 2024. Its aim was to promote training and to help people gain the skills needed in the labour market, with particular attention to digital and green skills.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The European Year of Skills ran from January to December 2023.", "explanation": "<p><strong>False.<\/strong> It ran from May 2023 to May 2024.<\/p>"}, {"text": "Digital skills were the only focus of the European Year of Skills.", "explanation": "<p><strong>False.<\/strong> <em>Only<\/em> is wrong: green skills and training in general were also covered.<\/p>"}, {"text": "Promoting training was one of the aims of the European Year of Skills.", "explanation": "<p><strong>True.<\/strong> 'Its aim was to promote training…'<\/p>"}, {"text": "The European Year of Skills was the first European Year ever held.", "explanation": "<p><strong>Cannot say.<\/strong> The passage says nothing about earlier European Years.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Give each statement a one-word reason: wrong dates? <em>only<\/em>? not mentioned?"], "solution": ["A — False: It ran from May 2023 to May 2024.", "B — False: <em>Only<\/em> is wrong: green skills and training in general were also covered.", "C — True: 'Its aim was to promote training…'", "D — Cannot say: The passage says nothing about earlier European Years.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L4-004", "module": "verbal", "level": "L4", "concept": "verbal-elimination", "difficulty": 3, "kind": "practice", "answer": 3, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Seasonal flu vaccines are updated every year because the viruses change. Health authorities recommend the vaccine in particular for people over 65, pregnant women and health workers. Vaccination is usually offered in autumn, before the flu season peaks.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The same flu vaccine is used every year.", "explanation": "<p><strong>False.<\/strong> Vaccines are <em>updated every year<\/em>.<\/p>"}, {"text": "Only people over 65 are advised to get the vaccine.", "explanation": "<p><strong>False.<\/strong> Pregnant women and health workers are also mentioned — <em>only<\/em> is wrong.<\/p>"}, {"text": "Flu season usually peaks before autumn.", "explanation": "<p><strong>False.<\/strong> Vaccination is offered in autumn <em>before<\/em> the season peaks, so the peak comes later.<\/p>"}, {"text": "Health workers are among the groups for whom the vaccine is particularly recommended.", "explanation": "<p><strong>True.<\/strong> They are named in the second sentence.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Eliminate the three statements that contradict the text — what is left?"], "solution": ["A — False: Vaccines are <em>updated every year<\/em>.", "B — False: Pregnant women and health workers are also mentioned — <em>only<\/em> is wrong.", "C — False: Vaccination is offered in autumn <em>before<\/em> the season peaks, so the peak comes later.", "D — True: They are named in the second sentence.", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L5-001", "module": "verbal", "level": "L5", "concept": "verbal-exam-strategy", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p58", "note": "time management"}, "stem": "<p>In the verbal test (20 questions in 35 minutes — TO VERIFY), you are starting <strong>question 7<\/strong> after <strong>15 minutes<\/strong>. What is the best reading of the situation?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "You are a few minutes behind the 1 min 45 s pace — speed up slightly and apply the 2-minute rule strictly.", "explanation": "<p><strong>Correct.<\/strong> At 1 min 45 s per question, 6 questions should take about 10.5 minutes; you have used 15, so you are about 4–5 minutes behind. Not a disaster — tighten up and don't let one question hold you.<\/p>"}, {"text": "You are exactly on schedule.", "explanation": "<p><strong>Not quite.<\/strong> On schedule would be starting question 7 after about 10.5 minutes.<\/p>"}, {"text": "You are ahead of schedule.", "explanation": "<p><strong>No.<\/strong> After 15 minutes you should be around question 9.<\/p>"}, {"text": "You should guess all remaining questions to save time.", "explanation": "<p><strong>Too drastic.<\/strong> You still have 20 minutes for 14 questions — enough for careful work if you keep a steady pace.<\/p>"}], "hints": ["Pace: 35 minutes ÷ 20 questions ≈ 1 min 45 s.", "6 questions done × 1.75 min = ?"], "solution": ["Expected time for 6 questions: 6 × 1.75 = 10.5 minutes.", "Actual: 15 minutes → about 4.5 minutes behind.", "So: speed up a little, use the 2-minute rule, keep going calmly."]}, {"id": "ver-L5-E01", "module": "verbal", "level": "L5", "concept": "scope-shift", "difficulty": 3, "kind": "exam", "answer": 2, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Pollinating insects such as bees, hoverflies and butterflies play a central role in food production: a large share of the crops grown for human consumption depend, at least in part, on animal pollination. In recent decades, however, many wild pollinator species have declined. Scientists point to several causes acting together, including the loss of flower-rich habitats, the use of certain pesticides, disease and changes in climate. Managed honeybee colonies, which beekeepers can move and replace, are sometimes presented as a solution, but researchers warn that they cannot fully replace wild species. Different insects visit different flowers, and some crops are pollinated far more effectively by wild bees than by honeybees.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Honeybees are the most effective pollinators of all crops.", "explanation": "<p><strong>False.<\/strong> Some crops are pollinated far more effectively by <em>wild<\/em> bees.<\/p>"}, {"text": "Pesticides are the main cause of the decline in wild pollinators.", "explanation": "<p><strong>Cannot say.<\/strong> Pesticides are one of <em>several causes acting together<\/em>; no main cause is named.<\/p>"}, {"text": "According to researchers, managed honeybees cannot completely take the place of wild pollinators.", "explanation": "<p><strong>True.<\/strong> 'They cannot fully replace wild species.'<\/p>"}, {"text": "All food crops depend on animal pollination.", "explanation": "<p><strong>False.<\/strong> A <em>large share<\/em> depend on it, <em>at least in part<\/em> — not all.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Look at the sentence that starts 'Managed honeybee colonies…'."], "solution": ["A — False: Some crops are pollinated far more effectively by <em>wild<\/em> bees.", "B — Cannot say: Pesticides are one of <em>several causes acting together<\/em>; no main cause is named.", "C — True: 'They cannot fully replace wild species.'", "D — False: A <em>large share<\/em> depend on it, <em>at least in part<\/em> — not all.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L5-E02", "module": "verbal", "level": "L5", "concept": "near-synonyms", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>After years of decline, overnight train services have returned to several European routes. Rail companies have reopened connections that had been closed because they were losing money, and new private operators have entered the market. Supporters argue that night trains offer a lower-carbon alternative to short-haul flights, since passengers travel while they sleep and arrive in the city centre in the morning. Critics point out that night services remain expensive to run: carriages with beds carry fewer passengers than seated ones, and trains often wait in depots during the day. Ticket prices can therefore be higher than for low-cost flights on the same route. Whether demand will be strong enough to keep the new services running without public support is still an open question.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Some night train connections that had been closed have since been reopened.", "explanation": "<p><strong>True.<\/strong> 'Rail companies have reopened connections that had been closed…'<\/p>"}, {"text": "Night trains are always cheaper than flying on the same route.", "explanation": "<p><strong>False.<\/strong> Tickets <em>can be higher<\/em> than low-cost flights.<\/p>"}, {"text": "Private operators run most night train services in Europe.", "explanation": "<p><strong>Cannot say.<\/strong> New private operators have entered the market, but no share is given.<\/p>"}, {"text": "The new night services no longer need public support.", "explanation": "<p><strong>Cannot say.<\/strong> This is described as <em>still an open question<\/em>.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement repeats the second sentence in other words?"], "solution": ["A — True: 'Rail companies have reopened connections that had been closed…'", "B — False: Tickets <em>can be higher<\/em> than low-cost flights.", "C — Cannot say: New private operators have entered the market, but no share is given.", "D — Cannot say: This is described as <em>still an open question<\/em>.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L5-E03", "module": "verbal", "level": "L5", "concept": "extreme-wording", "difficulty": 3, "kind": "exam", "answer": 3, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>For centuries, lighthouses were operated by keepers who lived on site, often with their families, and kept the lamps burning through the night. During the twentieth century, improvements in electric lighting and remote monitoring allowed authorities to automate most lighthouses, and the last keepers in many countries left their posts. Today, ships rely mainly on satellite navigation, but lighthouses have not disappeared: they still serve as a visual back-up if electronic systems fail and help sailors confirm their position near the coast. A number of former keepers' houses have been turned into museums or holiday accommodation, which helps pay for the maintenance of the buildings.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Lighthouses are no longer used now that ships have satellite navigation.", "explanation": "<p><strong>False.<\/strong> They still serve as a visual back-up and help sailors near the coast.<\/p>"}, {"text": "Lighthouse keepers always lived with their families.", "explanation": "<p><strong>False.<\/strong> <em>Often<\/em> with their families — not always.<\/p>"}, {"text": "All lighthouses were automated before the year 2000.", "explanation": "<p><strong>Cannot say.<\/strong> <em>Most<\/em> were automated during the twentieth century; <em>all<\/em> is not supported.<\/p>"}, {"text": "Income from new uses of former keepers' houses helps to maintain some lighthouse buildings.", "explanation": "<p><strong>True.<\/strong> Museums and holiday accommodation 'help pay for the maintenance of the buildings'.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Watch the qualifiers: <em>often<\/em>, <em>most<\/em>, <em>a number of<\/em>."], "solution": ["A — False: They still serve as a visual back-up and help sailors near the coast.", "B — False: <em>Often<\/em> with their families — not always.", "C — Cannot say: <em>Most<\/em> were automated during the twentieth century; <em>all<\/em> is not supported.", "D — True: Museums and holiday accommodation 'help pay for the maintenance of the buildings'.", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L5-E04", "module": "verbal", "level": "L5", "concept": "extreme-wording", "difficulty": 3, "kind": "exam", "answer": 1, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>City trees do more than make streets look attractive. Through shade and the evaporation of water from their leaves, they can lower local air temperatures on hot days, which matters as heatwaves become more frequent. Studies in several European cities have found that streets with a dense tree canopy can be several degrees cooler than nearby streets without trees. Trees also absorb rainwater, reducing the pressure on drainage systems during heavy storms. However, planting alone is not enough: young trees need regular watering in their first years, and many die early when this care is not provided. Some cities have therefore started to budget for maintenance at the same time as they plan new planting.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Planting trees always lowers city temperatures by several degrees.", "explanation": "<p><strong>False.<\/strong> Streets with a <em>dense canopy<\/em> <em>can<\/em> be several degrees cooler; <em>always<\/em> is too strong and the passage says planting alone is not enough.<\/p>"}, {"text": "Without regular watering, many young city trees die early.", "explanation": "<p><strong>True.<\/strong> 'Many die early when this care is not provided.'<\/p>"}, {"text": "Heatwaves are caused by a lack of trees in cities.", "explanation": "<p><strong>Cannot say.<\/strong> The passage doesn't discuss what causes heatwaves.<\/p>"}, {"text": "All European cities now include maintenance in their tree-planting budgets.", "explanation": "<p><strong>Cannot say.<\/strong> Only <em>some<\/em> cities have started doing this.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Find the sentence about young trees."], "solution": ["A — False: Streets with a <em>dense canopy<\/em> <em>can<\/em> be several degrees cooler; <em>always<\/em> is too strong and the passage says planting alone is not enough.", "B — True: 'Many die early when this care is not provided.'", "C — Cannot say: The passage doesn't discuss what causes heatwaves.", "D — Cannot say: Only <em>some<\/em> cities have started doing this.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L5-E05", "module": "verbal", "level": "L5", "concept": "partial-truth", "difficulty": 3, "kind": "exam", "answer": 2, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Sleep is not only a period of rest for the brain. Research suggests that, during certain stages of sleep, the brain replays and strengthens information learned during the day, a process known as memory consolidation. In experiments, people who slept after learning a list of words tended to remember more of them the next day than people who stayed awake for the same number of hours. Researchers caution, however, that most studies have been carried out in laboratories with small groups of young adults, and it is not yet clear how far the results apply to everyday learning. Even so, many sleep specialists advise students not to sacrifice sleep before an exam.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Sleeping after learning guarantees that information will be remembered.", "explanation": "<p><strong>Cannot say.<\/strong> People who slept <em>tended<\/em> to remember more; nothing is guaranteed.<\/p>"}, {"text": "The experiments described were carried out with large groups of people of all ages.", "explanation": "<p><strong>False.<\/strong> Mostly <em>small groups of young adults<\/em>.<\/p>"}, {"text": "In the experiments, people who slept after learning tended to recall more words than those who stayed awake.", "explanation": "<p><strong>True.<\/strong> This restates the third sentence.<\/p>"}, {"text": "Memory consolidation happens during every stage of sleep.", "explanation": "<p><strong>Cannot say.<\/strong> The passage says <em>certain<\/em> stages.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Check the sentence about the experiments: who remembered more?"], "solution": ["A — Cannot say: People who slept <em>tended<\/em> to remember more; nothing is guaranteed.", "B — False: Mostly <em>small groups of young adults<\/em>.", "C — True: This restates the third sentence.", "D — Cannot say: The passage says <em>certain<\/em> stages.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L5-E06", "module": "verbal", "level": "L5", "concept": "partial-truth", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Microplastics — plastic particles smaller than five millimetres — have been found in rivers, lakes and seas across Europe. Some are produced deliberately, for example as small beads in certain cosmetic products, while many more form when larger plastic items break down. Washing synthetic clothes and the wear of car tyres are also known sources. Because the particles are so small, they are difficult to remove once they have entered the water. Wastewater treatment plants can capture a large share of them, but the captured particles end up in sewage sludge, which in some countries is spread on farmland. Researchers are still studying how microplastics affect human health.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Car tyres are one of the known sources of microplastics.", "explanation": "<p><strong>True.<\/strong> '…the wear of car tyres are also known sources.'<\/p>"}, {"text": "Most microplastics are produced deliberately for cosmetics.", "explanation": "<p><strong>False.<\/strong> <em>Some<\/em> are produced deliberately; <em>many more<\/em> come from larger items breaking down.<\/p>"}, {"text": "Wastewater treatment plants remove all microplastics from water.", "explanation": "<p><strong>False.<\/strong> They capture <em>a large share<\/em> — not all.<\/p>"}, {"text": "Microplastics have been proven to harm human health.", "explanation": "<p><strong>Cannot say.<\/strong> Researchers are <em>still studying<\/em> the effects.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement lists a source the passage names?"], "solution": ["A — True: '…the wear of car tyres are also known sources.'", "B — False: <em>Some<\/em> are produced deliberately; <em>many more<\/em> come from larger items breaking down.", "C — False: They capture <em>a large share<\/em> — not all.", "D — Cannot say: Researchers are <em>still studying<\/em> the effects.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L5-E07", "module": "verbal", "level": "L5", "concept": "scope-shift", "difficulty": 3, "kind": "exam", "answer": 1, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Since 2020, many organisations have adopted hybrid working, with staff splitting their week between home and the office. As a result, some employers have reduced their office space, while others have redesigned it, replacing rows of personal desks with meeting rooms and shared work areas. Surveys show that most employees who are able to work from home would like to keep doing so for at least part of the week. Managers, however, often report concerns about team cohesion and the training of new staff. Office occupancy in large cities has risen since the pandemic years but in many places remains below its earlier level.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "All employers have reduced their office space since 2020.", "explanation": "<p><strong>False.<\/strong> <em>Some<\/em> reduced it, others redesigned it.<\/p>"}, {"text": "In many places, offices are still less occupied than before the pandemic.", "explanation": "<p><strong>True.<\/strong> Occupancy 'in many places remains below its earlier level'.<\/p>"}, {"text": "Managers prefer staff to work from home full time.", "explanation": "<p><strong>Cannot say.<\/strong> Managers report <em>concerns<\/em>; no preference for full-time home working is stated.<\/p>"}, {"text": "Office occupancy in large cities has kept falling since the pandemic.", "explanation": "<p><strong>False.<\/strong> It <em>has risen<\/em> since the pandemic years.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Read the last sentence carefully: risen, but still below…"], "solution": ["A — False: <em>Some<\/em> reduced it, others redesigned it.", "B — True: Occupancy 'in many places remains below its earlier level'.", "C — Cannot say: Managers report <em>concerns<\/em>; no preference for full-time home working is stated.", "D — False: It <em>has risen<\/em> since the pandemic years.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L5-E08", "module": "verbal", "level": "L5", "concept": "near-synonyms", "difficulty": 3, "kind": "exam", "answer": 3, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Coffee is grown in a band of tropical countries around the equator, and two species dominate world production. Arabica, generally considered to have a finer flavour, grows best at higher altitudes and is sensitive to heat and disease. Robusta is hardier and gives higher yields, but its taste is often described as more bitter; it is widely used in instant coffee and espresso blends. Climate studies suggest that, as temperatures rise, the area suitable for growing arabica could shrink considerably in the coming decades. Breeders are therefore working on new varieties that combine arabica's flavour with greater resistance to heat.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Robusta grows best at high altitudes.", "explanation": "<p><strong>False.<\/strong> That is said of <em>arabica<\/em>.<\/p>"}, {"text": "Arabica is used in all instant coffee.", "explanation": "<p><strong>Cannot say.<\/strong> <em>Robusta<\/em> is widely used in instant coffee; nothing says arabica is used in all of it.<\/p>"}, {"text": "The area suitable for growing arabica has already shrunk considerably.", "explanation": "<p><strong>Cannot say.<\/strong> It <em>could shrink<\/em> in the coming decades — a projection, not something that has happened.<\/p>"}, {"text": "Breeders are trying to develop coffee varieties that tolerate heat better.", "explanation": "<p><strong>True.<\/strong> '…new varieties that combine arabica's flavour with greater resistance to heat.'<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "<em>Could shrink in the coming decades<\/em> is not the same as <em>has shrunk<\/em>."], "solution": ["A — False: That is said of <em>arabica<\/em>.", "B — Cannot say: <em>Robusta<\/em> is widely used in instant coffee; nothing says arabica is used in all of it.", "C — Cannot say: It <em>could shrink<\/em> in the coming decades — a projection, not something that has happened.", "D — True: '…new varieties that combine arabica's flavour with greater resistance to heat.'", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L5-E09", "module": "verbal", "level": "L5", "concept": "extreme-wording", "difficulty": 3, "kind": "exam", "answer": 2, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Every winter, thousands of volunteers in several European countries spend an hour counting the birds that visit their gardens, balconies or local parks, and send their results to national conservation organisations. Because the same method is used each year, the data allow researchers to follow changes in common species over long periods. The counts have shown, for example, declines in some once-familiar birds and increases in others that have adapted well to towns. Organisers stress that the results are not a precise census: volunteers are not evenly spread across each country, and experienced and new participants identify birds with different accuracy. Even so, the large number of observations makes the trends useful.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The bird counts provide an exact census of all birds in each country.", "explanation": "<p><strong>False.<\/strong> Organisers say the results are <em>not a precise census<\/em>.<\/p>"}, {"text": "Volunteers count birds for a full day each winter.", "explanation": "<p><strong>False.<\/strong> They count for <em>an hour<\/em>.<\/p>"}, {"text": "The counts have recorded increases in some species that have adapted to towns.", "explanation": "<p><strong>True.<\/strong> '…increases in others that have adapted well to towns.'<\/p>"}, {"text": "Participants must be experienced birdwatchers.", "explanation": "<p><strong>False.<\/strong> The passage mentions <em>new<\/em> participants too.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement matches the examples in the third sentence?"], "solution": ["A — False: Organisers say the results are <em>not a precise census<\/em>.", "B — False: They count for <em>an hour<\/em>.", "C — True: '…increases in others that have adapted well to towns.'", "D — False: The passage mentions <em>new<\/em> participants too.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L5-E10", "module": "verbal", "level": "L5", "concept": "partial-truth", "difficulty": 3, "kind": "exam", "answer": 1, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Vertical farms grow vegetables indoors, in stacked layers under artificial light, often close to the cities where the food is eaten. Because conditions are controlled, they use far less water than open fields, need no pesticides against most pests, and can produce crops all year round. Their main weakness is energy: lighting and climate control make electricity one of the largest costs. When energy prices rose sharply in 2022, several vertical-farming companies in Europe ran into financial difficulties. Supporters argue that cheaper renewable electricity could change the picture, but for now the method is mainly used for high-value crops such as salad leaves and herbs rather than staple foods like wheat.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Vertical farms use more water than open-field farming.", "explanation": "<p><strong>False.<\/strong> They use <em>far less<\/em> water.<\/p>"}, {"text": "Electricity is among the largest costs of vertical farming.", "explanation": "<p><strong>True.<\/strong> '…make electricity one of the largest costs.'<\/p>"}, {"text": "Vertical farms are now widely used to grow wheat.", "explanation": "<p><strong>False.<\/strong> They are mainly used for salad leaves and herbs, <em>rather than<\/em> staples like wheat.<\/p>"}, {"text": "All European vertical-farming companies closed in 2022.", "explanation": "<p><strong>False.<\/strong> <em>Several<\/em> ran into financial difficulties — not all, and not necessarily closed.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Find the sentence about the 'main weakness'."], "solution": ["A — False: They use <em>far less<\/em> water.", "B — True: '…make electricity one of the largest costs.'", "C — False: They are mainly used for salad leaves and herbs, <em>rather than<\/em> staples like wheat.", "D — False: <em>Several<\/em> ran into financial difficulties — not all, and not necessarily closed.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L5-E11", "module": "verbal", "level": "L5", "concept": "outside-knowledge", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Institutions that work in many languages translate large volumes of documents, and much of the wording repeats from one text to the next. Translation memory software stores sentences that have already been translated, together with their approved translations. When a translator works on a new document, the software suggests earlier translations of identical or similar sentences, which the translator can accept, adapt or reject. This saves time and helps keep terminology consistent. The software does not decide on its own, however: the final responsibility for the quality of the text remains with the human translator, who must check that a suggested sentence fits the new context.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Translators remain responsible for the final quality of the text.", "explanation": "<p><strong>True.<\/strong> '…the final responsibility for the quality of the text remains with the human translator.'<\/p>"}, {"text": "Translation memory software translates new documents without human involvement.", "explanation": "<p><strong>False.<\/strong> It only <em>suggests<\/em> earlier translations; the translator decides.<\/p>"}, {"text": "Translation memory software was invented by the EU institutions.", "explanation": "<p><strong>Cannot say.<\/strong> The passage says nothing about who invented it.<\/p>"}, {"text": "Suggested translations must always be accepted unchanged.", "explanation": "<p><strong>False.<\/strong> The translator can <em>accept, adapt or reject<\/em> them.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Look at the last sentence."], "solution": ["A — True: '…the final responsibility for the quality of the text remains with the human translator.'", "B — False: It only <em>suggests<\/em> earlier translations; the translator decides.", "C — Cannot say: The passage says nothing about who invented it.", "D — False: The translator can <em>accept, adapt or reject<\/em> them.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L5-E12", "module": "verbal", "level": "L5", "concept": "near-synonyms", "difficulty": 3, "kind": "exam", "answer": 3, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>In parts of southern Europe, fire services have begun to use prescribed burning: small, carefully controlled fires set in cooler, damp months to reduce the amount of dry vegetation that could feed a large wildfire in summer. The technique has long been used in other parts of the world. Supporters say it lowers the risk of uncontrollable fires near villages and forests. It is not without risks, however. Burns must be planned for the right weather, and smoke can affect nearby residents. In some regions, the practice also faces legal restrictions, as many rules were written at a time when all fire in the countryside was seen as something to be prevented.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Prescribed burns are usually carried out in the middle of summer.", "explanation": "<p><strong>False.<\/strong> They are set in <em>cooler, damp months<\/em>.<\/p>"}, {"text": "Prescribed burning removes all risk of wildfires.", "explanation": "<p><strong>False.<\/strong> Supporters say it <em>lowers<\/em> the risk; it is also 'not without risks'.<\/p>"}, {"text": "Prescribed burning was first developed in southern Europe.", "explanation": "<p><strong>False.<\/strong> It 'has long been used in other parts of the world' — southern Europe only <em>began<\/em> to use it.<\/p>"}, {"text": "In some regions, existing rules limit the use of prescribed burning.", "explanation": "<p><strong>True.<\/strong> '…the practice also faces legal restrictions.'<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "<em>Lowers the risk<\/em> vs <em>removes all risk<\/em>; <em>has begun to use<\/em> vs <em>first developed<\/em>."], "solution": ["A — False: They are set in <em>cooler, damp months<\/em>.", "B — False: Supporters say it <em>lowers<\/em> the risk; it is also 'not without risks'.", "C — False: It 'has long been used in other parts of the world' — southern Europe only <em>began<\/em> to use it.", "D — True: '…the practice also faces legal restrictions.'", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L5-E13", "module": "verbal", "level": "L5", "concept": "outside-knowledge", "difficulty": 3, "kind": "exam", "answer": 2, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Tides rise and fall at times that can be predicted years in advance, which gives tidal energy an advantage over wind and solar power, whose output depends on the weather. Several countries with strong tidal currents have tested underwater turbines that turn as the water flows past them. So far, however, tidal energy produces only a very small share of Europe's electricity. Installing and maintaining equipment in fast-moving seawater is technically difficult and expensive, and projects must also take account of possible effects on fish and marine mammals. Developers hope that larger projects and better designs will bring costs down.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Tidal energy supplies a large share of Europe's electricity.", "explanation": "<p><strong>False.<\/strong> Only a <em>very small share<\/em>.<\/p>"}, {"text": "The output of tidal turbines depends on the weather.", "explanation": "<p><strong>False.<\/strong> That is said of wind and solar; tides are predictable.<\/p>"}, {"text": "Tidal energy output can be predicted well in advance.", "explanation": "<p><strong>True.<\/strong> Tides can be predicted <em>years in advance<\/em> — that is the advantage described.<\/p>"}, {"text": "Tidal turbines have been shown to harm marine mammals.", "explanation": "<p><strong>Cannot say.<\/strong> Projects must consider <em>possible<\/em> effects; no harm is reported as shown.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "What advantage does the first sentence give tidal energy?"], "solution": ["A — False: Only a <em>very small share<\/em>.", "B — False: That is said of wind and solar; tides are predictable.", "C — True: Tides can be predicted <em>years in advance<\/em> — that is the advantage described.", "D — Cannot say: Projects must consider <em>possible<\/em> effects; no harm is reported as shown.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L5-E14", "module": "verbal", "level": "L5", "concept": "extreme-wording", "difficulty": 3, "kind": "exam", "answer": 1, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>It is often said that adults cannot learn a new language as well as children. Research gives a more mixed picture. Children who start early and are surrounded by a language are more likely to reach a native-like accent. Adults, on the other hand, often make faster progress at the beginning, because they can use learning strategies and their knowledge of other languages. Motivation and the amount of practice appear to matter a great deal at any age. Researchers therefore advise adult learners not to be discouraged by their age, but to look for regular opportunities to use the language in real situations.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Adults cannot reach a good level in a new language.", "explanation": "<p><strong>False.<\/strong> The passage presents this as a common belief that research does not support.<\/p>"}, {"text": "Adults often progress faster than children in the early stages of learning a language.", "explanation": "<p><strong>True.<\/strong> 'Adults… often make faster progress at the beginning.'<\/p>"}, {"text": "Children always learn languages faster than adults.", "explanation": "<p><strong>False.<\/strong> Adults often progress faster at the beginning.<\/p>"}, {"text": "A native-like accent is impossible for adult learners.", "explanation": "<p><strong>Cannot say.<\/strong> Children are <em>more likely<\/em> to reach one; nothing says it's impossible for adults.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Find the sentence starting 'Adults, on the other hand…'."], "solution": ["A — False: The passage presents this as a common belief that research does not support.", "B — True: 'Adults… often make faster progress at the beginning.'", "C — False: Adults often progress faster at the beginning.", "D — Cannot say: Children are <em>more likely<\/em> to reach one; nothing says it's impossible for adults.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L5-E15", "module": "verbal", "level": "L5", "concept": "partial-truth", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>When a mid-sized city built a network of protected cycle lanes, separated from car traffic by kerbs or planters, the number of people cycling to work rose noticeably within three years. Surveys found that many new cyclists had previously felt that cycling in traffic was too dangerous. Not everyone welcomed the change: some drivers complained about the loss of road space, and several shops on one busy street reported fewer customers arriving by car. City officials point out that, overall, the number of visitors to the city centre stayed stable, and they plan to extend the network to the suburbs.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Some of the people who started cycling had earlier considered it too dangerous to cycle in traffic.", "explanation": "<p><strong>True.<\/strong> 'Many new cyclists had previously felt that cycling in traffic was too dangerous.'<\/p>"}, {"text": "The number of visitors to the city centre fell after the cycle lanes were built.", "explanation": "<p><strong>False.<\/strong> Overall it <em>stayed stable<\/em>.<\/p>"}, {"text": "All shops in the city reported fewer customers.", "explanation": "<p><strong>False.<\/strong> <em>Several shops on one busy street<\/em> reported fewer customers <em>arriving by car<\/em>.<\/p>"}, {"text": "The cycle network already reaches the suburbs.", "explanation": "<p><strong>False.<\/strong> The city <em>plans<\/em> to extend it there.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Look at the survey sentence."], "solution": ["A — True: 'Many new cyclists had previously felt that cycling in traffic was too dangerous.'", "B — False: Overall it <em>stayed stable<\/em>.", "C — False: <em>Several shops on one busy street<\/em> reported fewer customers <em>arriving by car<\/em>.", "D — False: The city <em>plans<\/em> to extend it there.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L5-E16", "module": "verbal", "level": "L5", "concept": "near-synonyms", "difficulty": 3, "kind": "exam", "answer": 3, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>A large share of the food wasted in Europe is thrown away not in shops or restaurants but in private homes. Studies of household waste show that bread, fresh fruit and vegetables, and leftovers are among the items most often discarded. Confusion about date labels plays a part: 'use by' dates concern safety, while 'best before' dates indicate quality, and food is often still safe to eat after its 'best before' date. Public campaigns therefore encourage people to plan meals, store food correctly and check whether food is still good before throwing it away. Some supermarkets have also removed 'best before' dates from certain fresh products.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Most food waste in Europe comes from restaurants.", "explanation": "<p><strong>False.<\/strong> A large share is wasted <em>in private homes<\/em>, not in shops or restaurants.<\/p>"}, {"text": "Food must always be thrown away after its 'best before' date.", "explanation": "<p><strong>False.<\/strong> Food is <em>often still safe<\/em> after that date.<\/p>"}, {"text": "All supermarkets have removed date labels from fresh products.", "explanation": "<p><strong>False.<\/strong> <em>Some<\/em> supermarkets removed 'best before' dates from <em>certain<\/em> products.<\/p>"}, {"text": "A 'use by' date relates to safety, while a 'best before' date relates to quality.", "explanation": "<p><strong>True.<\/strong> Stated in the third sentence.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Find the sentence about date labels."], "solution": ["A — False: A large share is wasted <em>in private homes<\/em>, not in shops or restaurants.", "B — False: Food is <em>often still safe<\/em> after that date.", "C — False: <em>Some<\/em> supermarkets removed 'best before' dates from <em>certain<\/em> products.", "D — True: Stated in the third sentence.", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L5-E17", "module": "verbal", "level": "L5", "concept": "scope-shift", "difficulty": 3, "kind": "exam", "answer": 1, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Glaciers in the Alps have been losing ice for more than a century, and the pace has increased in recent decades. Hot summers with little snowfall cause particularly heavy losses, because fresh snow protects the ice beneath it from the sun. Melting glaciers change the landscape and can create new lakes, some of which pose a risk of sudden flooding. They also affect water supplies: in dry, hot summers, meltwater helps keep rivers flowing. Scientists expect that many smaller Alpine glaciers will disappear completely during this century, even if emissions are reduced.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Alpine glaciers started losing ice only in recent decades.", "explanation": "<p><strong>False.<\/strong> They have been losing ice for <em>more than a century<\/em>; only the <em>pace<\/em> increased recently.<\/p>"}, {"text": "Fresh snow helps to protect glacier ice from the sun.", "explanation": "<p><strong>True.<\/strong> '…fresh snow protects the ice beneath it from the sun.'<\/p>"}, {"text": "All new lakes created by melting glaciers are dangerous.", "explanation": "<p><strong>False.<\/strong> <em>Some<\/em> of them pose a risk.<\/p>"}, {"text": "Reducing emissions will save all Alpine glaciers.", "explanation": "<p><strong>False.<\/strong> Many smaller glaciers are expected to disappear <em>even if<\/em> emissions are reduced.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Why do hot summers with little snow cause heavy losses?"], "solution": ["A — False: They have been losing ice for <em>more than a century<\/em>; only the <em>pace<\/em> increased recently.", "B — True: '…fresh snow protects the ice beneath it from the sun.'", "C — False: <em>Some<\/em> of them pose a risk.", "D — False: Many smaller glaciers are expected to disappear <em>even if<\/em> emissions are reduced.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L5-E18", "module": "verbal", "level": "L5", "concept": "scope-shift", "difficulty": 3, "kind": "exam", "answer": 2, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Before proposing new laws, public authorities often hold consultations in which citizens, companies and organisations can give their views online. Supporters say this makes decision-making more open and can bring useful expertise to light. Critics note that the people who respond are not always representative of the population: organised groups may send large numbers of similar answers, while many citizens are unaware that the consultation exists. Authorities therefore usually state that they analyse the arguments made rather than counting responses like votes. Results are generally published, together with an explanation of how they were taken into account.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Consultation responses are counted like votes to decide new laws.", "explanation": "<p><strong>False.<\/strong> Authorities analyse the arguments <em>rather than counting responses like votes<\/em>.<\/p>"}, {"text": "Most citizens take part in public consultations.", "explanation": "<p><strong>Cannot say.<\/strong> Many citizens are <em>unaware<\/em> of consultations; no participation rate is given.<\/p>"}, {"text": "Authorities generally publish the results of consultations.", "explanation": "<p><strong>True.<\/strong> 'Results are generally published…'<\/p>"}, {"text": "Only organisations may respond to public consultations.", "explanation": "<p><strong>False.<\/strong> Citizens, companies and organisations can all respond.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Look at the last sentence."], "solution": ["A — False: Authorities analyse the arguments <em>rather than counting responses like votes<\/em>.", "B — Cannot say: Many citizens are <em>unaware<\/em> of consultations; no participation rate is given.", "C — True: 'Results are generally published…'", "D — False: Citizens, companies and organisations can all respond.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L5-E19", "module": "verbal", "level": "L5", "concept": "inference", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Heat pumps warm buildings by moving heat from the outside air, the ground or water into the building, using electricity to run the process. Because they move heat rather than generate it by burning fuel, they can deliver several units of heat for every unit of electricity they use. Sales have grown strongly in several European countries in recent years, supported by public subsidies. However, their efficiency is lower in very cold weather, and installation costs are higher than for a traditional gas boiler. Well-insulated buildings get the most benefit, which is why renovation programmes often combine insulation with heat-pump installation.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "A heat pump can deliver more heat than the amount of electricity it consumes.", "explanation": "<p><strong>True.<\/strong> 'Several units of heat for every unit of electricity.'<\/p>"}, {"text": "Heat pumps work by burning fuel.", "explanation": "<p><strong>False.<\/strong> They <em>move<\/em> heat rather than burning fuel.<\/p>"}, {"text": "Heat pumps are cheaper to install than gas boilers.", "explanation": "<p><strong>False.<\/strong> Installation costs are <em>higher<\/em> than for a gas boiler.<\/p>"}, {"text": "Heat pumps are equally efficient at all outdoor temperatures.", "explanation": "<p><strong>False.<\/strong> Efficiency is <em>lower in very cold weather<\/em>.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "What does 'several units of heat for every unit of electricity' imply?"], "solution": ["A — True: 'Several units of heat for every unit of electricity.'", "B — False: They <em>move<\/em> heat rather than burning fuel.", "C — False: Installation costs are <em>higher<\/em> than for a gas boiler.", "D — False: Efficiency is <em>lower in very cold weather<\/em>.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L5-E20", "module": "verbal", "level": "L5", "concept": "extreme-wording", "difficulty": 3, "kind": "exam", "answer": 3, "time_s": 105, "source": {"short": "baneth2023", "loc": "p61", "note": "style of the verbal reasoning test questions"}, "stem": "<blockquote>\n<p>Several national museums have experimented with free admission on the first Sunday of each month. Visitor numbers on those days typically rise sharply, and surveys show that the free Sundays attract a higher proportion of families and first-time visitors than ordinary days. Museum directors note some disadvantages: galleries can become crowded, and the lost ticket income must be covered from other sources. Some museums have therefore limited free entry to certain months or introduced a booking system for free days. Overall, most of the museums involved have decided to continue the scheme.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Free Sundays attract only families.", "explanation": "<p><strong>False.<\/strong> They attract a <em>higher proportion<\/em> of families and first-time visitors — not only families.<\/p>"}, {"text": "Museums lose no income on free days.", "explanation": "<p><strong>False.<\/strong> Lost ticket income 'must be covered from other sources'.<\/p>"}, {"text": "All the museums involved stopped the scheme because of crowding.", "explanation": "<p><strong>False.<\/strong> <em>Most<\/em> decided to continue it.<\/p>"}, {"text": "Most of the museums taking part have chosen to keep the free-entry scheme.", "explanation": "<p><strong>True.<\/strong> 'Overall, most of the museums involved have decided to continue the scheme.'<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Read the last sentence."], "solution": ["A — False: They attract a <em>higher proportion<\/em> of families and first-time visitors — not only families.", "B — False: Lost ticket income 'must be covered from other sources'.", "C — False: <em>Most<\/em> decided to continue it.", "D — True: 'Overall, most of the museums involved have decided to continue the scheme.'", "Only <strong>D<\/strong> is supported by the passage."]}], "glossary": {"alternation": {"term": "Alternation", "definition": "A change that switches back and forth or follows a rhythm — white, black, white… or 1 step, 2 steps, 1 step…", "example": "", "introduced": "abstract/L3"}, "assumption": {"term": "Assumption", "definition": "Something that might be true but needs information the passage doesn't give. Never a correct answer.", "example": "", "introduced": "verbal/L2"}, "average": {"term": "Average (mean)", "definition": "The total of the values divided by how many values there are.", "example": "(12 + 15 + 9 + 14) ÷ 4 = 12.5.", "introduced": "numerical/L2"}, "axis": {"term": "Axis (plural axes)", "definition": "The reference lines of a chart with the scale and its unit — horizontal (often years or categories) and vertical (often the amounts).", "example": "", "introduced": "numerical/L2"}, "bar-chart": {"term": "Bar chart", "definition": "A chart that compares amounts with bars — the longer the bar, the bigger the amount.", "example": "", "introduced": "numerical/L2"}, "base": {"term": "Base (of a percentage)", "definition": "The amount a percentage is calculated from — \"the whole\" in \"x% of the whole\".", "example": "In '12% of the adults', the base is the number of adults.", "introduced": "numerical/L1"}, "cannot-say": {"term": "Cannot say", "definition": "A statement that the passage neither confirms nor contradicts, because it doesn't give enough information. In EPSO verbal tests it is always a wrong answer.", "example": "Passage: 'Most members agreed.' Statement: 'All members agreed.' → cannot say.", "introduced": "verbal/L0"}, "checklist": {"term": "Feature checklist", "definition": "The fixed order in which you check every abstract figure: position, direction, number, colour, shape, size.", "example": "", "introduced": "abstract/L4"}, "clockwise": {"term": "Clockwise / anti
