caption><thead><tr><th scope='col'><\/th><th scope='col'>Share<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Housing<\/th><td>35<\/td><\/tr><tr><th scope='row'>Food<\/th><td>20<\/td><\/tr><tr><th scope='row'>Transport<\/th><td>15<\/td><\/tr><tr><th scope='row'>Savings<\/th><td>10<\/td><\/tr><tr><th scope='row'>Other<\/th><td>20<\/td><\/tr><\/tbody><\/table><\/div><\/details><\/figure>", "figure": "", "options": [{"text": "€840", "explanation": "<p>Correct: food 20% + transport 15% = 35%; 35% of 2,400 = 840.<\/p>"}, {"text": "€35", "explanation": "<p>35 is the combined <strong>percentage<\/strong>. Apply it to the total: 2,400 × 0.35.<\/p>"}, {"text": "€480", "explanation": "<p>That's food only (20%). Add transport's 15%.<\/p>"}, {"text": "€360", "explanation": "<p>That's transport only (15%). Add food's 20%.<\/p>"}], "hints": ["Add the two shares first: food + transport.", "Then take that percentage of €2,400."], "solution": ["Food 20% + transport 15% = 35%.", "35% of €2,400 = 2,400 × 0.35 = <strong>€840<\/strong>."]}, {"id": "num-L2-015", "module": "numerical", "level": "L2", "concept": "table-reading", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 90, "source": {"short": "franco1", "loc": "p7", "note": "five-step method"}, "stem": "<p>By approximately what <strong>percentage<\/strong> did visitors to the <strong>Hill Gallery<\/strong> increase from <strong>2022 to 2023<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Visitors to three museums <span class=\"unit\">(in thousands)<\/span><\/caption><thead><tr><th scope='col'>Museum<\/th><th scope='col'>2021<\/th><th scope='col'>2022<\/th><th scope='col'>2023<\/th><\/tr><\/thead><tbody><tr><th scope='row'>City Art Museum<\/th><td>520<\/td><td>610<\/td><td>655<\/td><\/tr><tr><th scope='row'>Riverside Museum<\/th><td>300<\/td><td>386<\/td><td>412<\/td><\/tr><tr><th scope='row'>Hill Gallery<\/th><td>145<\/td><td>172<\/td><td>230<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "about 34%", "explanation": "<p>Correct: change 230 − 172 = 58; 58 ÷ 172 ≈ 0.337 → about 34%. (The unit 'thousands' cancels out in a percentage.)<\/p>"}, {"text": "about 25%", "explanation": "<p>This divides by the <strong>new<\/strong> value (58 ÷ 230). Percentage change uses the old value, 172.<\/p>"}, {"text": "about 58%", "explanation": "<p>58 is the change in thousands of visitors, not a percentage.<\/p>"}, {"text": "about 59%", "explanation": "<p>This is 2021 → 2023 ((230 − 145) ÷ 145). Check the years.<\/p>"}], "hints": ["Two cells: Hill Gallery 2022 and 2023.", "Percentage change = change ÷ old value × 100."], "solution": ["2022 = 172, 2023 = 230 (thousands).", "Change = 58.", "58 ÷ 172 ≈ 0.337 → <strong>about 34%<\/strong>.", "Note: you don't need to convert to real visitors — the unit cancels in a percentage."]}, {"id": "num-L2-016", "module": "numerical", "level": "L2", "concept": "charts", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 90, "source": {"short": "baneth2023", "loc": "p136", "note": "line charts"}, "stem": "<p>By approximately what <strong>percentage<\/strong> did the average rent in <strong>City B<\/strong> rise between <strong>2019 and 2023<\/strong>?<\/p>", "table": "", "chart": "<figure class='chartfig'><figcaption>Average monthly rent<\/figcaption><div class='legend'><span><i class='sw s1'><\/i>City A<\/span><span><i class='sw s2'><\/i>City B<\/span><\/div><svg viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"Average monthly rent\" class=\"chart\"><line x1=\"60\" x2=\"540\" y1=\"250.0\" y2=\"250.0\" class=\"grid\"/><text x=\"52\" y=\"254.0\" class=\"tick\" text-anchor=\"end\">0<\/text><line x1=\"60\" x2=\"540\" y1=\"204.0\" y2=\"204.0\" class=\"grid\"/><text x=\"52\" y=\"208.0\" class=\"tick\" text-anchor=\"end\">240<\/text><line x1=\"60\" x2=\"540\" y1=\"158.0\" y2=\"158.0\" class=\"grid\"/><text x=\"52\" y=\"162.0\" class=\"tick\" text-anchor=\"end\">480<\/text><line x1=\"60\" x2=\"540\" y1=\"112.0\" y2=\"112.0\" class=\"grid\"/><text x=\"52\" y=\"116.0\" class=\"tick\" text-anchor=\"end\">720<\/text><line x1=\"60\" x2=\"540\" y1=\"66.0\" y2=\"66.0\" class=\"grid\"/><text x=\"52\" y=\"70.0\" class=\"tick\" text-anchor=\"end\">960<\/text><line x1=\"60\" x2=\"540\" y1=\"20.0\" y2=\"20.0\" class=\"grid\"/><text x=\"52\" y=\"24.0\" class=\"tick\" text-anchor=\"end\">1,200<\/text><polyline points=\"108.0,92.8 204.0,87.1 300.0,77.5 396.0,66.0 492.0,56.4\" class=\"ln s1\"/><circle cx=\"108.0\" cy=\"92.8\" r=\"4.5\" class=\"dot s1\"><title>City A, 2019: 820 €<\/title><\/circle><circle cx=\"204.0\" cy=\"87.1\" r=\"4.5\" class=\"dot s1\"><title>City A, 2020: 850 €<\/title><\/circle><circle cx=\"300.0\" cy=\"77.5\" r=\"4.5\" class=\"dot s1\"><title>City A, 2021: 900 €<\/title><\/circle><circle cx=\"396.0\" cy=\"66.0\" r=\"4.5\" class=\"dot s1\"><title>City A, 2022: 960 €<\/title><\/circle><circle cx=\"492.0\" cy=\"56.4\" r=\"4.5\" class=\"dot s1\"><title>City A, 2023: 1,010 €<\/title><\/circle><text x=\"500.0\" y=\"48.4\" class=\"lab\" text-anchor=\"end\">City A<\/text><polyline points=\"108.0,115.8 204.0,112.0 300.0,104.3 396.0,100.5 492.0,96.7\" class=\"ln s2\"/><circle cx=\"108.0\" cy=\"115.8\" r=\"4.5\" class=\"dot s2\"><title>City B, 2019: 700 €<\/title><\/circle><circle cx=\"204.0\" cy=\"112.0\" r=\"4.5\" class=\"dot s2\"><title>City B, 2020: 720 €<\/title><\/circle><circle cx=\"300.0\" cy=\"104.3\" r=\"4.5\" class=\"dot s2\"><title>City B, 2021: 760 €<\/title><\/circle><circle cx=\"396.0\" cy=\"100.5\" r=\"4.5\" class=\"dot s2\"><title>City B, 2022: 780 €<\/title><\/circle><circle cx=\"492.0\" cy=\"96.7\" r=\"4.5\" class=\"dot s2\"><title>City B, 2023: 800 €<\/title><\/circle><text x=\"500.0\" y=\"88.7\" class=\"lab\" text-anchor=\"end\">City B<\/text><line x1=\"60\" x2=\"540\" y1=\"250\" y2=\"250\" class=\"axis\"/><text x=\"108.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">2019<\/text><text x=\"204.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">2020<\/text><text x=\"300.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">2021<\/text><text x=\"396.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">2022<\/text><text x=\"492.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">2023<\/text><text x=\"60\" y=\"292\" class=\"tick\">€<\/text><\/svg><details class='astable'><summary>Show as table<\/summary><div class='dtable'><table><caption>Average monthly rent <span class=\"unit\">(€)<\/span><\/caption><thead><tr><th scope='col'><\/th><th scope='col'>City A<\/th><th scope='col'>City B<\/th><\/tr><\/thead><tbody><tr><th scope='row'>2019<\/th><td>820<\/td><td>700<\/td><\/tr><tr><th scope='row'>2020<\/th><td>850<\/td><td>720<\/td><\/tr><tr><th scope='row'>2021<\/th><td>900<\/td><td>760<\/td><\/tr><tr><th scope='row'>2022<\/th><td>960<\/td><td>780<\/td><\/tr><tr><th scope='row'>2023<\/th><td>1,010<\/td><td>800<\/td><\/tr><\/tbody><\/table><\/div><\/details><\/figure>", "figure": "", "options": [{"text": "about 14.3%", "explanation": "<p>Correct: 800 − 700 = 100; 100 ÷ 700 ≈ 0.143 → about 14.3%.<\/p>"}, {"text": "about 12.5%", "explanation": "<p>This divides by the 2023 value (100 ÷ 800). Use the starting year, 2019.<\/p>"}, {"text": "about 23.2%", "explanation": "<p>That's City <strong>A<\/strong> ((1,010 − 820) ÷ 820). Check the legend.<\/p>"}, {"text": "about 100%", "explanation": "<p>100 is the rise in <strong>euros<\/strong>, not in percent.<\/p>"}], "hints": ["Use the City B line: first and last points.", "Change ÷ 2019 value."], "solution": ["City B: 2019 = €700, 2023 = €800.", "Change = €100.", "100 ÷ 700 ≈ 0.143 → <strong>about 14.3%<\/strong>."]}, {"id": "num-L3-001", "module": "numerical", "level": "L3", "concept": "chained-percent", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "franco1", "loc": "p10", "note": "multipliers"}, "stem": "<p>A price rises by <strong>5%<\/strong>, and later by another <strong>10%<\/strong>. What is the <strong>total<\/strong> percentage increase?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "15.5%", "explanation": "<p>Correct: 1.05 × 1.10 = 1.155, which is a 15.5% increase overall.<\/p>"}, {"text": "15%", "explanation": "<p>This adds 5 + 10. But the second 10% is taken from the already-raised price, so it is a bit more than 15%.<\/p>"}, {"text": "16%", "explanation": "<p>A little too high — check: 1.05 × 1.10 = 1.155 → 15.5%.<\/p>"}, {"text": "5.5%", "explanation": "<p>5.5% is only the extra effect of the second rise on the first 5% (0.05 × 0.10 = 0.5%), not the total.<\/p>"}], "hints": ["Turn each rise into a multiplier.", "1.05 × 1.10 = ? Then subtract 1 and turn it into a percentage."], "solution": ["Multipliers: × 1.05 and × 1.10.", "Combined: 1.05 × 1.10 = 1.155.", "1.155 − 1 = 0.155 → <strong>15.5%<\/strong> increase."]}, {"id": "num-L3-002", "module": "numerical", "level": "L3", "concept": "chained-percent", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "franco1", "loc": "p10", "note": "multipliers for increases and decreases"}, "stem": "<p>A jacket costs <strong>€80<\/strong>. In the sale the price is cut by <strong>25%<\/strong>. After the sale, the sale price is raised by <strong>20%<\/strong>. What is the final price?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€72", "explanation": "<p>Yes: 80 × 0.75 = 60, then 60 × 1.20 = 72. (One step: 80 × 0.75 × 1.20 = 72.)<\/p>"}, {"text": "€76", "explanation": "<p>This treats the two changes as −25% + 20% = −5% (80 × 0.95). The 20% rise is taken from the lower sale price, so it adds less.<\/p>"}, {"text": "€80", "explanation": "<p>The raise of 20% does not undo a cut of 25%: 20% of €60 is only €12.<\/p>"}, {"text": "€84", "explanation": "<p>This would be a 5% rise overall. Work step by step: €80 → €60 → €72.<\/p>"}], "hints": ["First apply the cut, then apply the raise to the new price.", "Multipliers: 0.75 and 1.20."], "solution": ["After the cut: 80 × 0.75 = €60.", "After the raise: 60 × 1.20 = <strong>€72<\/strong>."]}, {"id": "num-L3-003", "module": "numerical", "level": "L3", "concept": "chained-percent", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 50, "source": {"short": "franco1", "loc": "p29", "note": "percentage traps"}, "stem": "<p>Ticket sales <strong>fell by 50%<\/strong> in one year and <strong>rose by 50%<\/strong> the next year. Overall, compared with the start, sales…<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "fell by 25%", "explanation": "<p>Correct: 0.50 × 1.50 = 0.75, so sales are at 75% of the start — a 25% fall.<\/p>"}, {"text": "are unchanged", "explanation": "<p>Tempting, but the 50% rise is taken from a value that had halved. Try 100 → 50 → 75.<\/p>"}, {"text": "rose by 25%", "explanation": "<p>The direction is wrong: 0.50 × 1.50 = 0.75 is less than 1, so sales are lower than at the start.<\/p>"}, {"text": "fell by 50%", "explanation": "<p>That ignores the second year's rise. 100 → 50 → 75: lower than the start, but not by half.<\/p>"}], "hints": ["Try it with 100 tickets.", "100 → 50 (−50%) → ? (+50% of 50)."], "solution": ["Start with 100.", "After −50%: 50.", "After +50%: 50 × 1.5 = 75.", "75 compared with 100 → <strong>a 25% fall<\/strong>."]}, {"id": "num-L3-004", "module": "numerical", "level": "L3", "concept": "growth-years", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 50, "source": {"short": "baneth2023", "loc": "p163", "note": "growth over time"}, "stem": "<p>A museum had <strong>50,000<\/strong> visitors. Visitor numbers grow by <strong>4% a year<\/strong>. How many visitors will it have <strong>two years<\/strong> later?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "54,080", "explanation": "<p>Correct: 50,000 × 1.04 = 52,000; 52,000 × 1.04 = 54,080.<\/p>"}, {"text": "54,000", "explanation": "<p>This adds 4% + 4% = 8% of 50,000. In the second year the 4% applies to 52,000, so it is slightly more.<\/p>"}, {"text": "52,000", "explanation": "<p>That's after only <strong>one<\/strong> year.<\/p>"}, {"text": "58,320", "explanation": "<p>This uses 8% a year for two years (× 1.08 × 1.08). The growth is 4% per year.<\/p>"}], "hints": ["One year = × 1.04. Two years = × 1.04 twice.", "50,000 × 1.04 = 52,000. Now do it once more."], "solution": ["Year 1: 50,000 × 1.04 = 52,000.", "Year 2: 52,000 × 1.04 = <strong>54,080<\/strong>."]}, {"id": "num-L3-005", "module": "numerical", "level": "L3", "concept": "growth-years", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 60, "source": {"short": "baneth2023", "loc": "p163", "note": "compound growth"}, "stem": "<p>You put <strong>€2,000<\/strong> in a savings account that pays <strong>3%<\/strong> interest a year, added to the balance each year. How much is in the account after <strong>three<\/strong> years?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€2,185.45", "explanation": "<p>Correct: 2,000 × 1.03 × 1.03 × 1.03 = 2,000 × 1.092727 = €2,185.45.<\/p>"}, {"text": "€2,180.00", "explanation": "<p>This adds 3 × 3% = 9% of €2,000. Because interest also earns interest, the true amount is a little higher.<\/p>"}, {"text": "€2,060.00", "explanation": "<p>That's after one year only.<\/p>"}, {"text": "€2,121.80", "explanation": "<p>That's after two years. The question asks for three.<\/p>"}], "hints": ["Multiply by 1.03 once for each year.", "2,000 → 2,060 → 2,121.80 → ?"], "solution": ["Year 1: 2,000 × 1.03 = 2,060.", "Year 2: 2,060 × 1.03 = 2,121.80.", "Year 3: 2,121.80 × 1.03 = <strong>€2,185.45<\/strong>."]}, {"id": "num-L3-006", "module": "numerical", "level": "L3", "concept": "growth-years", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 60, "source": {"short": "franco1", "loc": "p10", "note": "initial value from final value"}, "stem": "<p>A company's staff grew by <strong>20% each year<\/strong> for two years, reaching <strong>7,200<\/strong> employees. How many employees did it have at the start?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "5,000", "explanation": "<p>Correct: start × 1.2 × 1.2 = 7,200, so start = 7,200 ÷ 1.44 = 5,000.<\/p>"}, {"text": "5,142.86", "explanation": "<p>This divides by 1.4 (20% + 20%). Two years of 20% growth is × 1.44.<\/p>"}, {"text": "4,608", "explanation": "<p>This takes 20% off twice (× 0.8 × 0.8). Going back means dividing by 1.2 twice, not multiplying by 0.8.<\/p>"}, {"text": "4,320", "explanation": "<p>This takes 40% off 7,200. The growth was calculated on the smaller, earlier numbers.<\/p>"}], "hints": ["Write it as: start × 1.2 × 1.2 = 7,200.", "1.2 × 1.2 = 1.44. Divide 7,200 by 1.44."], "solution": ["start × 1.2 × 1.2 = 7,200.", "start × 1.44 = 7,200.", "start = 7,200 ÷ 1.44 = <strong>5,000<\/strong>.", "Check: 5,000 → 6,000 → 7,200 ✓."]}, {"id": "num-L3-007", "module": "numerical", "level": "L3", "concept": "per-capita", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 75, "source": {"short": "baneth2023", "loc": "p160", "note": "per capita calculations"}, "stem": "<p>What was the approximate <strong>GDP per inhabitant<\/strong> of <strong>Croatia<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>GDP and population<\/caption><thead><tr><th scope='col'>Country<\/th><th scope='col'>GDP (€ billion)<\/th><th scope='col'>Population (million)<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Austria<\/th><td>480<\/td><td>9.1<\/td><\/tr><tr><th scope='row'>Czechia<\/th><td>300<\/td><td>10.9<\/td><\/tr><tr><th scope='row'>Croatia<\/th><td>80<\/td><td>3.9<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "about €20,500", "explanation": "<p>Correct: €80 billion = €80,000 million; 80,000 ÷ 3.9 ≈ 20,513 → about €20,500 per person.<\/p>"}, {"text": "about €2,050", "explanation": "<p>Ten times too small — check the units: billion ÷ million = thousand.<\/p>"}, {"text": "about €205,000", "explanation": "<p>Ten times too big. 80,000 million ÷ 3.9 million ≈ 20,500.<\/p>"}, {"text": "about €27,500", "explanation": "<p>That's <strong>Czechia<\/strong> (300 ÷ 10.9). Check the row.<\/p>"}], "hints": ["Per inhabitant = total ÷ number of people.", "Write both in millions: €80,000 million ÷ 3.9 million."], "solution": ["€80 billion = €80,000 million.", "80,000 million ÷ 3.9 million = 20,513.", "<strong>About €20,500<\/strong> per inhabitant."]}, {"id": "num-L3-008", "module": "numerical", "level": "L3", "concept": "per-capita", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "baneth2023", "loc": "p161", "note": "per unit"}, "stem": "<p>A city's <strong>2,400<\/strong> buses carry <strong>1.8 million<\/strong> passengers a day. On average, how many passengers does each bus carry per day?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "750", "explanation": "<p>Yes: 1,800,000 ÷ 2,400 = 750.<\/p>"}, {"text": "7,500", "explanation": "<p>Ten times too many — check the zeros: 1.8 million = 1,800,000.<\/p>"}, {"text": "75", "explanation": "<p>Ten times too few: 1,800,000 ÷ 2,400 = 750.<\/p>"}, {"text": "1,333", "explanation": "<p>This divides the buses by the passengers (2,400 ÷ 1.8). Per bus = passengers ÷ buses.<\/p>"}], "hints": ["Per bus = passengers ÷ buses.", "1.8 million = 1,800,000. Tip: 18,000 ÷ 24 is easier."], "solution": ["1.8 million = 1,800,000.", "1,800,000 ÷ 2,400 = <strong>750<\/strong> passengers per bus."]}, {"id": "num-L3-009", "module": "numerical", "level": "L3", "concept": "per-capita", "difficulty": 4, "kind": "practice", "answer": 0, "time_s": 100, "source": {"short": "baneth2023", "loc": "p164", "note": "per capita comparisons"}, "stem": "<p>By approximately how much was GDP <strong>per inhabitant<\/strong> higher in <strong>Austria<\/strong> than in <strong>Czechia<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>GDP and population<\/caption><thead><tr><th scope='col'>Country<\/th><th scope='col'>GDP (€ billion)<\/th><th scope='col'>Population (million)<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Austria<\/th><td>480<\/td><td>9.1<\/td><\/tr><tr><th scope='row'>Czechia<\/th><td>300<\/td><td>10.9<\/td><\/tr><tr><th scope='row'>Croatia<\/th><td>80<\/td><td>3.9<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "about €25,200", "explanation": "<p>Correct: Austria 480,000 ÷ 9.1 ≈ 52,750; Czechia 300,000 ÷ 10.9 ≈ 27,520; difference ≈ €25,200.<\/p>"}, {"text": "about €19,800", "explanation": "<p>This divides the GDP difference (€180 billion) by Austria's population. Per-person values must be calculated for each country first, then compared.<\/p>"}, {"text": "about €52,700", "explanation": "<p>That's Austria's GDP per inhabitant on its own. The question asks for the difference.<\/p>"}, {"text": "about €2,500", "explanation": "<p>Ten times too small — check the billion → million conversion.<\/p>"}], "hints": ["Two per-capita calculations, then a subtraction.", "Austria: 480,000 ÷ 9.1. Czechia: 300,000 ÷ 10.9."], "solution": ["Plan: per inhabitant for each country, then subtract.", "Austria: €480,000 million ÷ 9.1 million ≈ €52,747.", "Czechia: €300,000 million ÷ 10.9 million ≈ €27,523.", "Difference ≈ <strong>€25,200<\/strong>."]}, {"id": "num-L3-010", "module": "numerical", "level": "L3", "concept": "speed-time-distance", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 50, "source": {"short": "baneth2023", "loc": "p167", "note": "speed, time and distance"}, "stem": "<p>A train covers <strong>210 km<\/strong> in <strong>1 hour 45 minutes<\/strong>. What is its average speed?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "120 km/h", "explanation": "<p>Correct: 45 minutes = 0.75 h, so the time is 1.75 h; 210 ÷ 1.75 = 120 km/h.<\/p>"}, {"text": "144.8 km/h", "explanation": "<p>This uses 1.45 hours — treating 45 minutes as 0.45 h. 45 minutes is three quarters of an hour: 0.75 h.<\/p>"}, {"text": "105 km/h", "explanation": "<p>This divides by 2 hours. The trip took 1.75 hours.<\/p>"}, {"text": "2 km/h", "explanation": "<p>This is 210 ÷ 105 minutes = 2 km per <strong>minute<\/strong>, not per hour.<\/p>"}], "hints": ["Speed = distance ÷ time, with time in hours.", "45 minutes = 45 ÷ 60 = 0.75 hours."], "solution": ["Time: 1 h 45 min = 1.75 h.", "Speed: 210 ÷ 1.75 = <strong>120 km/h<\/strong>."]}, {"id": "num-L3-011", "module": "numerical", "level": "L3", "concept": "speed-time-distance", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "baneth2023", "loc": "p168", "note": "time from distance and speed"}, "stem": "<p>A bus travels <strong>150 km<\/strong> at an average speed of <strong>60 km/h<\/strong>. How long does the trip take?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "2 h 30 min", "explanation": "<p>Correct: 150 ÷ 60 = 2.5 hours = 2 hours and 30 minutes.<\/p>"}, {"text": "2 h 50 min", "explanation": "<p>This reads 2.5 hours as '2 h 50'. Half an hour is 30 minutes.<\/p>"}, {"text": "2 h 5 min", "explanation": "<p>0.5 hours is 30 minutes, not 5.<\/p>"}, {"text": "1 h 40 min", "explanation": "<p>This is 100 minutes; check the division: 150 ÷ 60 = 2.5 hours.<\/p>"}], "hints": ["Time = distance ÷ speed.", "150 ÷ 60 = 2.5 hours. How many minutes is 0.5 hours?"], "solution": ["Time = 150 ÷ 60 = 2.5 hours.", "0.5 h = 0.5 × 60 = 30 min.", "<strong>2 h 30 min<\/strong> (= 150 minutes)."]}, {"id": "num-L3-012", "module": "numerical", "level": "L3", "concept": "speed-time-distance", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "baneth2023", "loc": "p169", "note": "distance from speed and time"}, "stem": "<p>You walk at <strong>4.8 km/h<\/strong> for <strong>25 minutes<\/strong>. How far do you walk?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "2 km", "explanation": "<p>Yes: 25 minutes = 25/60 h; 4.8 × 25 ÷ 60 = 2 km.<\/p>"}, {"text": "1.2 km", "explanation": "<p>This uses 0.25 h (as if 25 minutes were a quarter of an hour). 25 minutes = 25 ÷ 60 ≈ 0.417 h.<\/p>"}, {"text": "120 km", "explanation": "<p>This multiplies 4.8 × 25 without turning minutes into hours.<\/p>"}, {"text": "0.19 km", "explanation": "<p>This divides 4.8 ÷ 25. Distance = speed × time.<\/p>"}], "hints": ["Distance = speed × time (time in hours).", "25 minutes = 25 ÷ 60 hours."], "solution": ["Time in hours: 25 ÷ 60.", "Distance: 4.8 × 25 ÷ 60 = 120 ÷ 60 = <strong>2 km<\/strong>."]}, {"id": "num-L3-013", "module": "numerical", "level": "L3", "concept": "multi-step", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 50, "source": {"short": "franco2", "loc": "s15", "note": "main steps of the method"}, "stem": "<p>What was the <strong>unemployment rate<\/strong> in the <strong>West<\/strong> region?<\/p>", "table": "<div class='dtable'><table><caption>Labour market, 2024 <span class=\"unit\">(thousands)<\/span><\/caption><thead><tr><th scope='col'>Region<\/th><th scope='col'>Labour force<\/th><th scope='col'>Unemployed<\/th><\/tr><\/thead><tbody><tr><th scope='row'>East<\/th><td>2,400<\/td><td>156<\/td><\/tr><tr><th scope='row'>West<\/th><td>1,600<\/td><td>136<\/td><\/tr><\/tbody><\/table><p class='tnote'>Unemployment rate = unemployed ÷ labour force. Invented data.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "8.5%", "explanation": "<p>Correct: 136 ÷ 1,600 = 0.085 → 8.5%.<\/p>"}, {"text": "11.8%", "explanation": "<p>This divides the labour force by the unemployed (1,600 ÷ 136 ≈ 11.8). The rate is unemployed ÷ labour force.<\/p>"}, {"text": "6.5%", "explanation": "<p>That's the <strong>East<\/strong> rate (156 ÷ 2,400).<\/p>"}, {"text": "85%", "explanation": "<p>The decimal point slipped: 0.085 = 8.5%.<\/p>"}], "hints": ["Rate = unemployed ÷ labour force, for the West row only.", "136 ÷ 1,600 = ?"], "solution": ["West: 136 ÷ 1,600 = 0.085.", "× 100 → <strong>8.5%<\/strong>."]}, {"id": "num-L3-014", "module": "numerical", "level": "L3", "concept": "multi-step", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 80, "source": {"short": "franco1", "loc": "p23", "note": "percentage points"}, "stem": "<p>By how many <strong>percentage points<\/strong> was the unemployment rate in the <strong>West<\/strong> higher than in the <strong>East<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Labour market, 2024 <span class=\"unit\">(thousands)<\/span><\/caption><thead><tr><th scope='col'>Region<\/th><th scope='col'>Labour force<\/th><th scope='col'>Unemployed<\/th><\/tr><\/thead><tbody><tr><th scope='row'>East<\/th><td>2,400<\/td><td>156<\/td><\/tr><tr><th scope='row'>West<\/th><td>1,600<\/td><td>136<\/td><\/tr><\/tbody><\/table><p class='tnote'>Unemployment rate = unemployed ÷ labour force. Invented data.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "2 percentage points", "explanation": "<p>Correct: West 8.5%, East 6.5%; 8.5 − 6.5 = 2 percentage points.<\/p>"}, {"text": "30.8 percentage points", "explanation": "<p>30.8% is the <strong>relative<\/strong> difference (2 ÷ 6.5). The question asks for percentage points: subtract the rates.<\/p>"}, {"text": "20 percentage points", "explanation": "<p>Check the rates: 8.5% and 6.5% are two points apart.<\/p>"}, {"text": "0.2 percentage points", "explanation": "<p>The rates are 8.5% and 6.5%, so the gap is 2 points, not 0.2.<\/p>"}], "hints": ["Plan: rate West, rate East, then subtract.", "West 136 ÷ 1,600; East 156 ÷ 2,400."], "solution": ["West: 136 ÷ 1,600 = 8.5%.", "East: 156 ÷ 2,400 = 6.5%.", "Difference: 8.5 − 6.5 = <strong>2 percentage points<\/strong>."]}, {"id": "num-L3-015", "module": "numerical", "level": "L3", "concept": "multi-step", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 70, "source": {"short": "baneth2023", "loc": "p136", "note": "charts"}, "stem": "<p>What share of the company's <strong>annual<\/strong> revenue was earned in <strong>Q3<\/strong>?<\/p>", "table": "", "chart": "<figure class='chartfig'><figcaption>Quarterly revenue<\/figcaption><svg viewBox=\"0 0 560 300\" role=\"img\" aria-label=\"Quarterly revenue\" class=\"chart\"><line x1=\"60\" x2=\"540\" y1=\"250.0\" y2=\"250.0\" class=\"grid\"/><text x=\"52\" y=\"254.0\" class=\"tick\" text-anchor=\"end\">0<\/text><line x1=\"60\" x2=\"540\" y1=\"204.0\" y2=\"204.0\" class=\"grid\"/><text x=\"52\" y=\"208.0\" class=\"tick\" text-anchor=\"end\">4<\/text><line x1=\"60\" x2=\"540\" y1=\"158.0\" y2=\"158.0\" class=\"grid\"/><text x=\"52\" y=\"162.0\" class=\"tick\" text-anchor=\"end\">8<\/text><line x1=\"60\" x2=\"540\" y1=\"112.0\" y2=\"112.0\" class=\"grid\"/><text x=\"52\" y=\"116.0\" class=\"tick\" text-anchor=\"end\">12<\/text><line x1=\"60\" x2=\"540\" y1=\"66.0\" y2=\"66.0\" class=\"grid\"/><text x=\"52\" y=\"70.0\" class=\"tick\" text-anchor=\"end\">16<\/text><line x1=\"60\" x2=\"540\" y1=\"20.0\" y2=\"20.0\" class=\"grid\"/><text x=\"52\" y=\"24.0\" class=\"tick\" text-anchor=\"end\">20<\/text><path d=\"M102.0,250 V116.0 Q102.0,112.0 106.0,112.0 H134.0 Q138.0,112.0 138.0,116.0 V250 Z\" class=\"s1\"><title>Revenue, Q1: 12 € million<\/title><\/path><text x=\"120.0\" y=\"106.0\" class=\"val\" text-anchor=\"middle\">12<\/text><path d=\"M222.0,250 V81.5 Q222.0,77.5 226.0,77.5 H254.0 Q258.0,77.5 258.0,81.5 V250 Z\" class=\"s1\"><title>Revenue, Q2: 15 € million<\/title><\/path><text x=\"240.0\" y=\"71.5\" class=\"val\" text-anchor=\"middle\">15<\/text><path d=\"M342.0,250 V47.0 Q342.0,43.0 346.0,43.0 H374.0 Q378.0,43.0 378.0,47.0 V250 Z\" class=\"s1\"><title>Revenue, Q3: 18 € million<\/title><\/path><text x=\"360.0\" y=\"37.0\" class=\"val\" text-anchor=\"middle\">18<\/text><path d=\"M462.0,250 V81.5 Q462.0,77.5 466.0,77.5 H494.0 Q498.0,77.5 498.0,81.5 V250 Z\" class=\"s1\"><title>Revenue, Q4: 15 € million<\/title><\/path><text x=\"480.0\" y=\"71.5\" class=\"val\" text-anchor=\"middle\">15<\/text><line x1=\"60\" x2=\"540\" y1=\"250\" y2=\"250\" class=\"axis\"/><text x=\"120.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">Q1<\/text><text x=\"240.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">Q2<\/text><text x=\"360.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">Q3<\/text><text x=\"480.0\" y=\"270\" class=\"tick\" text-anchor=\"middle\">Q4<\/text><text x=\"60\" y=\"292\" class=\"tick\">€ million<\/text><\/svg><details class='astable'><summary>Show as table<\/summary><div class='dtable'><table><caption>Quarterly revenue <span class=\"unit\">(€ million)<\/span><\/caption><thead><tr><th scope='col'><\/th><th scope='col'>Revenue<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Q1<\/th><td>12<\/td><\/tr><tr><th scope='row'>Q2<\/th><td>15<\/td><\/tr><tr><th scope='row'>Q3<\/th><td>18<\/td><\/tr><tr><th scope='row'>Q4<\/th><td>15<\/td><\/tr><\/tbody><\/table><\/div><\/details><\/figure>", "figure": "", "options": [{"text": "30%", "explanation": "<p>Correct: annual total = 12 + 15 + 18 + 15 = 60; 18 ÷ 60 = 0.30 → 30%.<\/p>"}, {"text": "25%", "explanation": "<p>That would be an equal quarter for each period. Q3 is above average, so its share is more than 25%.<\/p>"}, {"text": "18%", "explanation": "<p>18 is Q3's revenue in € million, not its share of the year.<\/p>"}, {"text": "50%", "explanation": "<p>This compares Q3 with Q1 and Q2 together (18 ÷ 36). A share of the year must compare Q3 with the whole year: 18 ÷ 60.<\/p>"}], "hints": ["First find the annual total: add all four bars.", "Then Q3 ÷ total × 100."], "solution": ["Annual total: 12 + 15 + 18 + 15 = €60 million.", "Q3 share: 18 ÷ 60 = 0.30 → <strong>30%<\/strong>."]}, {"id": "num-L4-001", "module": "numerical", "level": "L4", "concept": "estimation", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 20, "source": {"short": "baneth2023", "loc": "p187", "note": "estimating and mental arithmetic"}, "stem": "<p><strong>Without a calculator:<\/strong> 4,890 + 3,120 + 1,980 is about…<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "≈ 8,000", "explanation": "<p>Too low. Rounded: 5,000 + 3,000 + 2,000 = 10,000.<\/p>"}, {"text": "≈ 10,000", "explanation": "<p>Yes: 5,000 + 3,000 + 2,000 = 10,000 (exact: 9,990).<\/p>"}, {"text": "≈ 12,000", "explanation": "<p>Too high — round each number to the nearest thousand and add.<\/p>"}, {"text": "≈ 14,000", "explanation": "<p>Much too high. 4,890 ≈ 5,000; 3,120 ≈ 3,000; 1,980 ≈ 2,000.<\/p>"}], "hints": ["Round each number to the nearest thousand.", "5,000 + 3,000 + 2,000 = ?"], "solution": ["Round: 5,000 + 3,000 + 2,000.", "Sum ≈ <strong>10,000<\/strong> (exact 9,990)."]}, {"id": "num-L4-002", "module": "numerical", "level": "L4", "concept": "estimation", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 45, "source": {"short": "baneth2023", "loc": "p135", "note": "estimating shares when options are far apart"}, "stem": "<p>Approximately what share of all votes did <strong>Party B<\/strong> receive?<\/p>", "table": "<div class='dtable'><table><caption>Votes in a regional election <span class=\"unit\">(thousands)<\/span><\/caption><thead><tr><th scope='col'>Party<\/th><th scope='col'>Votes<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Party A<\/th><td>2,030<\/td><\/tr><tr><th scope='row'>Party B<\/th><td>3,960<\/td><\/tr><tr><th scope='row'>Party C<\/th><td>1,010<\/td><\/tr><tr><th scope='row'>Party D<\/th><td>2,980<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "20%", "explanation": "<p>Too low: Party B has the most votes — roughly 4 out of every 10.<\/p>"}, {"text": "30%", "explanation": "<p>That's about Party D's share. Party B: 4 ÷ 10 ≈ 40%.<\/p>"}, {"text": "40%", "explanation": "<p>Correct: round to 2, 4, 1, 3 (millions) → total 10; B = 4 ÷ 10 = 40% (exact 39.7%).<\/p>"}, {"text": "50%", "explanation": "<p>Too high — 4 out of 10 is 40%.<\/p>"}, {"text": "60%", "explanation": "<p>Much too high; that would be more than all other parties together.<\/p>"}], "hints": ["The options are 10 points apart — estimate.", "Round the votes to 2,000, 4,000, 1,000 and 3,000 (thousand) and drop the zeros."], "solution": ["Round and drop the zeros: 2 + 4 + 1 + 3 = 10.", "Party B: 4 ÷ 10 = <strong>40%<\/strong> (exact: 3,960 ÷ 9,980 = 39.7%)."]}, {"id": "num-L4-003", "module": "numerical", "level": "L4", "concept": "estimation", "difficulty": 1, "kind": "practice", "answer": 2, "time_s": 20, "source": {"short": "baneth2023", "loc": "p134", "note": "estimation tests"}, "stem": "<p><strong>Estimate:<\/strong> 19.8 × 51 is about…<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "≈ 100", "explanation": "<p>Ten times too small: 20 × 50 = 1,000.<\/p>"}, {"text": "≈ 500", "explanation": "<p>That's 10 × 50. Round 19.8 to 20, not to 10.<\/p>"}, {"text": "≈ 1,000", "explanation": "<p>Yes: 20 × 50 = 1,000 (exact 1,009.8).<\/p>"}, {"text": "≈ 10,000", "explanation": "<p>Ten times too big.<\/p>"}], "hints": ["Round both numbers to friendly values.", "20 × 50 = ?"], "solution": ["19.8 ≈ 20 and 51 ≈ 50.", "20 × 50 = <strong>1,000<\/strong>."]}, {"id": "num-L4-004", "module": "numerical", "level": "L4", "concept": "magnitude-elimination", "difficulty": 2, "kind": "practice", "answer": 3, "time_s": 30, "source": {"short": "baneth2023", "loc": "p146", "note": "order of magnitude"}, "stem": "<p><strong>€3.6 billion<\/strong> of support is shared equally among <strong>1.2 million<\/strong> households. How much does each household receive?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€3", "explanation": "<p>Far too small. Billions ÷ millions gives thousands.<\/p>"}, {"text": "€30", "explanation": "<p>Still too small by a factor of 100.<\/p>"}, {"text": "€300", "explanation": "<p>Ten times too small — billions ÷ millions = thousands.<\/p>"}, {"text": "€3,000", "explanation": "<p>Correct: 3.6 ÷ 1.2 = 3, and billion ÷ million = thousand → €3,000.<\/p>"}, {"text": "€30,000", "explanation": "<p>Ten times too big.<\/p>"}], "hints": ["Ignore the units first: 3.6 ÷ 1.2 = 3.", "billion ÷ million = thousand."], "solution": ["Digits: 3.6 ÷ 1.2 = 3.", "Units: billion ÷ million = thousand.", "<strong>€3,000<\/strong> per household."]}, {"id": "num-L4-005", "module": "numerical", "level": "L4", "concept": "magnitude-elimination", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 30, "source": {"short": "baneth2023", "loc": "p153", "note": "order of magnitude questions"}, "stem": "<p>What is <strong>0.4%<\/strong> of <strong>25 million<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "1,000", "explanation": "<p>Too small by 100.<\/p>"}, {"text": "10,000", "explanation": "<p>Ten times too small: 1% of 25 million is 250,000, so 0.4% is 100,000.<\/p>"}, {"text": "100,000", "explanation": "<p>Correct: 1% of 25 million = 250,000; 0.4% = 0.4 × 250,000 = 100,000.<\/p>"}, {"text": "1,000,000", "explanation": "<p>That's 4%, not 0.4%.<\/p>"}], "hints": ["Start from 1%: 25 million ÷ 100.", "0.4% is a bit less than half of 1%."], "solution": ["1% of 25,000,000 = 250,000.", "0.4% = 0.4 × 250,000 = <strong>100,000<\/strong>."]}, {"id": "num-L4-006", "module": "numerical", "level": "L4", "concept": "magnitude-elimination", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 30, "source": {"short": "baneth2023", "loc": "p156", "note": "order of magnitude"}, "stem": "<p>A country has an area of <strong>450,000 km²<\/strong> and <strong>9 million<\/strong> inhabitants. How many inhabitants per km²?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "0.05", "explanation": "<p>This divides area by population. Inhabitants per km² = people ÷ area.<\/p>"}, {"text": "2", "explanation": "<p>Ten times too small: 9,000,000 ÷ 450,000 = 20.<\/p>"}, {"text": "20", "explanation": "<p>Correct: 9,000,000 ÷ 450,000 = 20.<\/p>"}, {"text": "200", "explanation": "<p>Ten times too big.<\/p>"}, {"text": "2,000", "explanation": "<p>A hundred times too big.<\/p>"}], "hints": ["People ÷ area.", "Cancel zeros: 9,000,000 ÷ 450,000 = 900 ÷ 45."], "solution": ["9,000,000 ÷ 450,000.", "Remove four zeros from both: 900 ÷ 45 = <strong>20<\/strong> per km²."]}, {"id": "num-L4-007", "module": "numerical", "level": "L4", "concept": "quick-variation", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco2", "loc": "s7", "note": "quick variation between values"}, "stem": "<p>A value goes from <strong>64<\/strong> to <strong>72<\/strong>. Using new ÷ old, what is the percentage change?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "+12.5%", "explanation": "<p>Correct: 72 ÷ 64 = 1.125 → +12.5%.<\/p>"}, {"text": "+8%", "explanation": "<p>8 is the change in units, not percent.<\/p>"}, {"text": "+11.1%", "explanation": "<p>This is 8 ÷ 72 — dividing by the new value. Use new ÷ old = 72 ÷ 64.<\/p>"}, {"text": "+112.5%", "explanation": "<p>1.125 means +12.5%, not +112.5%. Subtract 1 from the multiplier.<\/p>"}], "hints": ["new ÷ old = 72 ÷ 64.", "Read the multiplier: 1.125 → ?"], "solution": ["72 ÷ 64 = 1.125.", "1.125 − 1 = 0.125 → <strong>+12.5%<\/strong>."]}, {"id": "num-L4-008", "module": "numerical", "level": "L4", "concept": "quick-variation", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 50, "source": {"short": "franco2", "loc": "s7", "note": "comparing variations"}, "stem": "<p>Region A's exports rose from <strong>150 to 180<\/strong>; Region B's from <strong>420 to 483<\/strong>. What was the percentage growth of the region that grew <strong>faster in percentage terms<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "20%", "explanation": "<p>Correct: A: 180 ÷ 150 = 1.20 (+20%); B: 483 ÷ 420 = 1.15 (+15%). A grew faster, at 20%.<\/p>"}, {"text": "15%", "explanation": "<p>That's Region B's growth — the slower one in percentage terms.<\/p>"}, {"text": "63%", "explanation": "<p>63 is B's increase in units (483 − 420), not a percentage.<\/p>"}, {"text": "30%", "explanation": "<p>30 is A's increase in units (180 − 150).<\/p>"}], "hints": ["Compute new ÷ old for both regions.", "A: 180 ÷ 150. B: 483 ÷ 420. Which multiplier is bigger?"], "solution": ["A: 180 ÷ 150 = 1.20 → +20%.", "B: 483 ÷ 420 = 1.15 → +15%.", "A grew faster: <strong>20%<\/strong>.", "Note: B gained more in units (63 vs 30) — percentage and absolute growth can disagree."]}, {"id": "num-L4-009", "module": "numerical", "level": "L4", "concept": "quick-variation", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco2", "loc": "s7", "note": "quick variation"}, "stem": "<p>Energy use fell from <strong>250<\/strong> to <strong>215<\/strong> units. What is the percentage change?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "a fall of 14%", "explanation": "<p>Correct: 215 ÷ 250 = 0.86 → a fall of 14%.<\/p>"}, {"text": "a fall of 35%", "explanation": "<p>35 is the fall in units, not percent.<\/p>"}, {"text": "a fall of 16.3%", "explanation": "<p>This divides the fall by the new value (35 ÷ 215). Use the old value.<\/p>"}, {"text": "a rise of 14%", "explanation": "<p>The value went down, so it is a fall.<\/p>"}], "hints": ["new ÷ old = 215 ÷ 250.", "0.86 → a fall of how much?"], "solution": ["215 ÷ 250 = 0.86.", "0.86 − 1 = −0.14 → <strong>a fall of 14%<\/strong>."]}, {"id": "num-L4-010", "module": "numerical", "level": "L4", "concept": "fraction-shortcuts", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "franco2", "loc": "s9", "note": "fractions to decimals faster"}, "stem": "<p>What is <strong>12.5%<\/strong> of <strong>640<\/strong>? (Hint: 12.5% is a friendly fraction.)<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "80", "explanation": "<p>Yes: 12.5% = ⅛, and 640 ÷ 8 = 80.<\/p>"}, {"text": "64", "explanation": "<p>That's 10% of 640.<\/p>"}, {"text": t: 1,350 ÷ 3.", "Then double it."], "solution": ["⅓ of 1,350 = 450.", "⅔ = 2 × 450 = <strong>900<\/strong>."]}, {"id": "num-L5-001", "module": "numerical", "level": "L5", "concept": "num-exam-strategy", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco2", "loc": "s45", "note": "time strategy"}, "stem": "<p>You have <strong>20 minutes<\/strong> for <strong>10 questions<\/strong>. After <strong>9 minutes<\/strong> you have answered <strong>3<\/strong> questions. On average, how much time is left for each remaining question?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "about 1.57 minutes", "explanation": "<p>Correct: 11 minutes left ÷ 7 questions ≈ 1.57 min (about 1 min 34 s). Time to speed up a little — use estimation and skip anything stuck.<\/p>"}, {"text": "2 minutes", "explanation": "<p>2 minutes was the average at the start. You've used 9 minutes for 3 questions, so less is left per question.<\/p>"}, {"text": "about 1.1 minutes", "explanation": "<p>This divides the 11 minutes left by all 10 questions. Only 7 remain.<\/p>"}, {"text": "3 minutes", "explanation": "<p>That's the time you spent per question so far (9 ÷ 3).<\/p>"}], "hints": ["Minutes left: 20 − 9. Questions left: 10 − 3.", "11 ÷ 7 ≈ ?"], "solution": ["Minutes left: 11. Questions left: 7.", "11 ÷ 7 ≈ <strong>1.57 minutes<\/strong> per question."]}, {"id": "num-L5-002", "module": "numerical", "level": "L5", "concept": "num-exam-strategy", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "franco1", "loc": "p9", "note": "answer all the questions"}, "stem": "<p>If you must guess at random on a question with <strong>5 answer options<\/strong>, what is your chance of being right?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "20%", "explanation": "<p>Correct: 1 in 5 = 20%. Small, but much better than the 0% of a blank answer — so never leave a blank (TO VERIFY that wrong answers are not penalised).<\/p>"}, {"text": "25%", "explanation": "<p>That's for 4 options (1 in 4).<\/p>"}, {"text": "50%", "explanation": "<p>That would be with 2 options. If you can eliminate 3 options first, a guess between the last 2 has a 50% chance!<\/p>"}, {"text": "0%", "explanation": "<p>That's the chance with a <strong>blank<\/strong> answer — which is why you should always guess.<\/p>"}], "hints": ["One option is right out of five.", "1 ÷ 5 as a percentage."], "solution": ["1 right option out of 5: 1 ÷ 5 = 0.2 → <strong>20%<\/strong>.", "Eliminating options first raises your chances: 1 in 3 = 33%, 1 in 2 = 50%."]}, {"id": "num-L5-E01", "module": "numerical", "level": "L5", "concept": "multi-step", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>By what percentage did electricity from renewable sources in <strong>Poland<\/strong> increase between <strong>2021 and 2023<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Electricity from renewable sources <span class=\"unit\">(TWh)<\/span><\/caption><thead><tr><th scope='col'>Country<\/th><th scope='col'>2021<\/th><th scope='col'>2023<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Spain<\/th><td>120<\/td><td>138<\/td><\/tr><tr><th scope='row'>Germany<\/th><td>235<\/td><td>254<\/td><\/tr><tr><th scope='row'>France<\/th><td>115<\/td><td>129<\/td><\/tr><tr><th scope='row'>Poland<\/th><td>30<\/td><td>42<\/td><\/tr><tr><th scope='row'>Portugal<\/th><td>32<\/td><td>36<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "40%", "explanation": "<p>Correct: 42 ÷ 30 = 1.40 → +40%.<\/p>"}, {"text": "12%", "explanation": "<p>12 is the increase in TWh (42 − 30), not in percent.<\/p>"}, {"text": "28.6%", "explanation": "<p>This divides the increase by the 2023 value (12 ÷ 42). Use the 2021 value.<\/p>"}, {"text": "140%", "explanation": "<p>1.40 is the multiplier; the increase is 40%.<\/p>"}, {"text": "4%", "explanation": "<p>The decimal point slipped: 0.40 = 40%.<\/p>"}], "hints": ["Find Poland's row: 30 (2021) and 42 (2023).", "new ÷ old = 42 ÷ 30."], "solution": ["42 ÷ 30 = 1.40.", "1.40 − 1 = 0.40 → <strong>+40%<\/strong>."]}, {"id": "num-L5-E02", "module": "numerical", "level": "L5", "concept": "multi-step", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>What share of the five countries' <strong>2023<\/strong> renewable electricity was produced in <strong>Germany<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Electricity from renewable sources <span class=\"unit\">(TWh)<\/span><\/caption><thead><tr><th scope='col'>Country<\/th><th scope='col'>2021<\/th><th scope='col'>2023<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Spain<\/th><td>120<\/td><td>138<\/td><\/tr><tr><th scope='row'>Germany<\/th><td>235<\/td><td>254<\/td><\/tr><tr><th scope='row'>France<\/th><td>115<\/td><td>129<\/td><\/tr><tr><th scope='row'>Poland<\/th><td>30<\/td><td>42<\/td><\/tr><tr><th scope='row'>Portugal<\/th><td>32<\/td><td>36<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "42.4%", "explanation": "<p>Correct: 2023 total = 138 + 254 + 129 + 42 + 36 = 599; 254 ÷ 599 = 42.4%.<\/p>"}, {"text": "44.2%", "explanation": "<p>That's Germany's share in <strong>2021<\/strong> (235 ÷ 532).<\/p>"}, {"text": "25.4%", "explanation": "<p>This divides 254 by 1,000. Divide by the 2023 total of the five countries (599).<\/p>"}, {"text": "57.6%", "explanation": "<p>That's the share of the <strong>other four<\/strong> countries (100% − 42.4%).<\/p>"}, {"text": "50.8%", "explanation": "<p>This divides by a rounded total of 500. The exact 2023 total of the five countries is 599.<\/p>"}], "hints": ["Add the 2  of 2.4 m = €1.56 m; travel = 1 part of 4 = €390,000.<\/p>"}, {"text": "€1,170,000", "explanation": "<p>That's the <strong>equipment<\/strong> share (3 parts of 4).<\/p>"}, {"text": "€600,000", "explanation": "<p>This takes ¼ of the <strong>whole<\/strong> budget. The ratio applies only to what is left after staff.<\/p>"}, {"text": "€520,000", "explanation": "<p>This splits the rest into 3 parts. The ratio 3 : 1 has 4 parts.<\/p>"}, {"text": "€840,000", "explanation": "<p>That's the <strong>staff<\/strong> share (35% of €2.4 m).<\/p>"}], "hints": ["Step 1: what's left after staff? (100% − 35%)", "Step 2: split that in 3 + 1 = 4 parts; travel is 1 part."], "solution": ["Left after staff: 2,400,000 × 0.65 = €1,560,000.", "Parts: 3 + 1 = 4 → one part = €390,000.", "Travel = <strong>€390,000<\/strong>."]}, {"id": "num-L5-E08", "module": "numerical", "level": "L5", "concept": "per-capita", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>A translator works through <strong>2,400 words per day<\/strong>. How many working days does a <strong>15,600-word<\/strong> document take one translator?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "6.5 days", "explanation": "<p>Correct: 15,600 ÷ 2,400 = 6.5.<\/p>"}, {"text": "6.25 days", "explanation": "<p>Check the division: 2,400 × 6.5 = 15,600.<\/p>"}, {"text": "7.5 days", "explanation": "<p>Too many: 2,400 × 7.5 = 18,000 words.<\/p>"}, {"text": "3.25 days", "explanation": "<p>That would be with <strong>two<\/strong> translators.<\/p>"}, {"text": "65 days", "explanation": "<p>Ten times too many — check the zeros.<\/p>"}], "hints": ["Days = total words ÷ words per day.", "15,600 ÷ 2,400 = 156 ÷ 24."], "solution": ["15,600 ÷ 2,400 = <strong>6.5 days<\/strong>."]}, {"id": "num-L5-E09", "module": "numerical", "level": "L5", "concept": "conversion", "difficulty": 4, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>A conference trip costs <strong>3 hotel nights at CHF 180<\/strong> each plus a <strong>€450<\/strong> registration fee. <strong>€1 = 0.95 CHF<\/strong>. What is the total cost in <strong>euros<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€1,018.42", "explanation": "<p>Correct: hotel = 540 CHF ÷ 0.95 = €568.42; plus €450 = €1,018.42.<\/p>"}, {"text": "€963.00", "explanation": "<p>This multiplies the francs by 0.95. Francs → euros means dividing by 0.95.<\/p>"}, {"text": "€990.00", "explanation": "<p>This adds francs and euros as if they were the same currency.<\/p>"}, {"text": "€1,042.11", "explanation": "<p>This converts the €450 fee as well. The fee is already in euros.<\/p>"}, {"text": "€568.42", "explanation": "<p>That's the hotel only. Add the €450 fee.<\/p>"}], "hints": ["Convert only the hotel cost (CHF) into euros.", "€ = CHF ÷ 0.95. Then add the €450."], "solution": ["Hotel: 3 × 180 = 540 CHF.", "In euros: 540 ÷ 0.95 = €568.42.", "Total: 568.42 + 450 = <strong>€1,018.42<\/strong>."]}, {"id": "num-L5-E10", "module": "numerical", "level": "L5", "concept": "multi-step", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>What percentage of all households in the city are <strong>one-person<\/strong> households?<\/p>", "table": "<div class='dtable'><table><caption>Households in a city, by size <span class=\"unit\">(thousands)<\/span><\/caption><thead><tr><th scope='col'>Household size<\/th><th scope='col'>Households<\/th><\/tr><\/thead><tbody><tr><th scope='row'>1 person<\/th><td>180<\/td><\/tr><tr><th scope='row'>2 persons<\/th><td>150<\/td><\/tr><tr><th scope='row'>3 persons<\/th><td>70<\/td><\/tr><tr><th scope='row'>4 or more<\/th><td>100<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented 022 only.<\/p>"}, {"text": "€212.80", "explanation": "<p>That's 2023's inflation applied once to €200.<\/p>"}, {"text": "€224.73", "explanation": "<p>This uses the <strong>2021<\/strong> and 2022 rates (× 1.029 × 1.092). The question covers 2022 and 2023.<\/p>"}], "hints": ["Two multipliers: 2022 (9.2%) and 2023 (6.4%).", "200 × 1.092 × 1.064."], "solution": ["After 2022: 200 × 1.092 = 218.40.", "After 2023: 218.40 × 1.064 = <strong>€232.38<\/strong>."]}, {"id": "num-L5-E16", "module": "numerical", "level": "L5", "concept": "ratios", "difficulty": 4, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>The agency recruits <strong>50 more Administrators<\/strong> and nothing else changes. What share of all staff will then be Administrators?<\/p>", "table": "<div class='dtable'><table><caption>Staff of an EU agency<\/caption><thead><tr><th scope='col'>Category<\/th><th scope='col'>Staff<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Administrators (AD)<\/th><td>420<\/td><\/tr><tr><th scope='row'>Assistants (AST)<\/th><td>310<\/td><\/tr><tr><th scope='row'>Contract agents<\/th><td>270<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "44.8%", "explanation": "<p>Correct: 470 ÷ 1,050 = 44.8%.<\/p>"}, {"text": "47.0%", "explanation": "<p>This divides 470 by the old total of 1,000. The total grows to 1,050.<\/p>"}, {"text": "42.0%", "explanation": "<p>That's the current share (420 ÷ 1,000).<\/p>"}, {"text": "50.0%", "explanation": "<p>Too high: 470 is less than half of 1,050.<\/p>"}, {"text": "46.2%", "explanation": "<p>Check: 470 ÷ 1,050 = 0.448.<\/p>"}], "hints": ["New AD: 420 + 50. New total: 1,000 + 50.", "Divide."], "solution": ["New AD: 470.", "New total: 420 + 310 + 270 + 50 = 1,050.", "470 ÷ 1,050 = <strong>44.8%<\/strong>."]}, {"id": "num-L5-E17", "module": "numerical", "level": "L5", "concept": "speed-time-distance", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>A delegation leaves Brussels at <strong>08:15<\/strong> for a <strong>440 km<\/strong> trip at an average speed of <strong>80 km/h<\/strong>, with one <strong>30-minute<\/strong> break. When does it arrive?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "14:15", "explanation": "<p>Correct: driving 440 ÷ 80 = 5.5 h = 5 h 30; plus 30 min break = 6 h; 08:15 + 6 h = 14:15.<\/p>"}, {"text": "13:45", "explanation": "<p>This forgets the 30-minute break.<\/p>"}, {"text": "14:45", "explanation": "<p>This adds the break twice, or reads 5.5 h as 6 h before adding the break.<\/p>"}, {"text": "13:15", "explanation": "<p>This treats 5.5 hours as 5 hours.<\/p>"}, {"text": "13:55", "explanation": "<p>5.5 hours is 5 h 30 min, not 5 h 50 or 5 h 5.<\/p>"}], "hints": ["Driving time = 440 ÷ 80 hours.", "Add the break, then add to 08:15."], "solution": ["Driving: 440 ÷ 80 = 5.5 h = 5 h 30 min.", "Plus break: 6 h.", "08:15 + 6 h = <strong>14:15<\/strong>."]}, {"id": "num-L5-E18", "module": "numerical", "level": "L5", "concept": "per-capita", "difficulty": 3, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>A region of <strong>2.5 million<\/strong> inhabitants recycles <strong>450,000 tonnes<\/strong> of waste a year. How many <strong>kilograms<\/strong> per inhabitant is that?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "180 kg", "explanation": "<p>Correct: 450,000 t = 450,000,000 kg; ÷ 2,500,000 = 180 kg.<\/p>"}, {"text": "18 kg", "explanation": "<p>Ten times too small — check the tonne → kg conversion (× 1,000).<\/p>"}, {"text": "1,800 kg", "explanation": "<p>Ten times too big.<\/p>"}, {"text": "0.18 kg", "explanation": "<p>This forgets to convert tonnes to kilograms.<\/p>"}, {"text": "5.6 kg", "explanation": "<p>This divides people by waste (2.5 m ÷ 450,000). Per inhabitant = waste ÷ people.<\/p>"}], "hints": ["1 tonne = 1,000 kg.", "kg ÷ inhabitants."], "solution": ["450,000 t × 1,000 = 450,000,000 kg.", "450,000,000 ÷ 2,500,000 = <strong>180 kg<\/strong> per inhabitant."]}, {"id": "num-L5-E19", "module": "numerical", "level": "L5", "concept": "whole-from-part", "difficulty": 4, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>In a selection test, <strong>6,300<\/strong> candidates passed. They were <strong>15%<\/strong> of all who took the test. How many candidates <strong>failed<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "35,700", "explanation": "<p>Correct: total = 6,300 ÷ 0.15 = 42,000; failed = 42,000 − 6,300 = 35,700.<\/p>"}, {"text": "42,000", "explanation": "<p>That's everyone who took the test. Subtract those who passed.<\/p>"}, {"text": "5,355", "explanation": "<p>This takes 85% of 6,300. The 85% applies to the total, not to the passes.<\/p>"}, {"text": "945", "explanation": "<p>That's 15% of 6,300.<\/p>"}, {"text": "41,000", "explanation": "<p>Check: 6,300 ÷ 0.15 = 42,000, minus 6,300 = 35,700.<\/p>"}], "hints": ["First find the total who took the test.", "Then subtract those who passed."], "solution": ["Total: 6,300 ÷ 0.15 = 42,000.", "Failed: 42,000 − 6,300 = <strong>35,700<\/strong>."]}, {"id": "num-L5-E20", "module": "numerical", "level": "L5", "concept": "percentage-points", "difficulty": 4, "kind": "exam", "answer": 0, "time_s": 120, "source": {"short": "baneth2023", "loc": "p199", "note": "style of the mixed numerical test"}, "stem": "<p>A party won <strong>24%<\/strong> of the vote. At the next election, its share of the vote <strong>rose by 25%<\/strong>. What was its new share?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "30%", "explanation": "<p>Correct: 24 × 1.25 = 30%. 'Rose by 25%' is a relative change of the share.<\/p>"}, {"text": "49%", "explanation": "<p>This adds 25 percentage points. 'By 25%' means relative to 24%, i.e. × 1.25.<\/p>"}, {"text": "6%", "explanation": "<p>6 points is the increase, not the new share.<\/p>"}, {"text": "24.25%", "explanation": "<p>This adds 0.25 points. A 25% rise of 24% is 6 points.<\/p>"}, {"text": "32%", "explanation": "<p>Check: 24 × 1.25 = 30.<\/p>"}], "hints": ["'Rose by 25%' = multiply the share by 1.25.", "24 × 1.25 = ?"], "solution": ["24% × 1.25 = <strong>30%<\/strong> (an increase of 6 percentage points)."]}, {"id": "start-L0-001", "module": "start", "level": "L0", "concept": "test-format", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "baneth2023", "loc": "p33", "note": "scoring of the reasoning tests"}, "stem": "<p>Which of the three reasoning tests is expected to count towards your <strong>ranking<\/strong>, and not only as pass/fail? <em>(TO VERIFY on the EPSO website)<\/em><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Verbal reasoning", "explanation": "<p>Yes. According to the information available so far, verbal reasoning has its own pass mark <strong>and<\/strong> its score is used to rank candidates. That is why the plan gives verbal as much time as numerical.<\/p>"}, {"text": "Numerical reasoning", "explanation": "<p>Not quite. Numerical is expected to be pass/fail only, combined with abstract. You need enough points, but a higher numerical score does not move you up the ranking.<\/p>"}, {"text": "Abstract reasoning", "explanation": "<p>Not quite. Abstract is expected to be pass/fail only, sharing a pass mark with numerical.<\/p>"}, {"text": "None of them — all three are only pass/fail", "explanation": "<p>That was true for some older competitions, but for this one verbal is expected to count towards the ranking too.<\/p>"}], "hints": ["Think about which test the guide said deserves <em>at least as much<\/em> practice as numerical.", "It is the test about reading short texts."], "solution": ["Numerical and abstract share one pass/fail mark.", "Verbal has its own pass mark and is also used for the ranking.", "So the answer is <strong>verbal reasoning<\/strong> (to be confirmed in the notice)."]}, {"id": "start-L0-002", "module": "start", "level": "L0", "concept": "test-format", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "franco1", "loc": "p6", "note": "10 questions in 20 minutes"}, "stem": "<p>The numerical test is expected to have 10 questions in 20 minutes <em>(TO VERIFY)<\/em>. On average, how much time is that per question?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "2 minutes", "explanation": "<p>Right: 20 minutes ÷ 10 questions = 2 minutes each. Some questions will take 1 minute, others 3 — the average is what matters.<\/p>"}, {"text": "20 seconds", "explanation": "<p>That would be far too fast! 20 seconds per question is closer to the abstract test pace (10 questions in 10 minutes = 1 minute each).<\/p>"}, {"text": "1 minute", "explanation": "<p>That is the pace of the abstract test (10 questions in 10 minutes). Numerical gives you twice as long.<\/p>"}, {"text": "5 minutes", "explanation": "<p>That would be 50 minutes for 10 questions — much more than the 20 minutes available.<\/p>"}], "hints": ["Share the 20 minutes equally between the 10 questions.", "20 ÷ 10 = ?"], "solution": ["Total time: 20 minutes.", "Number of questions: 10.", "20 ÷ 10 = <strong>2 minutes per question<\/strong>."]}, {"id": "start-L0-003", "module": "start", "level": "L0", "concept": "combined-pass-mark", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p6", "note": "combined numerical + abstract pass mark (CAST)"}, "stem": "<p>Numerical and abstract share a pass mark of <strong>10 out of 20<\/strong> <em>(TO VERIFY)<\/em>. In a practice run you score <strong>3 out of 10<\/strong> in numerical. What is the minimum you need in abstract to pass?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "7 out of 10", "explanation": "<p>Exactly: 3 + 7 = 10, which reaches the combined pass mark. And 7 out of 10 in abstract is a realistic target with practice.<\/p>"}, {"text": "5 out of 10", "explanation": "<p>Not enough: 3 + 5 = 8, which is below 10. Each test does not need 5 on its own — it's the total that counts.<\/p>"}, {"text": "10 out of 10", "explanation": "<p>Good news: you don't need a perfect abstract score. 3 + 7 already makes 10.<\/p>"}, {"text": "It's impossible to pass with 3 in numerical", "explanation": "<p>Not at all — that's exactly the beauty of the combined pass mark. Abstract can make up the difference.<\/p>"}], "hints": ["The two scores are added together.", "What number added to 3 gives 10?"], "solution": ["You need 10 points in total.", "You already have 3 from numerical.", "10 − 3 = <strong>7<\/strong> points needed from abstract."]}, {"id": "start-L0-004", "module": "start", "level": "L0", "concept": "calm-toolkit", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "franco1", "loc": "p9", "note": "answer every question; no penalty for wrong answers (older competitions)"}, "stem": "<p>In the timed numerical test you have spent <strong>2 minutes<\/strong> on a question and still can't see how to solve it. What is the best thing to do?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Choose the most likely answer, flag the question, and move on", "explanation": "<p>Yes. A guess has a chance of being right, you protect your time for easier questions, and you can come back if time remains.<\/p>"}, {"text": "Keep going until you solve it — leaving it would be giving up", "explanation": "<p>Understandable, but costly: the next questions may be easier and worth exactly the same. Moving on is a strategy, not giving up.<\/p>"}, {"text": "Leave it blank and move on", "explanation": "<p>Moving on is right, but don't leave it blank. In earlier competitions a wrong answer cost nothing extra (TO VERIFY), so a guess is always better than nothing.<\/p>"}, {"text": "Start the test again from question 1 to calm down", "explanation": "<p>Going back to the start won't help the clock. A few slow breaths, a guess, and the next question is the calmer route.<\/p>"}], "hints": ["Think about the '2-minute rule' in the calm toolkit.", "Two things matter: not wasting time, and not leaving a blank."], "solution": ["After 2 minutes without a clear path, stop.", "Pick the answer that looks most plausible (a guess has a chance; a blank has none).", "Flag it so you can return if there is time, and go to the next question."]}, {"id": "ver-L0-001", "module": "verbal", "level": "L0", "concept": "verbal-format", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The regional museum will close for renovation from 1 May to 30 September. During this period, part of its collection will be shown in the city library. Guided tours of the library exhibition will be available on Saturdays.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The museum will be closed for about five months.", "explanation": "<p><strong>True.<\/strong> From 1 May to 30 September is five months.<\/p>"}, {"text": "The whole collection will move to the library.", "explanation": "<p><strong>False.<\/strong> Only <em>part<\/em> of the collection will be shown in the library.<\/p>"}, {"text": "Guided tours will be offered every day.", "explanation": "<p><strong>False.<\/strong> Tours are available on <em>Saturdays<\/em>.<\/p>"}, {"text": "The renovation is needed because the building is unsafe.", "explanation": "<p><strong>Cannot say.<\/strong> The passage gives no reason for the renovation.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Count the months from 1 May to 30 September."], "solution": ["A — True: From 1 May to 30 September is five months.", "B — False: Only <em>part<\/em> of the collection will be shown in the library.", "C — False: Tours are available on <em>Saturdays<\/em>.", "D — Cannot say: The passage gives no reason for the renovation.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L0-002", "module": "verbal", "level": "L0", "concept": "supported-by-text", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Since 2022, the airline has offered free drinking water on all its flights. Snacks are available on flights longer than two hours, for a fee. Passengers can also bring their own food on board.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Snacks are free on long flights.", "explanation": "<p><strong>False.<\/strong> Snacks are available <em>for a fee<\/em>.<\/p>"}, {"text": "On a three-hour flight, passengers can buy a snack.", "explanation": "<p><strong>True.<\/strong> Three hours is longer than two hours, and snacks are sold on those flights.<\/p>"}, {"text": "The airline started offering free water because of passenger complaints.", "explanation": "<p><strong>Cannot say.<\/strong> The passage says <em>since 2022<\/em>, but gives no reason.<\/p>"}, {"text": "Passengers may not bring drinks on board.", "explanation": "<p><strong>Cannot say.<\/strong> The passage only mentions bringing <em>food<\/em>; it says nothing about drinks.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement combines 'longer than two hours' with 'for a fee'?"], "solution": ["A — False: Snacks are available <em>for a fee<\/em>.", "B — True: Three hours is longer than two hours, and snacks are sold on those flights.", "C — Cannot say: The passage says <em>since 2022<\/em>, but gives no reason.", "D — Cannot say: The passage only mentions bringing <em>food<\/em>; it says nothing about drinks.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L0-003", "module": "verbal", "level": "L0", "concept": "supported-by-text", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The bakery on Elm Street opens at 7:00 every day except Monday. Its bread is baked on site each morning. Last year it won a regional prize for its rye bread.<\/p>\n<\/blockquote>\n<p><strong>Which statement can you NOT judge as true or false from the passage?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The bakery is closed on Mondays.", "explanation": "<p><strong>False — it is true.<\/strong> This one <strong>is<\/strong> supported: 'every day except Monday'. So it is not a 'cannot say' statement.<\/p>"}, {"text": "The bakery's rye bread is the best in the country.", "explanation": "<p><strong>Correct.<\/strong> This is the 'cannot say' statement: a <em>regional<\/em> prize doesn't tell us about the whole country — the passage can't confirm or deny it.<\/p>"}, {"text": "The bakery opens at 9:00 on Saturdays.", "explanation": "<p><strong>False — contradicted.<\/strong> The passage says 7:00 every day except Monday, so this is contradicted (false), not 'cannot say'.<\/p>"}, {"text": "The bread is baked somewhere else and delivered.", "explanation": "<p><strong>False — contradicted.<\/strong> The bread is 'baked on site', so this is contradicted (false), not 'cannot say'.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "A 'cannot say' statement is neither confirmed nor contradicted. Which one goes beyond what a regional prize tells us?"], "solution": ["A — False — it is true: This one <strong>is<\/strong> supported: 'every day except Monday'. So it is not a 'cannot say' statement.", "B — Correct: This is the 'cannot say' statement: a <em>regional<\/em> prize doesn't tell us about the whole country — the passage can't confirm or deny it.", "C — False — contradicted: The passage says 7:00 every day except Monday, so this is contradicted (false), not 'cannot say'.", "D — False — contradicted: The bread is 'baked on site', so this is contradicted (false), not 'cannot say'.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L1-001", "module": "verbal", "level": "L1", "concept": "key-words", "difficulty": 2, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The committee met on 12 March and agreed to publish its annual report in May. The report will cover the agency's activities in 2024 and will include, for the first time, a section on energy use.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The report will be published in March.", "explanation": "<p><strong>False.<\/strong> The committee <em>met<\/em> in March; the report will be published in <em>May<\/em>.<\/p>"}, {"text": "The report published in May will contain a section that earlier reports did not have.", "explanation": "<p><strong>True.<\/strong> 'For the first time' means earlier reports had no section on energy use.<\/p>"}, {"text": "The report will cover the agency's activities in 2023.", "explanation": "<p><strong>False.<\/strong> It covers <em>2024<\/em>.<\/p>"}, {"text": "The committee meets every March.", "explanation": "<p><strong>Cannot say.<\/strong> We only know about this one meeting on 12 March.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Check the key words <em>May<\/em>, <em>2024<\/em> and <em>for the first time<\/em>."], "solution": ["A — False: The committee <em>met<\/em> in March; the report will be published in <em>May<\/em>.", "B — True: 'For the first time' means earlier reports had no section on energy use.", "C — False: It covers <em>2024<\/em>.", "D — Cannot say: We only know about this one meeting on 12 March.", "Only <strong>B<\/strong> is supported by the passage."]}, {"id": "ver-L1-002", "module": "verbal", "level": "L1", "concept": "key-words", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Applicants must submit their forms by 15 October. Late applications will be accepted only if a medical certificate is attached. Results will be sent by email in December.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Applications received on 20 October will always be rejected.", "explanation": "<p><strong>False.<\/strong> Late applications <em>can<\/em> be accepted with a medical certificate.<\/p>"}, {"text": "Results will be sent by post in December.", "explanation": "<p><strong>False.<\/strong> Results are sent by <em>email<\/em>.<\/p>"}, {"text": "An applicant who sends the form on 18 October with a medical certificate may still be considered.", "explanation": "<p><strong>True.<\/strong> That is exactly the exception the passage describes.<\/p>"}, {"text": "Most applicants submit their forms early.", "explanation": "<p><strong>Cannot say.<\/strong> Nothing is said about when most applicants submit.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Look at the second sentence: what is the exception for late applications?"], "solution": ["A — False: Late applications <em>can<\/em> be accepted with a medical certificate.", "B — False: Results are sent by <em>email<\/em>.", "C — True: That is exactly the exception the passage describes.", "D — Cannot say: Nothing is said about when most applicants submit.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L1-003", "module": "verbal", "level": "L1", "concept": "qualifiers", "difficulty": 2, "kind": "practice", "answer": 2, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>Most of the town's residents support the new bike lanes, according to a survey of 800 people. Some shop owners, however, fear that fewer parking spaces will mean fewer customers.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "All residents support the bike lanes.", "explanation": "<p><strong>Cannot say.<\/strong> <em>Most<\/em> is not <em>all<\/em>.<\/p>"}, {"text": "No shop owners are in favour of the bike lanes.", "explanation": "<p><strong>Cannot say.<\/strong> We only know that <em>some<\/em> shop owners have fears; others may be in favour.<\/p>"}, {"text": "According to the survey, more than half of the residents support the bike lanes.", "explanation": "<p><strong>True.<\/strong> <em>Most<\/em> means more than half.<\/p>"}, {"text": "Shop owners' sales have fallen since the bike lanes opened.", "explanation": "<p><strong>Cannot say.<\/strong> Shop owners <em>fear<\/em> fewer customers; nothing says sales have actually fallen.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Compare the qualifiers: <em>most<\/em>, <em>all<\/em>, <em>some<\/em>, <em>no<\/em>."], "solution": ["A — Cannot say: <em>Most<\/em> is not <em>all<\/em>.", "B — Cannot say: We only know that <em>some<\/em> shop owners have fears; others may be in favour.", "C — True: <em>Most<\/em> means more than half.", "D — Cannot say: Shop owners <em>fear<\/em> fewer customers; nothing says sales have actually fallen.", "Only <strong>C<\/strong> is supported by the passage."]}, {"id": "ver-L1-004", "module": "verbal", "level": "L1", "concept": "qualifiers", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>The new medicine can reduce symptoms in many patients, but it does not work for everyone. Doctors usually prescribe it only after other treatments have failed.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "For some patients, the medicine does not help.", "explanation": "<p><strong>True.<\/strong> 'It does not work for everyone' means there are patients it does not help.<\/p>"}, {"text": "The medicine reduces symptoms in all patients.", "explanation": "<p><strong>False.<\/strong> It does <em>not<\/em> work for everyone.<\/p>"}, {"text": "Doctors never prescribe the medicine as a first treatment.", "explanation": "<p><strong>Cannot say.<\/strong> <em>Usually<\/em> after other treatments — so sometimes it may be prescribed first. <em>Never<\/em> is too strong.<\/p>"}, {"text": "The medicine has serious side effects.", "explanation": "<p><strong>Cannot say.<\/strong> Side effects are not mentioned.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Which statement matches 'not ... for everyone' without exaggerating?"], "solution": ["A — True: 'It does not work for everyone' means there are patients it does not help.", "B — False: It does <em>not<\/em> work for everyone.", "C — Cannot say: <em>Usually<\/em> after other treatments — so sometimes it may be prescribed first. <em>Never<\/em> is too strong.", "D — Cannot say: Side effects are not mentioned.", "Only <strong>A<\/strong> is supported by the passage."]}, {"id": "ver-L1-005", "module": "verbal", "level": "L1", "concept": "negations", "difficulty": 2, "kind": "practice", "answer": 3, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>It is not uncommon for spring storms to delay ferry services on the island. However, the ferry company has never cancelled a crossing for more than two days in a row.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Spring storms rarely delay the ferries.", "explanation": "<p><strong>False.<\/strong> 'Not uncommon' means fairly common — the opposite of rarely.<\/p>"}, {"text": "Ferry crossings have been cancelled for three days in a row.", "explanation": "<p><strong>False.<\/strong> Never for more than two days in a row.<\/p>"}, {"text": "The ferry company has never cancelled a crossing.", "explanation": "<p><strong>Cannot say.<\/strong> The passage only says cancellations never lasted <em>more than two days in a row<\/em> — cancellations of one or two days may have happened.<\/p>"}, {"text": "Storms in spring delay ferry services fairly often.", "explanation": "<p><strong>True.<\/strong> 'Not uncommon' = fairly common.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "Rewrite 'not uncommon' without the two negatives."], "solution": ["A — False: 'Not uncommon' means fairly common — the opposite of rarely.", "B — False: Never for more than two days in a row.", "C — Cannot say: The passage only says cancellations never lasted <em>more than two days in a row<\/em> — cancellations of one or two days may have happened.", "D — True: 'Not uncommon' = fairly common.", "Only <strong>D<\/strong> is supported by the passage."]}, {"id": "ver-L1-006", "module": "verbal", "level": "L1", "concept": "negations", "difficulty": 2, "kind": "practice", "answer": 1, "time_s": 90, "source": {"short": "baneth2023", "loc": "p48", "note": "style of EPSO verbal reasoning items"}, "stem": "<blockquote>\n<p>None of the three proposals received a majority in the first vote. The chair did not rule out a second vote, but no date has been set.<\/p>\n<\/blockquote>\n<p><strong>Which of the following statements is correct?<\/strong><\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "One proposal received a majority in the first vote.", "explanation": "<p><strong>False.<\/strong> <em>None<\/em> of the three did.<\/p>"}, {"text": "A second vote is still possible.", "explanation": "<p><strong>True.<\/strong> 'Did not rule out' means it remains possible.<\/p>"}, {"text": "The chair has announced the date of the second vote.", "explanation": "<p><strong>False.<\/strong> <em>No date has been set.<\/em><\/p>"}, {"text": "The chair refused to hold a second vote.", "explanation": "<p><strong>False.<\/strong> The chair <em>did not rule out<\/em> a second vote.<\/p>"}], "hints": ["Take the statements one at a time. For each, find its key words in the passage — can you point to the sentence that proves it?", "What does 'did not rule out' mean?"], "solution": ["A — False: <em>None<\/em> of the three did.", "B — True: 'Did not rule out' means it remains possible.", "C — False: <em>No date has been set.<\/em>", "D — False: The chair <e
