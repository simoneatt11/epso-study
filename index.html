small dots (position), the black dot (colour).", "Only option <strong>A<\/strong> satisfies every rule."]}, {"id": "dig-L0-001", "module": "digital", "level": "L0", "concept": "digital-basics", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p406", "note": "cybersecurity basics"}, "stem": "<p>You receive an email that looks like it comes from your bank, asking you to 'confirm your password' through a link. What is the safest action?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Don't click; contact the bank through its official website or phone number", "explanation": "<p>Correct. This is a typical phishing message. Banks don't ask for passwords by email.<\/p>"}, {"text": "Click the link but check that the page has the bank's logo", "explanation": "<p>Logos can be copied in seconds — the page can still be fake.<\/p>"}, {"text": "Reply to the email to ask whether it is genuine", "explanation": "<p>The reply goes to the attacker.<\/p>"}, {"text": "Forward it to colleagues to warn them", "explanation": "<p>Warning people is good, but the first step is not to use the link; report it through official channels.<\/p>"}], "hints": ["Would a real bank ask for your password by email?", "Use a channel you already trust, not the one in the message."], "solution": ["Recognise phishing: urgent request + link + password.", "Don't click; verify through the official website or phone."]}, {"id": "dig-L0-002", "module": "digital", "level": "L0", "concept": "digital-basics", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p406", "note": "cybersecurity basics"}, "stem": "<p>What does <strong>multi-factor authentication (MFA)<\/strong> add to a login?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "A second proof of identity, such as a code from an app, besides the password", "explanation": "<p>Correct. Even if someone steals the password, they still need the second factor.<\/p>"}, {"text": "A longer password", "explanation": "<p>Longer passwords help, but MFA is a <em>separate<\/em> extra check.<\/p>"}, {"text": "Automatic saving of your password in the browser", "explanation": "<p>That's password saving, not MFA.<\/p>"}, {"text": "A faster login without any password", "explanation": "<p>MFA adds a step; it doesn't remove the password.<\/p>"}], "hints": ["'Multi' = more than one.", "Something you know + something you have."], "solution": ["MFA = password + another factor (app code, key, fingerprint)."]}, {"id": "ess-L0-001", "module": "essay", "level": "L0", "concept": "essay-basics", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p401", "note": "focus on the core questions"}, "stem": "<p>You have 40 minutes for a written answer. What is the best first step?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Spend about 5 minutes understanding the question and planning your main points", "explanation": "<p>Correct. A short plan saves time and keeps the text focused.<\/p>"}, {"text": "Start writing immediately to use all the time", "explanation": "<p>Without a plan, texts tend to wander away from the question.<\/p>"}, {"text": "Write the conclusion first", "explanation": "<p>The conclusion comes from your plan — plan first.<\/p>"}, {"text": "Copy the question into your answer several times", "explanation": "<p>Repeating the question doesn't answer it.<\/p>"}], "hints": ["What do markers look for first?", "A focused answer starts with a plan."], "solution": ["Read and underline the question.", "Plan 3 points + conclusion (≈5 min).", "Then write, then check."]}, {"id": "ess-L0-002", "module": "essay", "level": "L0", "concept": "essay-basics", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p401", "note": "the trap of answering a different question"}, "stem": "<p>The background documents for a written test mention an interesting side issue that is not part of the question. What should you do?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Stay focused on the question asked; mention the side issue only if it helps your answer", "explanation": "<p>Correct. Background material sometimes contains distractions — markers reward answering the actual question.<\/p>"}, {"text": "Write a separate section about the side issue to show extra knowledge", "explanation": "<p>This is the trap: it uses time and words without answering the question.<\/p>"}, {"text": "Ignore all the background documents", "explanation": "<p>Use them — they contain what you need. Stay on the question.<\/p>"}, {"text": "Answer only the side issue, since it's more interesting", "explanation": "<p>Markers assess the question asked.<\/p>"}], "hints": ["What is the main thing markers check?", "Is the side issue part of the question?"], "solution": ["Re-read the question.", "Use the material that answers it; leave the rest."]}, {"id": "eu-L0-001", "module": "eu-knowledge", "level": "L0", "concept": "eu-institutions", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p415", "note": "the EU knowledge test"}, "stem": "<p>Which EU institution <strong>proposes<\/strong> new EU laws?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The European Commission", "explanation": "<p>Correct. The Commission has the right of initiative: it proposes laws, which the Parliament and the Council then adopt.<\/p>"}, {"text": "The European Council", "explanation": "<p>The European Council sets the overall political direction but does not adopt or propose laws.<\/p>"}, {"text": "The Court of Justice of the EU", "explanation": "<p>The Court interprets EU law; it does not propose it.<\/p>"}, {"text": "The European Central Bank", "explanation": "<p>The ECB runs monetary policy for the euro area.<\/p>"}], "hints": ["Think of the institution that also checks EU law is applied.", "Its members are Commissioners."], "solution": ["The European Commission proposes laws.", "Parliament and Council adopt them."]}, {"id": "eu-L0-002", "module": "eu-knowledge", "level": "L0", "concept": "eu-institutions", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 30, "source": {"short": "baneth2023", "loc": "p415", "note": "the EU knowledge test"}, "stem": "<p>Which body brings together the <strong>heads of state or government<\/strong> of the EU member states?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "The Council of the EU", "explanation": "<p>The Council of the EU brings together <strong>ministers<\/strong>, by policy area — not the heads of state or government.<\/p>"}, {"text": "The European Council", "explanation": "<p>Correct. It consists of the heads of state or government, its President and the Commission President.<\/p>"}, {"text": "The Council of Europe", "explanation": "<p>The Council of Europe is a separate organisation, not an EU institution.<\/p>"}, {"text": "The European Parliament", "explanation": "<p>The Parliament's members are elected directly by citizens.<\/p>"}], "hints": ["Two names are very similar — read them carefully.", "Ministers ≠ heads of state or government."], "solution": ["European Council = heads of state or government.", "Council of the EU = ministers.", "Council of Europe = a different organisation."]}, {"id": "exam-L0-001", "module": "exam", "level": "L0", "concept": "tech-check", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p45", "note": "be proactive and prepared"}, "stem": "<p>Your remote test is tomorrow morning (TO VERIFY that yours is remote). Your computer shows a notice: <strong>'Updates available — restart now?'<\/strong> What is the best moment to install them?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Today, then restart and check that everything still works", "explanation": "<p>Yes. Install today, restart, run any system check again — and then leave the setup alone.<\/p>"}, {"text": "Tomorrow morning, right before logging in", "explanation": "<p>Risky: updates can take a long time or change settings right when you need the computer.<\/p>"}, {"text": "During the test, if the notice appears again", "explanation": "<p>Never during the test — postpone any prompt that appears.<\/p>"}, {"text": "Never — updates are not important", "explanation": "<p>Security updates matter; the point is only to avoid installing them at the last minute.<\/p>"}], "hints": ["Think about what could go wrong if an update runs at the worst time.", "When can you still fix a problem calmly?"], "solution": ["Updates can take long or change settings.", "Do them the day before, restart, check again.", "Then don't touch the setup."]}, {"id": "exam-L0-002", "module": "exam", "level": "L0", "concept": "panic-plan", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p45", "note": "preparation and mindset"}, "stem": "<p>Halfway through the numerical test your mind goes blank on a question and you feel your heart racing. What should you do first?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "Stop for a moment, take a few slow 'box' breaths, then decide: answer or guess and flag", "explanation": "<p>Yes — the 20-second reset. It costs almost no time and gives you back control.<\/p>"}, {"text": "Keep staring at the question until the answer comes", "explanation": "<p>Panic makes thinking harder, not easier. Reset first.<\/p>"}, {"text": "Count how many questions you've probably got wrong so far", "explanation": "<p>Guessing your score during the test only adds pressure — and you can't know it anyway.<\/p>"}, {"text": "Close the test and start again later", "explanation": "<p>That may not be possible, and you could lose the attempt. Reset and continue.<\/p>"}], "hints": ["Remember the '20-second reset' in this module.", "Body first (breathing), then a decision."], "solution": ["Stop and breathe (4-4-4-4).", "'One question. This one only.'", "Answer or guess-and-flag, then move on."]}, {"id": "num-L0-001", "module": "numerical", "level": "L0", "concept": "place-value", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "baneth2023", "loc": "p133", "note": "basic number skills"}, "stem": "<p>Which number is <strong>two million, forty thousand<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "2,040,000", "explanation": "<p>Yes. Groups of three from the right: 2 | 040 | 000 → 2 million, 40 thousand, 0 units.<\/p>"}, {"text": "2,400,000", "explanation": "<p>This is two million, <strong>four hundred<\/strong> thousand. The thousands group should be 040, not 400.<\/p>"}, {"text": "240,000", "explanation": "<p>This is only two hundred and forty thousand — the millions group is missing. A million has 6 zeros, so the number needs 7 digits.<\/p>"}, {"text": "2,004,000", "explanation": "<p>This is two million, <strong>four<\/strong> thousand. Forty thousand is written 040 in the thousands group, not 004.<\/p>"}], "hints": ["Write the three groups: millions | thousands | units.", "Millions = 2, thousands = 40 (written with three digits: 040), units = 000."], "solution": ["Millions group: <strong>2<\/strong>.", "Thousands group: forty → <strong>040<\/strong> (always three digits).", "Units group: nothing → <strong>000<\/strong>.", "Put them together: <strong>2,040,000<\/strong>."]}, {"id": "num-L0-002", "module": "numerical", "level": "L0", "concept": "place-value", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 25, "source": {"short": "baneth2023", "loc": "p133", "note": "basic number skills"}, "stem": "<p>In the number <strong>7,358,210<\/strong>, what is the digit <strong>5<\/strong> worth?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "5,000", "explanation": "<p>One place too low. Count from the right: 0 units, 1 tens, 2 hundreds, 8 thousands, <strong>5 ten-thousands<\/strong>.<\/p>"}, {"text": "50,000", "explanation": "<p>Correct. The 5 is in the ten-thousands place, so it is worth 5 × 10,000 = 50,000.<\/p>"}, {"text": "500,000", "explanation": "<p>One place too high — that's where the 3 is (300,000).<\/p>"}, {"text": "5", "explanation": "<p>The digit is 5, but its <em>value<\/em> depends on its place. Here it sits in the ten-thousands place.<\/p>"}], "hints": ["Name each place from the right: units, tens, hundreds, thousands, ten-thousands…", "The 5 is the fifth digit from the right."], "solution": ["7,358,210 → from the right: 0 (units), 1 (tens), 2 (hundreds), 8 (thousands), <strong>5 (ten-thousands)<\/strong>, 3 (hundred-thousands), 7 (millions).", "So the 5 is worth 5 × 10,000 = <strong>50,000<\/strong>."]}, {"id": "num-L0-003", "module": "numerical", "level": "L0", "concept": "decimals", "difficulty": 1, "kind": "practice", "answer": 3, "time_s": 25, "source": {"short": "franco2", "loc": "s6", "note": "number sense review"}, "stem": "<p>Which of these numbers is the <strong>largest<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "0.5", "explanation": "<p>Close! 0.5 = 0.50, but 0.55 is bigger (55 hundredths &gt; 50 hundredths).<\/p>"}, {"text": "0.45", "explanation": "<p>0.45 = 45 hundredths — smaller than 0.50 and 0.55.<\/p>"}, {"text": "0.405", "explanation": "<p>This one has the most digits, which makes it <em>look<\/em> big — but 0.405 = 405 thousandths, smaller than 0.500. More digits ≠ bigger.<\/p>"}, {"text": "0.55", "explanation": "<p>Yes. Write all of them with three decimals: 0.500, 0.450, 0.405, <strong>0.550<\/strong>. The largest is 0.550.<\/p>"}], "hints": ["Give all the numbers the same number of decimal places by adding zeros at the end.", "Compare 0.500, 0.450, 0.405 and 0.550 as if they were 500, 450, 405, 550."], "solution": ["Pad with zeros: 0.500, 0.450, 0.405, 0.550.", "Compare as whole numbers: 500, 450, 405, 550.", "The largest is 550 → <strong>0.55<\/strong>."]}, {"id": "num-L0-004", "module": "numerical", "level": "L0", "concept": "decimals", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p134", "note": "computation questions"}, "stem": "<p>You buy a notebook for <strong>€2.40<\/strong> and a pen for <strong>€1.75<\/strong>. How much do you pay in total?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€4.15", "explanation": "<p>Correct. 2.40 + 1.75: cents 40 + 75 = 115 cents = €1.15; euros 2 + 1 = 3; total €4.15.<\/p>"}, {"text": "€3.15", "explanation": "<p>The cents add up to more than one euro (40 + 75 = 115 cents). That extra euro must be carried over: 3 + 1 = 4.<\/p>"}, {"text": "€4.05", "explanation": "<p>Almost — check the cents: 40 + 75 = 115, so you keep 15 cents, not 05.<\/p>"}, {"text": "€4.25", "explanation": "<p>Check the cents again: 40 + 75 = 115 → 15 cents left after carrying one euro.<\/p>"}], "hints": ["Add the euros and the cents separately.", "40 cents + 75 cents is more than 100 cents — that makes one extra euro."], "solution": ["Cents: 40 + 75 = 115 cents = €1 and 15 cents.", "Euros: 2 + 1 = 3, plus the extra 1 = 4.", "Total: <strong>€4.15<\/strong>."]}, {"id": "num-L0-005", "module": "numerical", "level": "L0", "concept": "decimals", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 20, "source": {"short": "franco1", "loc": "p9", "note": "percentages rely on × and ÷ by 100"}, "stem": "<p>What is <strong>0.07 × 100<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "0.7", "explanation": "<p>That's 0.07 × 10 — the point moved only one place. × 100 moves it two places.<\/p>"}, {"text": "7", "explanation": "<p>Yes. × 100 moves the decimal point two places to the right: 0.07 → 0.7 → 7.<\/p>"}, {"text": "70", "explanation": "<p>That would be three places (× 1,000). × 100 means two places.<\/p>"}, {"text": "0.0007", "explanation": "<p>That's dividing by 100 (point moved left). Multiplying makes the number bigger, so the point moves right.<\/p>"}], "hints": ["× 100 → move the decimal point 2 places to the right.", "0.07 → one step: 0.7 → two steps: …"], "solution": ["Multiplying by 100 moves the point two places right.", "0.07 → 0.7 (one place) → <strong>7<\/strong> (two places)."]}, {"id": "num-L0-006", "module": "numerical", "level": "L0", "concept": "rounding", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 25, "source": {"short": "baneth2023", "loc": "p135", "note": "rounding to simplify before calculating"}, "stem": "<p>Round <strong>82,451<\/strong> to the nearest <strong>thousand<\/strong>.<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "82,000", "explanation": "<p>Correct. The thousands digit is 2; the next digit (hundreds) is 4, which is less than 5, so round down.<\/p>"}, {"text": "83,000", "explanation": "<p>You rounded up, but the deciding digit is the hundreds digit, <strong>4<\/strong> — less than 5, so round down.<\/p>"}, {"text": "82,500", "explanation": "<p>That's rounding to the nearest <em>five hundred<\/em>. To the nearest thousand, the answer must end in 000.<\/p>"}, {"text": "80,000", "explanation": "<p>That's rounding to the nearest <em>ten<\/em> thousand. We want the nearest thousand.<\/p>"}], "hints": ["Find the thousands digit, then look at the digit immediately to its right.", "The digit to the right of the 2 is 4. Is it 5 or more?"], "solution": ["Thousands digit: 82,451 → the <strong>2<\/strong>.", "Next digit: <strong>4<\/strong> (hundreds).", "4 is less than 5 → round down: keep 82 and set the rest to zero → <strong>82,000<\/strong>."]}, {"id": "num-L0-007", "module": "numerical", "level": "L0", "concept": "rounding", "difficulty": 2, "kind": "practice", "answer": 1, "time_s": 25, "source": {"short": "franco2", "loc": "s29", "note": "decimals and rounding"}, "stem": "<p>Round <strong>0.6666<\/strong> to <strong>two decimal places<\/strong>.<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "0.66", "explanation": "<p>You cut the number off instead of rounding it. The third decimal is 6 (5 or more), so the second decimal goes up: 0.67.<\/p>"}, {"text": "0.67", "explanation": "<p>Yes. Keep two decimals (0.66|66); the next digit is 6, so round up → 0.67.<\/p>"}, {"text": "0.7", "explanation": "<p>That's one decimal place. The question asks for two.<\/p>"}, {"text": "0.6667", "explanation": "<p>That's four decimal places. Two decimal places means two digits after the point.<\/p>"}], "hints": ["Two decimal places = keep two digits after the point: 0.66…", "Look at the third digit after the point to decide."], "solution": ["Keep two decimals: 0.66 | 66.", "The next digit is 6 → 5 or more → round up.", "0.66 becomes <strong>0.67<\/strong>."]}, {"id": "num-L0-008", "module": "numerical", "level": "L0", "concept": "operations", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 20, "source": {"short": "franco2", "loc": "s6", "note": "properties of operations"}, "stem": "<p>What is <strong>5 + 3 × 4<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "17", "explanation": "<p>Correct: multiplication first (3 × 4 = 12), then addition (5 + 12 = 17).<\/p>"}, {"text": "32", "explanation": "<p>This comes from going left to right: (5 + 3) × 4. The rule says × before +.<\/p>"}, {"text": "20", "explanation": "<p>Check the multiplication: 3 × 4 = 12, then 5 + 12 = 17.<\/p>"}, {"text": "12", "explanation": "<p>12 is only the 3 × 4 part — don't forget to add the 5.<\/p>"}], "hints": ["Which comes first: × or +?", "First 3 × 4, then add 5."], "solution": ["No brackets.", "Multiplication first: 3 × 4 = 12.", "Then addition: 5 + 12 = <strong>17<\/strong>."]}, {"id": "num-L0-009", "module": "numerical", "level": "L0", "concept": "operations", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p134", "note": "applied reasoning: turning a story into a calculation"}, "stem": "<p>A taxi charges <strong>€3<\/strong> to start the trip plus <strong>€2 per kilometre<\/strong>. How much does a <strong>6 km<\/strong> trip cost?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€15", "explanation": "<p>Yes: 3 + 2 × 6 = 3 + 12 = €15.<\/p>"}, {"text": "€30", "explanation": "<p>This is (3 + 2) × 6 — as if the €3 start fee were charged every kilometre. It is charged only once.<\/p>"}, {"text": "€11", "explanation": "<p>This is 3 + 2 + 6 — the kilometres were added instead of multiplied by the price per km.<\/p>"}, {"text": "€18", "explanation": "<p>This is 3 × 6. The price per kilometre is €2, and the €3 is a one-off fee.<\/p>"}], "hints": ["Split the cost into a one-off part and a per-kilometre part.", "Per-km part: 2 × 6. Then add the start fee."], "solution": ["Per-kilometre cost: €2 × 6 = €12.", "Add the start fee once: €12 + €3 = <strong>€15<\/strong>."]}, {"id": "num-L0-010", "module": "numerical", "level": "L0", "concept": "fractions", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p33", "note": "operating with fractions"}, "stem": "<p>What is <strong><span class=\"frac\"><span>2<\/span><span>5<\/span><\/span> of 350<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "140", "explanation": "<p>Correct: 350 ÷ 5 = 70 (one fifth), then 70 × 2 = 140.<\/p>"}, {"text": "175", "explanation": "<p>175 is half of 350 (<span class=\"frac\"><span>1<\/span><span>2<\/span><\/span>). <span class=\"frac\"><span>2<\/span><span>5<\/span><\/span> is a bit less than a half.<\/p>"}, {"text": "70", "explanation": "<p>70 is one fifth. You need <strong>two<\/strong> fifths: 70 × 2.<\/p>"}, {"text": "210", "explanation": "<p>210 is <span class=\"frac\"><span>3<\/span><span>5<\/span><\/span> of 350 (the part that is left over), not <span class=\"frac\"><span>2<\/span><span>5<\/span><\/span>.<\/p>"}], "hints": ["First find one fifth: divide by the denominator.", "One fifth of 350 is 70. How many fifths do you need?"], "solution": ["Denominator 5: 350 ÷ 5 = 70 → one fifth.", "Numerator 2: 70 × 2 = <strong>140<\/strong>."]}, {"id": "num-L0-011", "module": "numerical", "level": "L0", "concept": "fractions", "difficulty": 1, "kind": "practice", "answer": 2, "time_s": 25, "source": {"short": "franco1", "loc": "p34", "note": "equivalent fractions"}, "stem": "<p>Which fraction is <strong>equal to <span class=\"frac\"><span>1<\/span><span>2<\/span><\/span><\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "2/3", "explanation": "<p><span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> is more than a half: 2 of 3 parts. Half of 3 would be 1.5.<\/p>"}, {"text": "3/5", "explanation": "<p><span class=\"frac\"><span>3<\/span><span>5<\/span><\/span> is a little more than a half: half of 5 is 2.5, and 3 is more.<\/p>"}, {"text": "3/6", "explanation": "<p>Yes. 3 is exactly half of 6, and dividing top and bottom by 3 gives <span class=\"frac\"><span>1<\/span><span>2<\/span><\/span>.<\/p>"}, {"text": "4/6", "explanation": "<p>4 is more than half of 6. <span class=\"frac\"><span>4<\/span><span>6<\/span><\/span> simplifies to <span class=\"frac\"><span>2<\/span><span>3<\/span><\/span>.<\/p>"}], "hints": ["A fraction equals one half when the top is exactly half of the bottom.", "Half of 6 is 3."], "solution": ["For each option, check whether the top is half of the bottom.", "3 is half of 6 → <strong><span class=\"frac\"><span>3<\/span><span>6<\/span><\/span> = <span class=\"frac\"><span>1<\/span><span>2<\/span><\/span><\/strong>."]}, {"id": "num-L0-012", "module": "numerical", "level": "L0", "concept": "fractions", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 35, "source": {"short": "franco1", "loc": "p32", "note": "operating with fractions"}, "stem": "<p>A team has <strong>24<\/strong> members. <strong>18<\/strong> came to the meeting. What fraction came, in its <strong>simplest<\/strong> form?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "3/4", "explanation": "<p>Correct: <span class=\"frac\"><span>18<\/span><span>24<\/span><\/span>, divide top and bottom by 6 → <span class=\"frac\"><span>3<\/span><span>4<\/span><\/span>.<\/p>"}, {"text": "2/3", "explanation": "<p><span class=\"frac\"><span>2<\/span><span>3<\/span><\/span> of 24 is 16, not 18.<\/p>"}, {"text": "4/5", "explanation": "<p>Fifths don't fit: 24 can't be split into 5 equal whole groups. Start from <span class=\"frac\"><span>18<\/span><span>24<\/span><\/span> and simplify.<\/p>"}, {"text": "1/4", "explanation": "<p><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> is the part that did <strong>not<\/strong> come (6 of 24).<\/p>"}], "hints": ["Start with <span class=\"frac\"><span>18<\/span><span>24<\/span><\/span>: who came over the whole team.", "Find a number that divides both 18 and 24 (try 6)."], "solution": ["Fraction that came: <span class=\"frac\"><span>18<\/span><span>24<\/span><\/span>.", "18 ÷ 6 = 3 and 24 ÷ 6 = 4.", "Simplest form: <strong><span class=\"frac\"><span>3<\/span><span>4<\/span><\/span><\/strong>."]}, {"id": "num-L0-013", "module": "numerical", "level": "L0", "concept": "fraction-decimal", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 25, "source": {"short": "franco2", "loc": "s9", "note": "fractions to decimals"}, "stem": "<p>Write <strong><span class=\"frac\"><span>3<\/span><span>5<\/span><\/span><\/strong> as a decimal.<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "0.6", "explanation": "<p>Yes: 3 ÷ 5 = 0.6. (Check: <span class=\"frac\"><span>1<\/span><span>5<\/span><\/span> = 0.2, so three fifths = 0.6.)<\/p>"}, {"text": "0.35", "explanation": "<p>This puts the digits 3 and 5 after the point. A fraction is a division: 3 ÷ 5.<\/p>"}, {"text": "0.53", "explanation": "<p>This reverses the digits. Do the division: 3 ÷ 5.<\/p>"}, {"text": "1.67", "explanation": "<p>That's 5 ÷ 3 — the division the wrong way round. Top ÷ bottom: 3 ÷ 5.<\/p>"}], "hints": ["A fraction is top ÷ bottom.", "<span class=\"frac\"><span>1<\/span><span>5<\/span><\/span> = 0.2. How much are three of them?"], "solution": ["<span class=\"frac\"><span>3<\/span><span>5<\/span><\/span> = 3 ÷ 5.", "3 ÷ 5 = <strong>0.6<\/strong> (or: 3 × 0.2 = 0.6)."]}, {"id": "num-L0-014", "module": "numerical", "level": "L0", "concept": "fraction-decimal", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco2", "loc": "s9", "note": "table of common fractions"}, "stem": "<p>Which fraction is equal to <strong>0.125<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "1/8", "explanation": "<p>Correct: 1 ÷ 8 = 0.125. Worth remembering — it appears often.<\/p>"}, {"text": "1/4", "explanation": "<p><span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 0.25, which is twice 0.125.<\/p>"}, {"text": "12/5", "explanation": "<p>12 ÷ 5 = 2.4 — this only reuses the digits of 0.125. Instead, think: 0.125 = 125 thousandths.<\/p>"}, {"text": "1/12", "explanation": "<p>1 ÷ 12 ≈ 0.083, a bit smaller than 0.125.<\/p>"}], "hints": ["<span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = 0.25. What is half of a quarter?", "Half of 0.25 is 0.125."], "solution": ["0.25 = <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span>.", "0.125 is half of 0.25, so it is half of a quarter.", "Half of <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span> = <strong><span class=\"frac\"><span>1<\/span><span>8<\/span><\/span><\/strong>. Check: 1 ÷ 8 = 0.125 ✓."]}, {"id": "num-L0-015", "module": "numerical", "level": "L0", "concept": "calculator", "difficulty": 1, "kind": "practice", "answer": 1, "time_s": 25, "source": {"short": "baneth2023", "loc": "p136", "note": "mental calculation as a reality check"}, "stem": "<p>Before using the calculator, estimate: which result is <strong>plausible<\/strong> for <strong>2,480 × 0.25<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "62", "explanation": "<p>Too small by a factor of 10. × 0.25 is the same as taking a quarter: a quarter of about 2,500 is about 600.<\/p>"}, {"text": "620", "explanation": "<p>Yes. × 0.25 = one quarter. A quarter of 2,480 is 620 (2,400 ÷ 4 = 600, plus 80 ÷ 4 = 20).<\/p>"}, {"text": "6,200", "explanation": "<p>Multiplying by 0.25 (less than 1) must make the number <strong>smaller<\/strong> than 2,480. 6,200 is bigger — a decimal point slipped.<\/p>"}, {"text": "62,000", "explanation": "<p>Much bigger than 2,480 — impossible when you multiply by less than 1.<\/p>"}], "hints": ["Multiplying by a number smaller than 1 makes the result smaller.", "0.25 = <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span>. What is a quarter of 2,480?"], "solution": ["0.25 is <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span>, so × 0.25 means 'divide by 4'.", "2,480 ÷ 4 = <strong>620<\/strong>.", "620 is smaller than 2,480 ✓ — it makes sense."]}, {"id": "num-L0-016", "module": "numerical", "level": "L0", "concept": "calculator", "difficulty": 2, "kind": "practice", "answer": 1, "time_s": 30, "source": {"short": "baneth2023", "loc": "p134", "note": "estimation questions"}, "stem": "<p>You need <strong>4,815 ÷ 9.8<\/strong>. Without the calculator, which is the best estimate?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "≈ 49", "explanation": "<p>Too small by 10. Round: 4,815 ≈ 4,800 and 9.8 ≈ 10. 4,800 ÷ 10 = 480.<\/p>"}, {"text": "≈ 490", "explanation": "<p>Yes. 4,815 ≈ 4,800 and 9.8 ≈ 10, so about 480; dividing by slightly less than 10 gives slightly more → about 490. (Exact: 491.3.)<\/p>"}, {"text": "≈ 4,900", "explanation": "<p>Dividing by almost 10 makes the number about ten times smaller, not about the same size.<\/p>"}, {"text": "≈ 49,000", "explanation": "<p>That's what you'd get by multiplying by 10. Dividing makes the number smaller.<\/p>"}], "hints": ["Round both numbers to friendly values first.", "4,815 ≈ 4,800 and 9.8 ≈ 10. What is 4,800 ÷ 10?"], "solution": ["Round: 4,815 → 4,800; 9.8 → 10.", "4,800 ÷ 10 = 480.", "Because 9.8 is a bit less than 10, the true answer is a bit more than 480 → <strong>≈ 490<\/strong> (exact 491.3)."]}, {"id": "num-L1-001", "module": "numerical", "level": "L1", "concept": "percent-of", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 25, "source": {"short": "franco1", "loc": "p9", "note": "applying a percentage to a number"}, "stem": "<p>What is <strong>30% of 150<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "45", "explanation": "<p>Correct: 30% = 0.30 and 150 × 0.30 = 45. (Or: 10% = 15, so 30% = 3 × 15 = 45.)<\/p>"}, {"text": "50", "explanation": "<p>50 is one third of 150 (33.3%), a little more than 30%.<\/p>"}, {"text": "4.5", "explanation": "<p>The decimal point slipped: 30% = 0.30, not 0.03. 150 × 0.30 = 45.<\/p>"}, {"text": "105", "explanation": "<p>105 is what is <strong>left<\/strong> after taking 30% away (150 − 45). The question asks for the 30% itself.<\/p>"}], "hints": ["Turn 30% into a decimal: 30 ÷ 100.", "Or find 10% first (divide by 10), then triple it."], "solution": ["10% of 150 = 15.", "30% = 3 × 10% = 3 × 15 = <strong>45<\/strong>."]}, {"id": "num-L1-002", "module": "numerical", "level": "L1", "concept": "percent-of", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "baneth2023", "loc": "p160", "note": "per capita / percentage warm-up style"}, "stem": "<p>A country has <strong>8.5 million<\/strong> inhabitants. <strong>12%<\/strong> of them are over 75. How many people is that?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "1.02 million", "explanation": "<p>Yes: 8.5 × 0.12 = 1.02, and the unit stays 'million'. That's 1,020,000 people.<\/p>"}, {"text": "0.71 million", "explanation": "<p>This is 8.5 ÷ 12 — dividing instead of multiplying by 0.12.<\/p>"}, {"text": "10.2 million", "explanation": "<p>More than the whole population — impossible for 12%. The decimal point moved one place too far.<\/p>"}, {"text": "1.2 million", "explanation": "<p>Close, but 1.2 million would be about 14%. 8.5 × 0.12 = 1.02 exactly.<\/p>"}], "hints": ["Keep the numbers in millions: work with 8.5 and put 'million' back at the end.", "12% = 0.12. Multiply 8.5 by 0.12."], "solution": ["12% = 0.12.", "8.5 × 0.12 = 1.02.", "The unit is still millions → <strong>1.02 million<\/strong> people (1,020,000)."]}, {"id": "num-L1-003", "module": "numerical", "level": "L1", "concept": "percent-of", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p9", "note": "percentage calculations"}, "stem": "<p><strong>18<\/strong> of the <strong>72<\/strong> people in an office cycle to work. What percentage is that?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "25%", "explanation": "<p>Correct: 18 ÷ 72 = 0.25 → 25%. (18 is a quarter of 72.)<\/p>"}, {"text": "18%", "explanation": "<p>18 is the number of people, not the percentage. The percentage depends on the total (72).<\/p>"}, {"text": "40%", "explanation": "<p>This is 72 ÷ 18 = 4, read as '40%'. Divide the part by the whole: 18 ÷ 72.<\/p>"}, {"text": "4%", "explanation": "<p>72 ÷ 18 = 4 — the division is upside down. Part ÷ whole: 18 ÷ 72 = 0.25.<\/p>"}], "hints": ["Percentage = part ÷ whole × 100.", "Is 18 a half, a third, a quarter… of 72?"], "solution": ["Part ÷ whole = 18 ÷ 72 = 0.25.", "0.25 × 100 = <strong>25%<\/strong>."]}, {"id": "num-L1-004", "module": "numerical", "level": "L1", "concept": "whole-from-part", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 35, "source": {"short": "franco1", "loc": "p53", "note": "rule of three to find a total"}, "stem": "<p><strong>45<\/strong> is <strong>15%<\/strong> of what number?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "300", "explanation": "<p>Yes: 45 ÷ 0.15 = 300. Check: 15% of 300 = 45 ✓.<\/p>"}, {"text": "675", "explanation": "<p>This is 45 × 15. When looking for the whole, divide by the percentage (as a decimal).<\/p>"}, {"text": "60", "explanation": "<p>This adds 45 + 15. 15% is a small share, so the whole must be much bigger than 45.<\/p>"}, {"text": "6.75", "explanation": "<p>This is 15% <strong>of<\/strong> 45 (45 × 0.15). The question is the reverse: 45 is 15% of something.<\/p>"}], "hints": ["You know the part (45) and its percentage (15%). The whole is part ÷ percentage.", "45 ÷ 0.15 — or: if 15% is 45, then 5% is 15, and 100% is 20 × 15."], "solution": ["Whole = part ÷ percentage = 45 ÷ 0.15.", "45 ÷ 0.15 = <strong>300<\/strong>.", "Check: 300 × 0.15 = 45 ✓."]}, {"id": "num-L1-005", "module": "numerical", "level": "L1", "concept": "whole-from-part", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "franco1", "loc": "p53", "note": "rule of three to find a total"}, "stem": "<p>In a city, <strong>9,600<\/strong> commuters cycle to work. They are <strong>12%<\/strong> of all commuters. How many commuters are there in total?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "80,000", "explanation": "<p>Correct: 9,600 ÷ 0.12 = 80,000. Check: 12% of 80,000 = 9,600 ✓.<\/p>"}, {"text": "1,152", "explanation": "<p>This is 12% of 9,600 (9,600 × 0.12). We need the opposite: the whole of which 9,600 is 12%.<\/p>"}, {"text": "8,000", "explanation": "<p>Smaller than the 9,600 cyclists — impossible, since the cyclists are only part of all commuters. A zero went missing.<\/p>"}, {"text": "115,200", "explanation": "<p>This is 9,600 × 12. Divide by 0.12 instead.<\/p>"}], "hints": ["Total = part ÷ percentage.", "9,600 ÷ 0.12. Tip: 9,600 ÷ 12 = 800, then × 100."], "solution": ["Rule of three: 12% ↔ 9,600; 100% ↔ ?", "? = 9,600 × 100 ÷ 12 = 960,000 ÷ 12 = <strong>80,000<\/strong>."]}, {"id": "num-L1-006", "module": "numerical", "level": "L1", "concept": "percent-change", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p9", "note": "percentage increase between two figures"}, "stem": "<p>A value goes from <strong>80<\/strong> to <strong>92<\/strong>. What is the percentage increase?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "15%", "explanation": "<p>Yes: change = 12; 12 ÷ 80 = 0.15 → 15%.<\/p>"}, {"text": "12%", "explanation": "<p>12 is the change in units, not in percent. Divide it by the old value: 12 ÷ 80.<\/p>"}, {"text": "13%", "explanation": "<p>This divides by the new value (12 ÷ 92 ≈ 13%). Always divide by where you <strong>started<\/strong>: 80.<\/p>"}, {"text": "87%", "explanation": "<p>80 ÷ 92 ≈ 0.87 — this compares the two values, but it's not the change.<\/p>"}], "hints": ["First find the change: new − old.", "Then divide the change by the <strong>old<\/strong> value (80)."], "solution": ["Change: 92 − 80 = 12.", "12 ÷ 80 = 0.15.", "0.15 × 100 = <strong>15% increase<\/strong>."]}, {"id": "num-L1-007", "module": "numerical", "level": "L1", "concept": "percent-change", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 35, "source": {"short": "franco1", "loc": "p10", "note": "conversion to the unit for decreases"}, "stem": "<p>A budget of <strong>€1,200<\/strong> is cut by <strong>35%<\/strong>. What is the new budget?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€780", "explanation": "<p>Correct: the multiplier is 1 − 0.35 = 0.65, and 1,200 × 0.65 = 780.<\/p>"}, {"text": "€420", "explanation": "<p>€420 is the <strong>cut<\/strong> itself (35% of 1,200). The new budget is what remains: 1,200 − 420.<\/p>"}, {"text": "€1,620", "explanation": "<p>This is an <em>increase<\/em> of 35%. A cut means the budget gets smaller.<\/p>"}, {"text": "€765", "explanation": "<p>Close — check the multiplication: 1,200 × 0.65 = 780.<\/p>"}], "hints": ["A 35% cut leaves 65% of the original.", "Multiplier: 1 − 0.35 = 0.65. Now 1,200 × 0.65."], "solution": ["Multiplier for −35%: 1 − 0.35 = 0.65.", "1,200 × 0.65 = <strong>€780<\/strong>.", "(Two-step way: 35% of 1,200 = 420; 1,200 − 420 = 780.)"]}, {"id": "num-L1-008", "module": "numerical", "level": "L1", "concept": "percent-change", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "franco1", "loc": "p10", "note": "finding the initial value from the final value"}, "stem": "<p>After a <strong>25%<\/strong> price rise, a ticket costs <strong>€150<\/strong>. What did it cost <strong>before<\/strong> the rise?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€120", "explanation": "<p>Correct: new = old × 1.25, so old = 150 ÷ 1.25 = 120. Check: 120 × 1.25 = 150 ✓.<\/p>"}, {"text": "€112.50", "explanation": "<p>This takes 25% off €150 (150 × 0.75). But the 25% was calculated on the <strong>old<\/strong> price, not on €150. Very common trap!<\/p>"}, {"text": "€125", "explanation": "<p>This subtracts 25 euros, not 25 percent.<\/p>"}, {"text": "€187.50", "explanation": "<p>This adds another 25% to €150. We need to go backwards, so divide by 1.25.<\/p>"}], "hints": ["Write it as: old price × 1.25 = 150.", "To undo × 1.25, divide by 1.25."], "solution": ["The rise means: old × 1.25 = 150.", "So old = 150 ÷ 1.25 = <strong>€120<\/strong>.", "Check: 120 + 25% of 120 = 120 + 30 = 150 ✓."]}, {"id": "num-L1-009", "module": "numerical", "level": "L1", "concept": "percent-change", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p9", "note": "percentage decrease"}, "stem": "<p>Sales fell from <strong>500<\/strong> units to <strong>400<\/strong> units. What is the percentage <strong>decrease<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "20%", "explanation": "<p>Yes: the fall is 100; 100 ÷ 500 = 0.20 → 20%.<\/p>"}, {"text": "25%", "explanation": "<p>This divides by the new value (100 ÷ 400). Percentage change always uses the <strong>old<\/strong> value: 500.<\/p>"}, {"text": "80%", "explanation": "<p>400 is 80% <strong>of<\/strong> 500 — that's what remains, not the decrease.<\/p>"}, {"text": "100%", "explanation": "<p>100 is the fall in units. A 100% decrease would mean sales dropped to zero.<\/p>"}], "hints": ["Change = 500 − 400.", "Divide the change by the starting value, 500."], "solution": ["Change: 500 − 400 = 100.", "100 ÷ 500 = 0.20.", "<strong>20% decrease<\/strong>."]}, {"id": "num-L1-010", "module": "numerical", "level": "L1", "concept": "percentage-points", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 25, "source": {"short": "franco1", "loc": "p23", "note": "difference between percentages and percentage points"}, "stem": "<p>Voter turnout rose from <strong>40%<\/strong> to <strong>50%<\/strong>. By how many <strong>percentage points<\/strong> did it rise?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "10 percentage points", "explanation": "<p>Correct: in percentage points you subtract: 50 − 40 = 10.<\/p>"}, {"text": "25 percentage points", "explanation": "<p>25 is the <strong>percentage change<\/strong> (10 ÷ 40 = 25%), not the difference in points.<\/p>"}, {"text": "20 percentage points", "explanation": "<p>Check the subtraction: 50 − 40 = 10.<\/p>"}, {"text": "50 percentage points", "explanation": "<p>50% is the new turnout, not the rise.<\/p>"}], "hints": ["'Percentage points' = the plain difference between two percentages.", "50 − 40 = ?"], "solution": ["Percentage points: new % − old %.", "50 − 40 = <strong>10 percentage points<\/strong>."]}, {"id": "num-L1-011", "module": "numerical", "level": "L1", "concept": "percentage-points", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p29", "note": "percentage points vs percentage change"}, "stem": "<p>Same situation: turnout rose from <strong>40%<\/strong> to <strong>50%<\/strong>. By what <strong>percentage<\/strong> did turnout rise?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "25%", "explanation": "<p>Yes: the change is 10 points; 10 ÷ 40 = 0.25 → a 25% rise.<\/p>"}, {"text": "10%", "explanation": "<p>10 is the rise in <strong>percentage points<\/strong>. The percentage rise compares the change with the starting value: 10 ÷ 40.<\/p>"}, {"text": "20%", "explanation": "<p>This divides by the new value (10 ÷ 50). Use the old value, 40.<\/p>"}, {"text": "50%", "explanation": "<p>50% is the new turnout level.<\/p>"}], "hints": ["Now we want the relative change: change ÷ old value.", "Change = 10, old value = 40."], "solution": ["Change: 50 − 40 = 10.", "Relative to the old value: 10 ÷ 40 = 0.25.", "<strong>25%<\/strong> rise."]}, {"id": "num-L1-012", "module": "numerical", "level": "L1", "concept": "percentage-points", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "franco1", "loc": "p30", "note": "percentage points exercises"}, "stem": "<p>A party's share of the vote went from <strong>12%<\/strong> to <strong>9%<\/strong>. Which statement is correct?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "a fall of 25% (and of 3 percentage points)", "explanation": "<p>Correct: 12 − 9 = 3 points; 3 ÷ 12 = 0.25 → its share fell by 25%.<\/p>"}, {"text": "a fall of 3% (and of 3 percentage points)", "explanation": "<p>3 is the fall in <strong>points<\/strong>. As a percentage of the starting share it is 3 ÷ 12 = 25%.<\/p>"}, {"text": "a fall of 33% (and of 3 percentage points)", "explanation": "<p>This divides by the new share (3 ÷ 9). Divide by the old share, 12.<\/p>"}, {"text": "a fall of 75% (and of 3 percentage points)", "explanation": "<p>9 is 75% <strong>of<\/strong> 12 — that's what remains, not the fall.<\/p>"}], "hints": ["The points part is the same in every option — focus on the percentage.", "Percentage change = (old − new) ÷ old."], "solution": ["In points: 12 − 9 = 3 percentage points.", "As a percentage: 3 ÷ 12 = 0.25 → <strong>25%<\/strong>."]}, {"id": "num-L1-013", "module": "numerical", "level": "L1", "concept": "ratios", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 35, "source": {"short": "baneth2023", "loc": "p180", "note": "ratio warm-up exercises"}, "stem": "<p><strong>€900<\/strong> is shared between two people in the ratio <strong>2 : 7<\/strong>. How much is the <strong>smaller<\/strong> share?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€200", "explanation": "<p>Correct: 2 + 7 = 9 parts; one part = 900 ÷ 9 = 100; the smaller share is 2 parts = €200.<\/p>"}, {"text": "€700", "explanation": "<p>€700 is the <strong>larger<\/strong> share (7 parts).<\/p>"}, {"text": "€450", "explanation": "<p>That's half — only correct for a 1 : 1 ratio.<\/p>"}, {"text": "€257.14", "explanation": "<p>This uses 900 × 2 ÷ 7, treating the share as <span class=\"frac\"><span>2<\/span><span>7<\/span><\/span>. The total has 2 + 7 = 9 parts, so the share is <span class=\"frac\"><span>2<\/span><span>9<\/span><\/span>.<\/p>"}], "hints": ["Add the parts: 2 + 7.", "One part is 900 ÷ 9. The smaller share has 2 parts."], "solution": ["Total parts: 2 + 7 = 9.", "One part: 900 ÷ 9 = €100.", "Smaller share: 2 × 100 = <strong>€200<\/strong> (larger: 7 × 100 = €700)."]}, {"id": "num-L1-014", "module": "numerical", "level": "L1", "concept": "ratios", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p181", "note": "ratios"}, "stem": "<p>The ratio of red to blue marbles is <strong>3 : 5<\/strong>. There are <strong>40<\/strong> blue marbles. How many red marbles are there?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "24", "explanation": "<p>Yes: 5 parts = 40, so 1 part = 8; red = 3 parts = 24.<\/p>"}, {"text": "15", "explanation": "<p>This is 3 × 5. Find the size of one part first: 40 ÷ 5 = 8.<\/p>"}, {"text": "64", "explanation": "<p>This is the <strong>total<\/strong> if 40 were 5 parts out of 8 (8 parts × 8). We want only the red ones: 3 parts.<\/p>"}, {"text": "8", "explanation": "<p>8 is the size of <strong>one<\/strong> part. Red has 3 parts.<\/p>"}], "hints": ["Blue is 5 parts and that's 40 marbles. How many marbles in one part?", "Then red = 3 parts."], "solution": ["5 parts = 40 → 1 part = 40 ÷ 5 = 8.", "Red = 3 parts = 3 × 8 = <strong>24<\/strong>."]}, {"id": "num-L1-015", "module": "numerical", "level": "L1", "concept": "ratios", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 35, "source": {"short": "baneth2023", "loc": "p180", "note": "ratios"}, "stem": "<p>In a class of <strong>36<\/strong> pupils, the ratio of girls to boys is <strong>4 : 5<\/strong>. How many girls are there?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "16", "explanation": "<p>Correct: 4 + 5 = 9 parts; one part = 36 ÷ 9 = 4; girls = 4 parts = 16.<\/p>"}, {"text": "20", "explanation": "<p>20 is the number of <strong>boys<\/strong> (5 parts).<\/p>"}, {"text": "29", "explanation": "<p>This treats the girls as <span class=\"frac\"><span>4<\/span><span>5<\/span><\/span> of 36. The whole class has 4 + 5 = 9 parts.<\/p>"}, {"text": "9", "explanation": "<p>9 is the number of parts, not pupils.<\/p>"}], "hints": ["How many parts in total? 4 + 5.", "One part = 36 ÷ 9."], "solution": ["Parts: 4 + 5 = 9.", "One part: 36 ÷ 9 = 4 pupils.", "Girls: 4 parts × 4 = <strong>16<\/strong> (boys: 20; check 16 + 20 = 36 ✓)."]}, {"id": "num-L1-016", "module": "numerical", "level": "L1", "concept": "percent-change", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 60, "source": {"short": "baneth2023", "loc": "p182", "note": "mixed ratio and percentage practice"}, "stem": "<p>A shop sells coffee and tea in the ratio <strong>3 : 1<\/strong>, <strong>400<\/strong> drinks a day in total. Next month tea sales rise by <strong>20%<\/strong> and coffee sales stay the same. How many drinks a day does the shop sell then?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "420", "explanation": "<p>Correct: tea = 1 part of 4 = 100 drinks; +20% → 120; coffee stays 300; total 420.<\/p>"}, {"text": "480", "explanation": "<p>This applies the 20% rise to <strong>all<\/strong> drinks (400 × 1.2). Only tea rises.<\/p>"}, {"text": "460", "explanation": "<p>This applies the rise to coffee (300 × 1.2 = 360) instead of tea.<\/p>"}, {"text": "426.67", "explanation": "<p>This treats tea as <span class=\"frac\"><span>1<\/span><span>3<\/span><\/span> of the total. The ratio 3 : 1 has 4 parts, so tea is <span class=\"frac\"><span>1<\/span><span>4<\/span><\/span>.<\/p>"}], "hints": ["First split 400 into coffee and tea using the ratio (4 parts).", "Tea = 100. What is 100 increased by 20%?"], "solution": ["Parts: 3 + 1 = 4; one part = 400 ÷ 4 = 100.", "Coffee = 300, tea = 100.", "Tea after +20%: 100 × 1.2 = 120.", "New total: 300 + 120 = <strong>420<\/strong>."]}, {"id": "num-L1-017", "module": "numerical", "level": "L1", "concept": "whole-from-part", "difficulty": 3, "kind": "practice", "answer": 0, "time_s": 60, "source": {"short": "franco1", "loc": "p10", "note": "initial value from final value"}, "stem": "<p>This year a charity raised <strong>€46,000<\/strong>, which is <strong>15% more<\/strong> than last year. How much did it raise last year?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€40,000", "explanation": "<p>Correct: last year × 1.15 = 46,000, so last year = 46,000 ÷ 1.15 = 40,000.<\/p>"}, {"text": "€39,100", "explanation": "<p>This takes 15% off €46,000 (× 0.85). The 15% was calculated on last year's amount, so divide by 1.15.<\/p>"}, {"text": "€52,900", "explanation": "<p>This adds another 15% (× 1.15). We need to go back in time, so divide.<\/p>"}, {"text": "€6,900", "explanation": "<p>That's 15% of €46,000 — only a part, not last year's total.<\/p>"}], "hints": ["Write it as: last year × 1.15 = 46,000.", "Undo the × 1.15 by dividing."], "solution": ["Last year × 1.15 = 46,000.", "Last year = 46,000 ÷ 1.15 = <strong>€40,000<\/strong>.", "Check: 40,000 × 1.15 = 46,000 ✓."]}, {"id": "num-L2-001", "module": "numerical", "level": "L2", "concept": "table-reading", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "franco1", "loc": "p7", "note": "systematic method: question, then data"}, "stem": "<p>How many people visited the <strong>City Art Museum<\/strong> in <strong>2023<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Visitors to three museums <span class=\"unit\">(in thousands)<\/span><\/caption><thead><tr><th scope='col'>Museum<\/th><th scope='col'>2021<\/th><th scope='col'>2022<\/th><th scope='col'>2023<\/th><\/tr><\/thead><tbody><tr><th scope='row'>City Art Museum<\/th><td>520<\/td><td>610<\/td><td>655<\/td><\/tr><tr><th scope='row'>Riverside Museum<\/th><td>300<\/td><td>386<\/td><td>412<\/td><\/tr><tr><th scope='row'>Hill Gallery<\/th><td>145<\/td><td>172<\/td><td>230<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "655,000", "explanation": "<p>Correct: the cell says 655 and the table is in thousands → 655 × 1,000 = 655,000.<\/p>"}, {"text": "655", "explanation": "<p>That's the number in the cell, but the table is <strong>in thousands<\/strong>. Multiply by 1,000.<\/p>"}, {"text": "610,000", "explanation": "<p>That's 2022 — one column to the left. Check the column heading.<\/p>"}, {"text": "6,550,000", "explanation": "<p>One zero too many: 655 thousand = 655 × 1,000 = 655,000.<\/p>"}], "hints": ["Find the row 'City Art Museum' and the column '2023'.", "Don't forget the unit under the title: in thousands."], "solution": ["Row City Art Museum × column 2023 → 655.", "Unit: thousands → 655 × 1,000 = <strong>655,000<\/strong> visitors."]}, {"id": "num-L2-002", "module": "numerical", "level": "L2", "concept": "table-reading", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "baneth2023", "loc": "p135", "note": "identify the relevant column first"}, "stem": "<p>By how many visitors did the <strong>Hill Gallery<\/strong> grow from <strong>2022 to 2023<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Visitors to three museums <span class=\"unit\">(in thousands)<\/span><\/caption><thead><tr><th scope='col'>Museum<\/th><th scope='col'>2021<\/th><th scope='col'>2022<\/th><th scope='col'>2023<\/th><\/tr><\/thead><tbody><tr><th scope='row'>City Art Museum<\/th><td>520<\/td><td>610<\/td><td>655<\/td><\/tr><tr><th scope='row'>Riverside Museum<\/th><td>300<\/td><td>386<\/td><td>412<\/td><\/tr><tr><th scope='row'>Hill Gallery<\/th><td>145<\/td><td>172<\/td><td>230<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "58,000", "explanation": "<p>Yes: 230 − 172 = 58 thousand = 58,000 visitors.<\/p>"}, {"text": "85,000", "explanation": "<p>This is 2021 → 2023 (230 − 145). The question asks 2022 → 2023.<\/p>"}, {"text": "58", "explanation": "<p>Right difference, but the table is in thousands: 58 thousand = 58,000.<\/p>"}, {"text": "27,000", "explanation": "<p>This is 2021 → 2022 (172 − 145). Check the years in the question.<\/p>"}], "hints": ["You need two cells from the Hill Gallery row: 2022 and 2023.", "Subtract, then apply 'in thousands'."], "solution": ["Hill Gallery 2022 = 172, 2023 = 230.", "230 − 172 = 58.", "In thousands → <strong>58,000<\/strong> visitors."]}, {"id": "num-L2-003", "module": "numerical", "level": "L2", "concept": "units", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 25, "source": {"short": "franco1", "loc": "p8", "note": "scales mixed between statement and data"}, "stem": "<p>A country's exports were <strong>€2.75 billion<\/strong>. How much is that in <strong>€ million<\/strong>?<\/p>", "table": "", "chart": "", ecimal point: 2,650 ÷ 1,000 = 2.65.<\/p>"}, {"text": "2,650 million tonnes", "explanation": "<p>2,650 is the total in <strong>thousand<\/strong> tonnes. The question asks for million tonnes: divide by 1,000.<\/p>"}], "hints": ["Add the four values first (they are in thousand tonnes).", "Then convert: 1,000 thousand = 1 million, so divide by 1,000."], "solution": ["Total: 1,480 + 760 + 245 + 165 = 2,650 thousand tonnes.", "Thousand → million: 2,650 ÷ 1,000 = <strong>2.65 million tonnes<\/strong>."]}, {"id": "num-L2-005", "module": "numerical", "level": "L2", "concept": "select-data", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 50, "source": {"short": "franco1", "loc": "p51", "note": "black out the data you don't need"}, "stem": "<p>How many more <strong>registered users<\/strong> did <strong>Denmark<\/strong> have than <strong>Belgium<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Public libraries, 2023<\/caption><thead><tr><th scope='col'>Country<\/th><th scope='col'>Libraries<\/th><th scope='col'>Books lent (million)<\/th><th scope='col'>Registered users (thousand)<\/th><th scope='col'>Users as % of population<\/th><\/tr><\/thead><tbody><tr><th scope='row'>Belgium<\/th><td>1,140<\/td><td>31.2<\/td><td>2,280<\/td><td>19.6<\/td><\/tr><tr><th scope='row'>Denmark<\/th><td>520<\/td><td>28.4<\/td><td>2,950<\/td><td>49.8<\/td><\/tr><tr><th scope='row'>Portugal<\/th><td>310<\/td><td>6.1<\/td><td>830<\/td><td>8.0<\/td><\/tr><tr><th scope='row'>Ireland<\/th><td>330<\/td><td>15.0<\/td><td>1,060<\/td><td>20.4<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "670,000", "explanation": "<p>Correct: 2,950 − 2,280 = 670 thousand = 670,000 users.<\/p>"}, {"text": "670", "explanation": "<p>Right subtraction, but the column is in thousands → 670,000.<\/p>"}, {"text": "6,700,000", "explanation": "<p>One zero too many: 670 thousand = 670,000.<\/p>"}, {"text": "1,890,00 /p>"}, {"text": "about 104 million", "explanation": "<p>Ten times too big — check the unit conversion (10,375 thousand = 10.4 million).<\/p>"}], "hints": ["The population isn't in the table directly — but users AND their % of the population are.", "830 thousand is 8% of the population. Whole = part ÷ percentage."], "solution": ["Relevant data: Portugal, 830 thousand users = 8.0% of the population.", "Population = 830 ÷ 0.08 = 10,375 thousand.", "10,375 thousand = 10.375 million ≈ <strong>10.4 million<\/strong>."]}, {"id": "num-L2-007", "module": "numerical", "level": "L2", "concept": "average", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "baneth2023", "loc": "p230", "note": "averages from table data"}, "stem": "<p>What was the <strong>average<\/strong> number of visitors per year to the <strong>City Art Museum<\/strong> over <strong>2021–2023<\/strong>?<\/p>", "table": "<div class='dtable'><table><caption>Visitors to three museums <span class=\"unit\">(in thousands)<\/span><\/caption><thead><tr><th scope='col'>Museum<\/th><th scope='col'>2021<\/th><th scope='col'>2022<\/th><th scope='col'>2023<\/th><\/tr><\/thead><tbody><tr><th scope='row'>City Art Museum<\/th><td>520<\/td><td>610<\/td><td>655<\/td><\/tr><tr><th scope='row'>Riverside Museum<\/th><td>300<\/td><td>386<\/td><td>412<\/td><\/tr><tr><th scope='row'>Hill Gallery<\/th><td>145<\/td><td>172<\/td><td>230<\/td><\/tr><\/tbody><\/table><p class='tnote'>Invented data for practice.<\/p><\/div>", "chart": "", "figure": "", "options": [{"text": "595,000", "explanation": "<p>Yes: (520 + 610 + 655) ÷ 3 = 1,785 ÷ 3 = 595 thousand.<\/p>"}, {"text": "610,000", "explanation": "<p>That's the middle year's value, not the average. Add all three and divide by 3.<\/p>"}, {"text": "1,785,000", "explanation": "<p>That's the <strong>total<\/strong> of the three years. The average divides it by 3.<\/p>"}, {"text": "587,500", "explanation": "<p>This averages only 2021 and 2023. The period 2021–2023 has three years.<\/p>"}], "hints": ["Average = total ÷ number of values.", "Three years: add 520, 610 and 655, then divide by 3."], "solution": ["Total: 520 + 610 + 655 = 1,785 (thousand).", "Average: 1,785 ÷ 3 = 595 (thousand).", "<strong>595,000<\/strong> visitors per year."]}, {"id": "num-L2-008", "module": "numerical", "level": "L2", "concept": "average", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 45, "source": {"short": "franco2", "loc": "s43", "note": "averages"}, "stem": "<p>The <strong>average<\/strong> of five numbers is <strong>30<\/strong>. Four of them are <strong>24, 35, 28 and 31<\/strong>. What is the <strong>fifth<\/strong> number?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "32", "explanation": "<p>Correct: total must be 5 × 30 = 150; the four known add to 118; 150 − 118 = 32.<\/p>"}, {"text": "30", "explanation": "<p>The fifth number doesn't have to equal the average — it has to make the total right.<\/p>"}, {"text": "29.5", "explanation": "<p>That's the average of the four known numbers. We need the number that brings the five-number average to 30.<\/p>"}, {"text": "118", "explanation": "<p>118 is the sum of the four known numbers.<\/p>"}], "hints": ["If 5 numbers average 30, what must their total be?", "Total 150. Subtract the four you know."], "solution": ["Total of all five: 5 × 30 = 150.", "Known four: 24 + 35 + 28 + 31 = 118.", "Fifth: 150 − 118 = <strong>32<\/strong>."]}, {"id": "num-L2-009", "module": "numerical", "level": "L2", "concept": "conversion", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 30, "source": {"short": "baneth2023", "loc": "p185", "note": "conversion exercises"}, "stem": "<p><strong>€1 = 0.85 British pounds (£)<\/strong>. How many pounds is <strong>€400<\/strong>?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "£340", "explanation": "<p>Yes: each euro is £0.85, so 400 × 0.85 = £340.<\/p>"}, {"text": "£470.59", "explanation": "<p>This divides 400 ÷ 0.85 — the wrong direction. One euro buys less than one pound, so you get fewer pounds than euros.<\/p>"}, {"text": "£3.40", "explanation": "<p>The decimal point slipped by two places: 400 × 0.85 = 340.<\/p>"}, {"text": "£400", "explanation": "<p>That would only be true if €1 = £1. The rate is 0.85.<\/p>"}], "hints": ["The rate says how many pounds you get for <strong>one<\/strong> euro.", "400 euros → 400 × 0.85 pounds."], "solution": ["€1 → £0.85.", "€400 → 400 × 0.85 = <strong>£340<\/strong>.", "Sanity check: fewer pounds than euros, since £1 is worth more than €1 ✓."]}, {"id": "num-L2-010", "module": "numerical", "level": "L2", "concept": "conversion", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "baneth2023", "loc": "p183", "note": "currency conversion"}, "stem": "<p><strong>€1 = 4.97 Romanian lei (RON)<\/strong>. A hotel costs <strong>745.50 RON<\/strong>. How much is that in euros?<\/p>", "table": "", "chart": "", "figure": "", "options": [{"text": "€150", "explanation": "<p>Correct: lei → euros means dividing by the rate: 745.50 ÷ 4.97 = 150.<\/p>"}, {"text": "€3,705.14", "explanation": "<p>This multiplies by 4.97 (euros → lei). We go from lei to euros, so divide.<\/p>"}, {"text": "€15", "explanation": "<p>Ten times too small — check the division: 745.5 ÷ 4.97 = 150.<\/p>"}, {"text": "€1,500", "explanation": "<p>Ten times too big. Estimate: 745 ÷ 5 ≈ 149.<\/p>"}], "hints": ["Each euro is about 5 lei. Should the euro amount be bigger or smaller than 745.50?", "Divide by the rate."], "solution": ["Estimate: 745 ÷ 5 ≈ 149 → about €150.", "Exact: 745.50 ÷ 4.97 = <strong>€150<\/strong>."]}, {"id": "num-L2-011", "module": "numerical", "level": "L2", "concept": "conversion", "difficulty": 2, "kind": "practice", "answer": 0, "time_s": 40, "source": {"short": "baneth2023", "loc": "p185", "note": "rate conversions"}, "stem": "<p>A car uses <strong>6 litres<\/strong> of fuel per <strong>100 km<\/strong>. How many litres do
