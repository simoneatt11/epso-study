\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><g transform=\"rotate(270 60 60)\" class=\"ab-arrow\"><line x1=\"60\" y1=\"96\" x2=\"60\" y2=\"30\"/><polygon points=\"60,24 54,33 66,33\" class=\"ab-b\"/><\/g><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><g transform=\"rotate(0 60 60)\" class=\"ab-arrow\"><line x1=\"60\" y1=\"96\" x2=\"60\" y2=\"30\"/><polygon points=\"60,24 54,33 66,33\" class=\"ab-b\"/><\/g><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><g transform=\"rotate(90 60 60)\" class=\"ab-arrow\"><line x1=\"60\" y1=\"96\" x2=\"60\" y2=\"30\"/><polygon points=\"60,24 54,33 66,33\" class=\"ab-b\"/><\/g><\/svg><span>next<\/span><\/div>\n<\/div>\n<p><strong>Colour<\/strong> — white → grey → black, then again:<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60\" cy=\"60\" r=\"34\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60\" cy=\"60\" r=\"34\" class=\"ab-g\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60\" cy=\"60\" r=\"34\" class=\"ab-b\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60\" cy=\"60\" r=\"34\" class=\"ab-w\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60\" cy=\"60\" r=\"34\" class=\"ab-g\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><circle cx=\"60\" cy=\"60\" r=\"34\" class=\"ab-b\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<p><strong>Shape<\/strong> — triangle → square → pentagon, then again:<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><polygon points=\"60.0,26.0 89.4,77.0 30.6,77.0\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><polygon points=\"84.0,36.0 84.0,84.0 36.0,84.0 36.0,36.0\" class=\"ab-w\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><polygon points=\"60.0,26.0 92.3,49.5 80.0,87.5 40.0,87.5 27.7,49.5\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><polygon points=\"60.0,26.0 89.4,77.0 30.6,77.0\" class=\"ab-w\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><polygon points=\"84.0,36.0 84.0,84.0 36.0,84.0 36.0,36.0\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><polygon points=\"60.0,26.0 92.3,49.5 80.0,87.5 40.0,87.5 27.7,49.5\" class=\"ab-w\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<p>(The green frame shows the correct next figure.)<\/p>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L0-001,abs-L0-002,abs-L0-003,abs-L0-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Looking at the whole picture at once.<\/strong> The eyes jump around and nothing seems to follow a pattern.\nInstead, look at <strong>one feature at a time<\/strong>: first only position, then only colour, and so on.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>In the real test you have about <strong>1 minute per question<\/strong> (TO VERIFY). These first ones should take you\n10–20 seconds each — that is the point: simple rules become instant.<\/p>\n<\/div>", "sections": [{"id": "features", "title": "Features: shape, colour, count, size, position, rotation"}], "override": false}, "abstract/L1": {"meta": {"module": "abstract", "level": "L1", "title": "One rule", "status": "draft", "introduces": ["single-rule"], "uses": ["features"], "source_refs": [{"short": "baneth2023", "loc": "p279", "note": "a rule like 'the circles move clockwise'; wrong options deliberately break a rule"}], "minutes": 30, "generated_at": "2026-10-14 07:15:00+00:00"}, "html": "<p>Now each series has <strong>one rule<\/strong>, but the figures also contain parts that <strong>don't change<\/strong> — they are\nthere to distract you. And the wrong answer options are built carefully: they follow the rule <em>almost<\/em>.<\/p>\n<h2 id=\"single-rule\">Series with one rule<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Find the one feature that changes, describe its rule <strong>in words<\/strong> (\"the dot moves two cells clockwise\"),\nthen apply it once more. Everything that does not change must stay exactly the same in the answer.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A clock's minute hand moves the same amount every minute. If you see 12:00, 12:15, 12:30, 12:45, you\nknow where it goes next — and you also know the hour hand's position barely matters to the pattern.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Two cells clockwise<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"100\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"60\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<ol>\n<li>Compare figure 1 and 2: the square in the middle stays the same. The <strong>dot<\/strong> moves.<\/li>\n<li>From the top to the right: that is <strong>two cells<\/strong> clockwise.<\/li>\n<li>Check with 2 → 3, 3 → 4, 4 → 5: always two cells clockwise. ✓<\/li>\n<li>Apply it once more from figure 5 — and keep the square unchanged.<\/li>\n<\/ol>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: How the wrong options are built<\/p>\n<p>Test writers take the correct answer and <strong>break one thing<\/strong>: the dot one cell too far, the arrow\nturned the wrong way, an extra dot, a different colour — or they repeat figure 5 unchanged. So when\ntwo options look almost the same, the difference between them is exactly the feature you must check.<\/p>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L1-001,abs-L1-002,abs-L1-003,abs-L1-004,abs-L1-005,abs-L1-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Forgetting the parts that don't move.<\/strong> An option can have the moving dot in the right place but the\nmiddle shape changed. A feature that is constant in the series must also be constant in the answer.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Say the rule in words, quietly, before looking at the options. \"One cell clockwise.\" Then the options\nare a simple check, not a puzzle.<\/p>\n<\/div>", "sections": [{"id": "single-rule", "title": "Series with one rule"}], "override": false}, "abstract/L2": {"meta": {"module": "abstract", "level": "L2", "title": "Two rules at once", "status": "draft", "introduces": ["two-rules"], "uses": ["features", "single-rule"], "source_refs": [{"short": "baneth2023", "loc": "p279", "note": "the number of rules sets the difficulty"}, {"short": "baneth2023", "loc": "p280", "note": "adding a second rule; eliminating options rule by rule"}], "minutes": 35, "generated_at": "2026-10-14 07:30:00+00:00"}, "html": "<p>Most real EPSO questions have <strong>two or three rules<\/strong> working at the same time. The rules don't\ninterfere with each other — so you solve them one by one.<\/p>\n<h2 id=\"two-rules\">Two independent rules<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>When more than one thing changes, treat each change as a <strong>separate rule<\/strong>. Find rule 1, eliminate the\noptions that break it. Then find rule 2 among the options left. Two small problems are much easier\nthan one big one.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Getting dressed for the weather: rule 1 — if it's cold, take a coat; rule 2 — if it rains, take an\numbrella. You check each rule separately, and both decide what you carry.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Position and colour<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"60\" r=\"15\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"60\" r=\"15\" class=\"ab-b\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"20\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"60\" r=\"15\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"60\" r=\"15\" class=\"ab-b\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"100\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"60\" r=\"15\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"100\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"60\" r=\"15\" class=\"ab-b\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<ol>\n<li><strong>Rule 1 — position:<\/strong> the black dot moves one cell clockwise each time.<\/li>\n<li><strong>Rule 2 — colour:<\/strong> the circle in the middle alternates white, black, white…<\/li>\n<li>The next figure: the dot one cell further clockwise <strong>and<\/strong> the circle in its next colour.<\/li>\n<li>With the options: first cross out every option where the dot is in the wrong cell; then, among those\n   left, cross out the wrong colour. One option remains.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L2-001,abs-L2-002,abs-L2-003,abs-L2-004,abs-L2-005\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Stopping after the first rule.<\/strong> If two options both satisfy rule 1, the question has a second rule —\nkeep looking until exactly one option is left.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Write the rules as short notes on your notepad: \"dot +1 cw\", \"circle W/B\". It takes five seconds and\nstops you from losing track.<\/p>\n<\/div>", "sections": [{"id": "two-rules", "title": "Two independent rules"}], "override": false}, "abstract/L3": {"meta": {"module": "abstract", "level": "L3", "title": "Tricky rules", "status": "draft", "introduces": ["alternation", "movement", "counting"], "uses": ["features", "single-rule", "two-rules"], "source_refs": [{"short": "baneth2023", "loc": "p280", "note": "shading that alternately takes one and two steps"}, {"short": "baneth2023", "loc": "p281", "note": "patterns and operations"}], "minutes": 45, "generated_at": "2026-10-14 07:45:00+00:00"}, "html": "<p>Some rules are designed to look irregular at first glance. Three families cover most of them.<\/p>\n<h2 id=\"alternation\">Alternation<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>In an <button type=\"button\" class=\"gl\" data-term=\"alternation\">alternation<\/button> the change is not always the same size: <strong>1 step, 2 steps, 1 step, 2 steps…<\/strong>, or\nsomething flips back and forth (left, right, left…). Look at the <strong>differences<\/strong> between figures, not\nat the figures themselves.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A walking pattern: short step, long step, short step, long step. Each step is different, but the\npattern of steps is perfectly regular.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: One step, two steps<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"100\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"100\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"60\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<ol>\n<li>Positions of the dot: top-left → top → right → bottom-right → bottom-left.<\/li>\n<li>Steps between them: <strong>1, 2, 1, 2<\/strong> cells clockwise.<\/li>\n<li>The next step is <strong>1<\/strong> cell: from bottom-left to left.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L3-001,abs-L3-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Deciding there is \"no rule\" because the steps are unequal. Write the step sizes down — the rhythm\nusually appears immediately.<\/p>\n<\/div>\n<h2 id=\"movement\">Movement around a grid<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Objects move around the outer cells of the grid, <button type=\"button\" class=\"gl\" data-term=\"clockwise\">clockwise<\/button> or anticlockwise. With <strong>two moving\nobjects<\/strong>, each has its own direction and speed. Follow them one at a time.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Two runners on a track going in opposite directions: to know where each will be, you follow each\nrunner separately.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Two dots, opposite directions<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"100\" r=\"8\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><circle cx=\"100\" cy=\"100\" r=\"8\" class=\"ab-w\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"20\" r=\"8\" class=\"ab-b\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-b\"/><circle cx=\"100\" cy=\"20\" r=\"8\" class=\"ab-w\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"100\" r=\"8\" class=\"ab-b\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"100\" r=\"8\" class=\"ab-b\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-w\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<ol>\n<li>Black dot: one cell <strong>clockwise<\/strong> each time.<\/li>\n<li>White dot: one cell <strong>anticlockwise<\/strong> each time.<\/li>\n<li>Apply both moves once more.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L3-003,abs-L3-005\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Mixing up clockwise and anticlockwise<\/strong> when a dot is at the bottom of the grid (it moves to the left\nwhen going clockwise there). Picture a clock face if unsure.<\/p>\n<\/div>\n<h2 id=\"counting\">Counting sides, dots and steps<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Some rules are about <strong>how many<\/strong>: sides of a shape (triangle 3, square 4, pentagon 5, hexagon 6),\nnumber of dots, or a cycle that goes up and then starts again. Count — don't guess by eye.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Counting the stairs to your flat: you never look at the staircase and guess \"about twenty\"; you count.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Fewer sides each time, colours alternating<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><polygon points=\"60.0,45.0 73.0,52.5 73.0,67.5 60.0,75.0 47.0,67.5 47.0,52.5\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><polygon points=\"60.0,45.0 74.3,55.4 68.8,72.1 51.2,72.1 45.7,55.4\" class=\"ab-g\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><polygon points=\"60.0,45.0 73.0,67.5 47.0,67.5\" class=\"ab-g\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><polygon points=\"60.0,45.0 73.0,52.5 73.0,67.5 60.0,75.0 47.0,67.5 47.0,52.5\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><polygon points=\"60.0,45.0 74.3,55.4 68.8,72.1 51.2,72.1 45.7,55.4\" class=\"ab-g\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<ol>\n<li>Sides: 6 → 5 → 4 → 3, then back to 6: a <strong>cycle<\/strong> that loses one side each time.<\/li>\n<li>Colour: white, grey, white, grey… — alternation.<\/li>\n<li>Next: 5 sides (pentagon), grey.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L3-004,abs-L3-006\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Pentagons and hexagons look alike at a glance. <strong>Count the corners<\/strong> with your eyes, one by one.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>When a series \"makes no sense\", try the three families in order: <strong>different step sizes? two objects\nmoving separately? a count that cycles?<\/strong><\/p>\n<\/div>", "sections": [{"id": "alternation", "title": "Alternation"}, {"id": "movement", "title": "Movement around a grid"}, {"id": "counting", "title": "Counting sides, dots and steps"}], "override": false}, "abstract/L4": {"meta": {"module": "abstract", "level": "L4", "title": "Fast methods", "status": "draft", "introduces": ["checklist", "abstract-elimination"], "uses": ["features", "single-rule", "two-rules", "alternation", "movement", "counting"], "source_refs": [{"short": "baneth2023", "loc": "p280", "note": "eliminate answer options based on each rule identified"}, {"short": "baneth2023", "loc": "p286", "note": "how to approach abstract reasoning tests"}], "minutes": 35, "generated_at": "2026-10-14 08:00:00+00:00"}, "html": "<p>With about <strong>one minute per question<\/strong> (TO VERIFY), a fixed routine is your best friend. It turns every\nquestion into the same short list of checks.<\/p>\n<h2 id=\"checklist\">The feature checklist<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Go through the same <button type=\"button\" class=\"gl\" data-term=\"checklist\">checklist<\/button> every time, in the same order, comparing figure 1 with figure 2\n(then confirming with the others):\n<strong>1. Position → 2. Direction → 3. Number → 4. Colour → 5. Shape → 6. Size.<\/strong>\nNote each feature that changes and how.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Pilots use a checklist before take-off even after thousands of flights — not because they forget, but\nbecause a checklist never skips a step under pressure.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Three rules with the checklist<\/p>\n<div class=\"ab-series\">\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 1\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"60.0,45.0 73.0,67.5 47.0,67.5\" class=\"ab-w\"/><\/svg><span>1<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 2\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-b\"/><\/svg><span>2<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 3\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"20\" r=\"8\" class=\"ab-b\"/><polygon points=\"60.0,45.0 74.3,55.4 68.8,72.1 51.2,72.1 45.7,55.4\" class=\"ab-w\"/><\/svg><span>3<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 4\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"60\" r=\"8\" class=\"ab-b\"/><polygon points=\"60.0,45.0 73.0,67.5 47.0,67.5\" class=\"ab-b\"/><\/svg><span>4<\/span><\/div>\n<div class=\"ab-cell\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"figure 5\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"100\" cy=\"100\" r=\"8\" class=\"ab-b\"/><polygon points=\"70.6,49.4 70.6,70.6 49.4,70.6 49.4,49.4\" class=\"ab-w\"/><\/svg><span>5<\/span><\/div>\n<div class=\"ab-cell ab-ans\"><svg viewBox=\"-2 -2 124 124\" width=\"80\" height=\"80\" class=\"ab-fig\" role=\"img\" aria-label=\"the next figure\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"100\" r=\"8\" class=\"ab-b\"/><polygon points=\"60.0,45.0 74.3,55.4 68.8,72.1 51.2,72.1 45.7,55.4\" class=\"ab-b\"/><\/svg><span>next<\/span><\/div>\n<\/div>\n<ol>\n<li><strong>Position:<\/strong> the black dot moves one cell clockwise. ✓ rule 1<\/li>\n<li><strong>Direction:<\/strong> nothing turns.<\/li>\n<li><strong>Number:<\/strong> nothing is added or removed.<\/li>\n<li><strong>Colour:<\/strong> the shape alternates white / black. ✓ rule 2<\/li>\n<li><strong>Shape:<\/strong> triangle → square → pentagon → triangle… ✓ rule 3<\/li>\n<li><strong>Size:<\/strong> unchanged.\nThree rules found in about 20 seconds.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L4-001,abs-L4-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Skipping a step \"because it doesn't seem to change\". The checklist only works if you run it fully —\nit takes seconds.<\/p>\n<\/div>\n<h2 id=\"abstract-elimination\">Eliminating feature by feature<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>You don't need to picture the answer in full. Take <strong>rule 1<\/strong> and cross out every option that breaks it.\nThen rule 2 on the options left. Then rule 3. Often you are down to one option before you've checked\nevery rule.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Looking for a friend in a crowd: \"tall\" — ignore everyone short; \"red coat\" — ignore everyone else. Two\nfilters and you've found them.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Elimination in practice<\/p>\n<ol>\n<li>Rule 1 (dot position): options A, C and E have the dot in the right cell — B and D are out.<\/li>\n<li>Rule 2 (colour): of A, C, E only A and E have the right colour — C is out.<\/li>\n<li>Rule 3 (shape): only E has the right shape. <strong>Answer: E.<\/strong>\nEach step uses one feature only — no need to look at whole figures.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L4-003,abs-L4-004\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p>Eliminating on the <strong>easiest<\/strong> rule only and then guessing. If two or more options remain, there is\nanother rule — run the checklist only on the features in which those options differ.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>If after one minute you are down to two options, choose one, flag the question and move on.\nA 50/50 guess is worth taking.<\/p>\n<\/div>", "sections": [{"id": "checklist", "title": "The feature checklist"}, {"id": "abstract-elimination", "title": "Eliminating feature by feature"}], "override": false}, "abstract/L5": {"meta": {"module": "abstract", "level": "L5", "title": "Exam simulation", "status": "draft", "introduces": ["abstract-exam-strategy"], "uses": ["checklist", "abstract-elimination", "alternation", "movement", "counting", "two-rules"], "source_refs": [{"short": "baneth2023", "loc": "p286", "note": "approach and practice"}, {"short": "franco1", "loc": "p6", "note": "numerical and abstract can offset each other (combined pass mark)"}], "minutes": 40, "generated_at": "2026-10-14 08:15:00+00:00"}, "html": "<p>Abstract is the fastest test: <strong>10 questions in 10 minutes<\/strong> (TO VERIFY). Remember the most useful\nfact in this guide: abstract shares its pass mark with numerical — <strong>every abstract point you win\nmakes the numerical test less important.<\/strong><\/p>\n<h2 id=\"abstract-exam-strategy\">Abstract exam strategy<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>One minute per question. Run the checklist, eliminate options rule by rule, and <strong>never get stuck<\/strong>:\nat the one-minute mark, choose the best remaining option, flag it, move on.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Like a quick crossword round: you fill in the ones you see immediately and come back to the others\nif there's time.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Your 60 seconds<\/p>\n<ol>\n<li><strong>0–20 s:<\/strong> checklist on figures 1 → 2 (position, direction, number, colour, shape, size).<\/li>\n<li><strong>20–35 s:<\/strong> confirm the rules on figures 3, 4, 5.<\/li>\n<li><strong>35–50 s:<\/strong> eliminate options rule by rule.<\/li>\n<li><strong>50–60 s:<\/strong> click. If two options are left, pick one and flag it.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"abs-L5-E01\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Spending three minutes on one figure.<\/strong> Ten questions in ten minutes leaves no room for that. A\nquick guess on a hard one is the professional choice.<\/p>\n<\/div>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Before the test, warm up with two or three simple series (Level 1). Starting the real test with your\n\"pattern eyes\" already switched on makes the first questions much faster.<\/p>\n<\/div>\n<h2>Ready?<\/h2>\n<p>There are 20 exam-style questions in timed mode — two full tests of 10.\n<a href=\"#/timed/abstract\">Start a timed abstract test<\/a>.<\/p>", "sections": [{"id": "abstract-exam-strategy", "title": "Abstract exam strategy"}], "override": false}, "exam/L0": {"meta": {"module": "exam", "level": "L0", "title": "The last days and the test itself", "status": "draft", "introduces": ["tech-check", "panic-plan"], "uses": ["test-format", "combined-pass-mark", "calm-toolkit"], "source_refs": [{"short": "baneth2023", "loc": "p45", "note": "check your EPSO account; understand the scoring; prepare across the board"}], "minutes": 30, "generated_at": "2026-10-14 08:30:00+00:00"}, "html": "<p>You've done the work. This module is about arriving at the test <strong>rested, ready and calm<\/strong>, and\nknowing exactly what to do if something goes wrong.<\/p>\n<div class=\"box box-verify\">\n<p class=\"box-h\">TO VERIFY on the EPSO website<\/p>\n<p>How and where the tests take place (at home with remote supervision, or in a test centre), the\ntechnical requirements, what you may have on your desk, and whether a calculator and notepad are\nprovided — <strong>all of this is in your EPSO account and the invitation to the tests. Read it carefully at\nleast a week before.<\/strong> The checklist below is general advice, not the official rules.<\/p>\n<\/div>\n<h2 id=\"tech-check\">Remote test tech check<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>If the test is taken online under remote supervision (TO VERIFY), most last-minute problems are\n<strong>technical<\/strong>, not academic. A calm technical check a few days before removes most of the risk.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Before a long car trip you check fuel, tyres and the route the day before — not while leaving.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Your checklist (adapt it to the official instructions)<\/p>\n<ol>\n<li><strong>One week before:<\/strong> read the invitation in your EPSO account; note the date, time and time zone. Run any system check or practice test offered.<\/li>\n<li><strong>Computer:<\/strong> charger plugged in, updates installed beforehand (not on the morning), notifications switched off, other programs closed.<\/li>\n<li><strong>Internet:<\/strong> stable connection; if possible, a cable rather than Wi-Fi; ask others at home not to stream video during the test.<\/li>\n<li><strong>Room:<\/strong> quiet, well lit, door closed, desk cleared of everything not allowed (TO VERIFY what is allowed).<\/li>\n<li><strong>Documents:<\/strong> your ID card or passport ready, as required (TO VERIFY).<\/li>\n<li><strong>Body:<\/strong> water within reach if allowed, a light meal one or two hours before, bathroom right before you start.<\/li>\n<li><strong>Login:<\/strong> log in early, as the instructions say. Being ready 15 minutes early is a calm 15 minutes.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"exam-L0-001\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Installing updates or changing settings on the morning of the test.<\/strong> Do all of that the day before,\nthen don't touch the computer setup again.<\/p>\n<\/div>\n<h2 id=\"panic-plan\">If you panic mid-test<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>A moment of panic is normal — a hard question, a blank mind, a glance at the clock. Have a <strong>plan\nready in advance<\/strong>, so you don't have to think when it happens.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>Athletes rehearse what to do after a mistake: a short reset routine, then the next point. The mistake is\nover; the next point is new.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: The 20-second reset<\/p>\n<ol>\n<li><strong>Stop<\/strong> and take your hands off the mouse.<\/li>\n<li><strong>Breathe in a box:<\/strong> 4 seconds in, 4 hold, 4 out, 4 hold.<\/li>\n<li><strong>Say to yourself:<\/strong> \"One question. This one only.\"<\/li>\n<li><strong>Decide:<\/strong> if this question is the problem, guess, flag, and move to the next.<\/li>\n<li><strong>Continue<\/strong> — the next question is a fresh start.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"exam-L0-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Doing the maths of your score during the test<\/strong> (\"I've missed three, I've failed\"). You cannot know\nyour score while you're taking the test — and one hard question says nothing about the rest.<\/p>\n<\/div>\n<h2>The last two days<\/h2>\n<ul>\n<li><strong>Day −2:<\/strong> light review only — your mistakes bank and the \"common trap\" boxes. No new topics, no timed tests.<\/li>\n<li><strong>Day −1:<\/strong> 30–45 minutes at most. Prepare your desk and documents. Go for a walk. Sleep early.<\/li>\n<li><strong>Test day:<\/strong> a short warm-up (two simple abstract series, one percentage question), then stop. You are ready.<\/li>\n<\/ul>\n<div class=\"box box-strategy\">\n<p class=\"box-h\">Exam strategy<\/p>\n<p>Remember the key facts: <strong>verbal<\/strong> counts for ranking — read carefully; <strong>numerical + abstract<\/strong> share\none pass mark — a strong abstract score covers a weaker numerical one (TO VERIFY). And no blanks, ever.<\/p>\n<\/div>", "sections": [{"id": "tech-check", "title": "Remote test tech check"}, {"id": "panic-plan", "title": "If you panic mid-test"}], "override": false}, "eu-knowledge/L0": {"meta": {"module": "eu-knowledge", "level": "L0", "title": "Overview", "status": "draft", "introduces": ["eu-institutions"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p36", "note": "return of EU knowledge testing; based on open-source information, not 'EU trivia'"}, {"short": "baneth2023", "loc": "p415", "note": "the EU knowledge test"}], "minutes": 30, "generated_at": "2026-10-14 08:45:00+00:00"}, "html": "<div class=\"box box-verify\">\n<p class=\"box-h\">TO VERIFY on the EPSO website<\/p>\n<p>This test belongs to the <strong>later stage<\/strong> of the competition (expected in 2027, only for candidates who\npass the reasoning tests). Format, number of questions and timing: <strong>TO VERIFY in the notice of\ncompetition.<\/strong> This page is a short orientation — full preparation comes after November.<\/p>\n<\/div>\n<p>According to the 2023 edition of the Ultimate EU Test Book, the EU knowledge test is based on freely\navailable information and aims to check how the EU works and what its policies are — <strong>not trivia<\/strong>.<\/p>\n<h2 id=\"eu-institutions\">The EU institutions<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The EU Treaties name seven institutions. Knowing <strong>who does what<\/strong> is the foundation for everything else.<\/p>\n<\/div>\n<table>\n<thead>\n<tr>\n<th>Institution<\/th>\n<th>Who / what<\/th>\n<th>Main role<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>European Parliament<\/td>\n<td>Members directly elected by EU citizens<\/td>\n<td>Adopts laws and the budget together with the Council<\/td>\n<\/tr>\n<tr>\n<td>European Council<\/td>\n<td>Heads of state or government + its President + Commission President<\/td>\n<td>Sets the EU's overall political direction (does not adopt laws)<\/td>\n<\/tr>\n<tr>\n<td>Council of the EU<\/td>\n<td>Ministers of the member states, by policy area<\/td>\n<td>Adopts laws and the budget together with the Parliament<\/td>\n<\/tr>\n<tr>\n<td>European Commission<\/td>\n<td>One Commissioner per member state<\/td>\n<td>Proposes laws, implements policies, ensures EU law is applied<\/td>\n<\/tr>\n<tr>\n<td>Court of Justice of the EU<\/td>\n<td>Judges from the member states<\/td>\n<td>Ensures EU law is interpreted and applied in the same way everywhere<\/td>\n<\/tr>\n<tr>\n<td>European Central Bank<\/td>\n<td>—<\/td>\n<td>Monetary policy for the euro area<\/td>\n<\/tr>\n<tr>\n<td>European Court of Auditors<\/td>\n<td>—<\/td>\n<td>Checks how EU money is collected and spent<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>In a city: the council proposes and runs things (like the Commission), the elected assembly votes on\nrules (like the Parliament and Council together), and a court settles disputes about the rules.<\/p>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"eu-L0-001,eu-L0-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>European Council ≠ Council of the EU ≠ Council of Europe.<\/strong> The first two are EU institutions; the\nCouncil of Europe is a separate organisation (based in Strasbourg, home of the European Court of Human\nRights). Exam questions love this confusion.<\/p>\n<\/div>", "sections": [{"id": "eu-institutions", "title": "The EU institutions"}], "override": false}, "digital/L0": {"meta": {"module": "digital", "level": "L0", "title": "Overview", "status": "draft", "introduces": ["digital-basics"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p405", "note": "digital literacy tests: what is known"}, {"short": "baneth2023", "loc": "p406", "note": "the basics of cybersecurity"}], "minutes": 25, "generated_at": "2026-10-14 09:00:00+00:00"}, "html": "<div class=\"box box-verify\">\n<p class=\"box-h\">TO VERIFY on the EPSO website<\/p>\n<p>Digital skills are tested in the <strong>later stage<\/strong> of the competition (expected in 2027). Format and\nscoring: <strong>TO VERIFY in the notice of competition.<\/strong> According to the 2023 Ultimate EU Test Book, the\nquestions are multiple-choice, not meant for IT specialists, and focus on everyday digital work: tools,\ncommunication, information and safety.<\/p>\n<\/div>\n<h2 id=\"digital-basics\">Digital skills basics<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>The test checks whether you can work <strong>safely and sensibly<\/strong> with everyday digital tools: recognising\nonline threats, protecting data, choosing the right tool for a task, and judging whether information\nonline is reliable.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>You already do this: you don't open an attachment from a stranger, and you double-check a website\nbefore typing your card number.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: Five safety habits worth knowing by heart<\/p>\n<ol>\n<li><strong>Phishing:<\/strong> messages that pretend to be someone trustworthy to make you click a link or share data. Check the sender's real address; when in doubt, contact the sender another way.<\/li>\n<li><strong>Strong passwords:<\/strong> long passphrases, a different one for each account, kept in a password manager.<\/li>\n<li><strong>Multi-factor authentication (MFA):<\/strong> a second proof of identity (code, app, key) besides the password.<\/li>\n<li><strong>Updates:<\/strong> install security updates promptly — they fix known weaknesses.<\/li>\n<li><strong>Personal data:<\/strong> share only what is needed; in the EU, personal data is protected by the General Data Protection Regulation (GDPR).<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"dig-L0-001,dig-L0-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>\"It looks official, so it is.\"<\/strong> Logos and familiar layouts can be copied in seconds. Check the address, not\nthe appearance.<\/p>\n<\/div>", "sections": [{"id": "digital-basics", "title": "Digital skills basics"}], "override": false}, "essay/L0": {"meta": {"module": "essay", "level": "L0", "title": "Overview", "status": "draft", "introduces": ["essay-basics"], "uses": [], "source_refs": [{"short": "baneth2023", "loc": "p395", "note": "written test: analyse, structure, recommend"}, {"short": "baneth2023", "loc": "p401", "note": "focus on the core question; background traps"}, {"short": "baneth2023", "loc": "p403", "note": "marking: clear, structured, concise writing"}], "minutes": 25, "generated_at": "2026-10-14 09:15:00+00:00"}, "html": "<div class=\"box box-verify\">\n<p class=\"box-h\">TO VERIFY on the EPSO website<\/p>\n<p><strong>Source conflict, flagged:<\/strong> the 2023 Ultimate EU Test Book describes a written <strong>case study<\/strong>;\npreparation websites describe the AD5 2026 later stage as a short <strong>free-text essay<\/strong> (about 40 minutes,\nTO VERIFY). Check the notice of competition. The advice below works for both.<\/p>\n<\/div>\n<h2 id=\"essay-basics\">Essay basics<\/h2>\n<div class=\"box box-idea\">\n<p class=\"box-h\">The idea<\/p>\n<p>Markers look for a <strong>clear answer to the question asked<\/strong>, a logical structure, relevant arguments\nand correct, concise language. A short, well-organised text beats a long, wandering one.<\/p>\n<\/div>\n<div class=\"box box-everyday\">\n<p class=\"box-h\">In everyday life<\/p>\n<p>A good work email: the main point in the first lines, reasons in short paragraphs, a clear next step at\nthe end. An essay for EPSO is built the same way.<\/p>\n<\/div>\n<div class=\"box box-worked\">\n<p class=\"box-h\">Worked example: A 40-minute plan (adapt to the real timing)<\/p>\n<ol>\n<li><strong>5 min — understand and plan:<\/strong> underline what is asked; write 3 key points and your conclusion.<\/li>\n<li><strong>28 min — write:<\/strong> introduction (your answer in 2–3 sentences) → 2–3 paragraphs, one argument each, with an example → conclusion.<\/li>\n<li><strong>7 min — check:<\/strong> does every paragraph answer the question? Fix spelling and long sentences.<\/li>\n<\/ol>\n<\/div>\n<div class=\"quiz-embed\" data-ids=\"ess-L0-001,ess-L0-002\"><\/div>\n\n<div class=\"box box-trap\">\n<p class=\"box-h\">Common trap<\/p>\n<p><strong>Answering a different question<\/strong> — the one you prepared, or something mentioned in the background\nmaterial. Re-read the question when you finish your plan, and again before your conclusion.<\/p>\n<\/div>", "sections": [{"id": "essay-basics", "title": "Essay basics"}], "override": false}}, "items": [{"id": "abs-L0-001", "module": "abstract", "level": "L0", "concept": "features", "difficulty": 1, "kind": "practice", "answer": 0, "time_s": 75, "source": {"short": "baneth2023", "loc": "p278", "note": "building blocks and rules of abstract items"}, "stem": "<p>Which figure comes next in the series?<\/p><div class=\"ab-series\"><div class=\"ab-cell\"><svg le continues into figure 6. The small dots: its colour repeats the cycle black → grey → white → …. The small dots: 1 fewer dot each time. The black dot: it moves 2 cells anticlockwise around the edge each time.<\/p>"}, {"text": "<svg viewBox=\"-2 -2 124 124\" width=\"76\" height=\"76\" class=\"ab-fig ab-opt\" role=\"img\" aria-label=\"option B\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"20\" cy=\"20\" r=\"8\" class=\"ab-b\"/><\/svg>", "explanation": "<p>Almost! Everything is right except the small dots: its colour repeats the cycle black → grey → white → …, so in figure 6 its colour should be <strong>white<\/strong> — here it is grey.<\/p>"}, {"text": "<svg viewBox=\"-2 -2 124 124\" width=\"76\" height=\"76\" class=\"ab-fig ab-opt\" role=\"img\" aria-label=\"option C\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"40\" x2=\"120\" y2=\"40\" class=\"ab-grid\"/><line x1=\"80\" y1=\"0\" x2=\"80\" y2=\"120\" class=\"ab-grid\"/><line x1=\"0\" y1=\"80\" x2=\"120\" y2=\"80\" class=\"ab-grid\"/><circle cx=\"60\" cy=\"20\" r=\"8\" class=\"ab-b\"/><\/svg>", "explanation": "<p>Almost! Everything is right except the black dot: it moves 2 cells anticlockwise around the edge each time, so in figure 6 its position should be <strong>the top-left cell<\/strong> — here it is the top cell.<\/p>"}, {"text": "<svg viewBox=\"-2 -2 124 124\" width=\"76\" height=\"76\" class=\"ab-fig ab-opt\" role=\"img\" aria-label=\"option D\"><rect x=\"0\" y=\"0\" width=\"120\" height=\"120\" rx=\"4\" class=\"ab-frame\"/><line x1=\"40\" y1=\"0\" x2=\"40\" y2=\"120\" class=\"ab-grid\
